ot loss of all responsibility or unfavorable comparison.`,rationale:`School-age children benefit from meaningful participation and achievable success, not loss of all responsibility or unfavorable comparison.`,options:[{id:`o0`,text:`Teach a manageable self-care skill, recognize progress, and help maintain appropriate school and peer contact.`,correct:!0,reason:`Achievable tasks and connection support industry and competence.`},{id:`o1`,text:`Compare the child's progress with a faster-recovering roommate.`,correct:!1,reason:`Competitive comparison can intensify feelings of inferiority.`},{id:`o2`,text:`Explain that peers are unimportant until adolescence.`,correct:!1,reason:`Peer relationships are already important in school-age development.`},{id:`o3`,text:`Complete every task for the child to avoid any possibility of failure.`,correct:!1,reason:`Removing all participation can reinforce inferiority and dependence.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — School-age care.`},{label:`ATI RN Nursing Care of Children, edition 11 — related school-age care content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 67`},{id:`q68`,topic:`Growth`,area:`growth_toddler`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Teaching`,`Safety`],stem:`A caregiver says, "My 2-year-old goes up stairs one step at a time while holding the railing, so I removed the stair gate and let the child practice alone." Which response is best?`,clue:`Developmental ability and safety readiness are not identical. Teach protection while allowing appropriate supervised learning.`,rationale:`Developmental ability and safety readiness are not identical. Teach protection while allowing appropriate supervised learning.`,options:[{id:`o0`,text:`Explain that emerging stair skills do not establish independent safety; continue close supervision and appropriate barriers.`,correct:!0,reason:`The skill can fit the developmental period, but judgment, balance, and hazard awareness remain immature.`},{id:`o1`,text:`Agree that one successful climb means supervision is no longer needed.`,correct:!1,reason:`Demonstrating a skill once does not eliminate fall risk.`},{id:`o2`,text:`Diagnose a developmental delay because alternating feet are required at age 2.`,correct:!1,reason:`Alternating-foot stair use develops later; this description alone does not establish delay.`},{id:`o3`,text:`Tell the caregiver to discourage all climbing until school age.`,correct:!1,reason:`Safe supervised practice supports development; complete avoidance is unnecessary.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Toddler safety.`},{label:`ATI RN Nursing Care of Children, edition 11 — related toddler safety content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 68`},{id:`q69`,topic:`Growth`,area:`growth_safety`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Care management`,`Safety`],stem:`The nurse reviews two healthy patients with no vaccine contraindications. A 4-year-old received all routine doses through 18 months but none of the 4-6-year boosters. An 18-year-old entering a college residence hall received MenACWY only at age 11. Which plans are appropriate? Select all that apply.`,clue:`Reconcile actual records before vaccinating. Age, prior valid doses, and intervals determine the plan; MenB counseling is a separate decision from completing MenACWY protection.`,rationale:`Reconcile actual records before vaccinating. Age, prior valid doses, and intervals determine the plan; MenB counseling is a separate decision from completing MenACWY protection.`,options:[{id:`o0`,text:`Plan the 4-year-old's final routine IPV dose after checking minimum intervals.`,correct:!0,reason:`The final routine IPV dose is given at age 4 years or older with the required interval.`},{id:`o1`,text:`Plan the 4-year-old's second MMR and varicella doses.`,correct:!0,reason:`These are routine 4-6-year doses for a child with the stated earlier series.`},{id:`o2`,text:`Use a MenB dose as a substitute for the college student's missing MenACWY booster.`,correct:!1,reason:`MenB and MenACWY cover different serogroups and are not interchangeable.`},{id:`o3`,text:`Plan a MenACWY dose for the college student.`,correct:!0,reason:`A dose given only at age 11 does not provide the recommended later adolescent booster coverage.`},{id:`o4`,text:`Plan the 4-year-old's DTaP booster after verifying the documented doses and intervals.`,correct:!0,reason:`The routine DTaP series includes a 4-6-year booster when the earlier doses were given as described.`},{id:`o5`,text:`Restart the 4-year-old's completed hepatitis B series because kindergarten is approaching.`,correct:!1,reason:`A completed valid series is not restarted merely for school entry.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Immunization.`},{label:`ATI RN Nursing Care of Children, edition 11 — related immunization content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`},{label:`CDC · Child immunization schedule notes (consult current schedule)`,url:`https://www.cdc.gov/vaccines/hcp/imz-schedules/child-adolescent-notes.html`},{label:`CDC · Meningococcal vaccine recommendations`,url:`https://www.cdc.gov/meningococcal/hcp/vaccine-recommendations/`}],origin:`Original PDF question 69`},{id:`q70`,topic:`Growth`,area:`growth_safety`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Safety`],stem:`During anticipatory guidance for a 10-year-old, which caregiver statement most clearly requires correction?`,clue:`Independence should increase with development while evidence-based protection remains in place. Correct the specific unsafe practice rather than discouraging all autonomy.`,rationale:`Independence should increase with development while evidence-based protection remains in place. Correct the specific unsafe practice rather than discouraging all autonomy.`,options:[{id:`o0`,text:`"We use a helmet on every bicycle ride, including short rides."`,correct:!1,reason:`Consistent helmet use supports injury prevention.`},{id:`o1`,text:`"We review an emergency contact plan before allowing time at home without me."`,correct:!1,reason:`Planning and assessment of readiness support safer independence.`},{id:`o2`,text:`"We check who supervises swimming rather than assuming another adult is watching."`,correct:!1,reason:`Defined active supervision reduces water-injury risk.`},{id:`o3`,text:`"My child wears a seat belt correctly, so the front passenger seat is as safe as the back seat."`,correct:!0,reason:`Children younger than 13 should ride in the back seat; proper belt fit does not eliminate front-airbag risk.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Transportation safety.`},{label:`ATI RN Nursing Care of Children, edition 11 — related transportation safety content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 70`},{id:`q71`,topic:`Skin`,area:`skin_infection`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Pharmacology`],stem:`A child with localized impetigo has used prescribed topical mupirocin for two days. Today the lesions are spreading, the surrounding skin is warm and tender, and the child has fever. What should the nurse advise?`,clue:`Treatment response must be evaluated by the whole clinical trend. New fever and spreading inflammation require a revised assessment.`,rationale:`Treatment response must be evaluated by the whole clinical trend. New fever and spreading inflammation require a revised assessment.`,options:[{id:`o0`,text:`Stop all antibiotics because crusting means the infection has resolved.`,correct:!1,reason:`Spreading lesions and fever contradict resolution.`},{id:`o1`,text:`Replace the antibiotic with a potent topical steroid to suppress redness.`,correct:!1,reason:`Steroid monotherapy does not treat the infection and can mask progression.`},{id:`o2`,text:`Arrange prompt reassessment for spreading infection and possible need for systemic therapy.`,correct:!0,reason:`New systemic symptoms and expanding inflammation suggest that the original localized-treatment plan may be inadequate.`},{id:`o3`,text:`Increase the topical amount without contacting the prescriber.`,correct:!1,reason:`Dose escalation alone does not evaluate spreading infection or determine whether systemic treatment is needed.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Impetigo.`},{label:`Week 7 Children & Integumentary lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related impetigo content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 71`},{id:`q72`,topic:`Skin`,area:`skin_infection`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Pharmacology`,`Care management`],stem:`A child was treated for head lice yesterday with a product that specifies repeat treatment on day 9. No live crawling lice are seen, but attached nits remain. The caregiver asks to apply the product twice daily until every nit is gone. Which response is best?`,clue:`Avoid mistaking residual nits for proof of immediate treatment failure. Use the actual product instructions and assess living lice before escalating treatment.`,rationale:`Avoid mistaking residual nits for proof of immediate treatment failure. Use the actual product instructions and assess living lice before escalating treatment.`,options:[{id:`o0`,text:`Follow the product's retreatment schedule, remove nits as directed, and reassess for live lice rather than overapplying medication.`,correct:!0,reason:`Retreatment timing is product-specific; remaining nits alone do not justify excessive dosing.`},{id:`o1`,text:`Apply two different lice products together to overcome presumed resistance.`,correct:!1,reason:`Combining products can increase toxicity and should not be done without clinical guidance.`},{id:`o2`,text:`Stop checking the hair permanently because one treatment always kills all eggs.`,correct:!1,reason:`Products differ in egg activity, and follow-up may still be needed.`},{id:`o3`,text:`Use household insecticide spray on the child's scalp between doses.`,correct:!1,reason:`Environmental insecticide sprays are unsafe for treating a child's scalp.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Lice.`},{label:`Week 7 Children & Integumentary lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related lice content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`},{label:`CDC · Head lice treatment`,url:`https://www.cdc.gov/lice/treatment/index.html`}],origin:`Original PDF question 72`},{id:`q73`,topic:`Skin`,area:`skin_infection`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Care management`,`Pharmacology`],stem:`A child with scabies has prescribed permethrin treatment. Several household members have itching, and others have no symptoms. Which instructions should the nurse include? Select all that apply.`,clue:`Successful scabies control combines correct medication use, contact management, and practical cleaning. Persistent itch alone does not prove that mites survived.`,rationale:`Successful scabies control combines correct medication use, contact management, and practical cleaning. Persistent itch alone does not prove that mites survived.`,options:[{id:`o0`,text:`Treat household furniture with pesticide foggers while the child remains in the home.`,correct:!1,reason:`Fumigants are not recommended and create unnecessary toxic exposure.`},{id:`o1`,text:`Reapply the medication every few hours whenever any itching remains.`,correct:!1,reason:`Itching can persist after successful treatment; excessive application increases harm.`},{id:`o2`,text:`Arrange treatment of household and close contacts together as directed, including eligible contacts without symptoms.`,correct:!0,reason:`Symptoms may be delayed, and untreated contacts can cause reinfestation.`},{id:`o3`,text:`Wash recently used clothing, towels, and bedding with hot washing and drying, or seal unwashable items for the recommended interval.`,correct:!0,reason:`Environmental measures reduce re-exposure from recently used items.`},{id:`o4`,text:`Apply the child's prescribed product to the instructed areas for the full instructed contact time.`,correct:!0,reason:`Coverage, age-specific application, and duration affect treatment success.`},{id:`o5`,text:`Report new burrows, worsening lesions, or signs of skin infection after treatment.`,correct:!0,reason:`These findings can indicate ongoing infestation or a complication requiring reassessment.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Scabies.`},{label:`Week 7 Children & Integumentary lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related scabies content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`},{label:`CDC · Scabies treatment`,url:`https://www.cdc.gov/scabies/treatment/index.html`}],origin:`Original PDF question 73`},{id:`q74`,topic:`Skin`,area:`skin_dermatitis`,difficulty:2,kind:`MC`,skills:[`Care management`,`Pharmacology`,`Assessment`],stem:`A child with atopic dermatitis has very dry skin and worsening itch. The caregiver gives long hot baths and applies a prescribed topical corticosteroid over the entire body every day, including clear skin. Which teaching is most appropriate?`,clue:`Control eczema by restoring the barrier and using targeted anti-inflammatory treatment. More heat, friction, or steroid is not automatically better care.`,rationale:`Control eczema by restoring the barrier and using targeted anti-inflammatory treatment. More heat, friction, or steroid is not automatically better care.`,options:[{id:`o0`,text:`Stop all moisturizers so that inflamed areas can dry completely.`,correct:!1,reason:`Drying worsens barrier dysfunction and itching.`},{id:`o1`,text:`Scrub with an antibacterial brush before each steroid application.`,correct:!1,reason:`Friction and harsh cleansing can worsen inflammation and skin injury.`},{id:`o2`,text:`Increase the steroid strength without evaluation when the child scratches.`,correct:!1,reason:`Potency, location, age, and duration must be considered by the prescribing clinician.`},{id:`o3`,text:`Use brief lukewarm bathing, apply emollient promptly, and use the corticosteroid only as prescribed for affected areas.`,correct:!0,reason:`This supports the skin barrier while limiting unnecessary corticosteroid exposure.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Atopic dermatitis.`},{label:`Week 7 Children & Integumentary lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related atopic dermatitis content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 74`},{id:`q75`,topic:`Skin`,area:`skin_dermatitis`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`],stem:`An adolescent with psoriasis says the plaques are improving but reports new persistent swelling and stiffness in several finger joints. Which action is most appropriate?`,clue:`Evaluate the patient beyond visible lesions. Improvement in one part of a chronic condition does not exclude progression elsewhere.`,rationale:`Evaluate the patient beyond visible lesions. Improvement in one part of a chronic condition does not exclude progression elsewhere.`,options:[{id:`o0`,text:`Apply the skin cream directly over the joints as the only intervention.`,correct:!1,reason:`Topical skin treatment does not adequately evaluate or manage inflammatory joint disease.`},{id:`o1`,text:`Report the joint symptoms and arrange evaluation for possible psoriatic arthritis.`,correct:!0,reason:`Psoriasis can involve joints even when the skin appears to improve.`},{id:`o2`,text:`Reassure the adolescent that joint symptoms cannot be related to a skin disorder.`,correct:!1,reason:`This dismisses a recognized extra-cutaneous manifestation.`},{id:`o3`,text:`Recommend avoiding school because psoriasis is contagious.`,correct:!1,reason:`Psoriasis is not contagious, and unnecessary exclusion adds stigma.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Psoriasis.`},{label:`Week 7 Children & Integumentary lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related psoriasis content (supplement).`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — relevant section.`}],origin:`Original PDF question 75`},{id:`q76`,topic:`GI`,area:`gi_motility`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`],stem:`A 5-week-old has progressive nonbilious projectile vomiting, weight loss, and a palpable olive-like abdominal mass. Potassium is 2.9 mEq/L and bicarbonate is elevated. Pyloromyotomy is planned. Which preoperative priority should the nurse expect?`,clue:`Definitive surgery is necessary, but the physiologic deficits require correction first when clinically feasible. A surgical diagnosis does not erase resuscitation priorities.`,rationale:`Definitive surgery is necessary, but the physiologic deficits require correction first when clinically feasible. A surgical diagnosis does not erase resuscitation priorities.`,options:[{id:`o0`,text:`Give an oral potassium dose and send the infant directly to surgery without reassessment.`,correct:!1,reason:`The route and stabilization plan must account for vomiting, hydration, and safe electrolyte correction.`},{id:`o1`,text:`Feed concentrated formula to restore weight rapidly before transfer to the operating room.`,correct:!1,reason:`Oral feeding worsens vomiting and aspiration risk before correction of the obstruction.`},{id:`o2`,text:`Maintain NPO status and correct dehydration and electrolyte abnormalities with the prescribed IV plan before anesthesia.`,correct:!0,reason:`Pyloric obstruction causes losses that must be stabilized for safer surgery.`},{id:`o3`,text:`Delay IV access because metabolic alkalosis is a normal infant finding.`,correct:!1,reason:`Hypokalemic metabolic alkalosis and dehydration are clinically important complications.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Pyloric stenosis.`},{label:`Week 7 GI Dysfunction lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related pyloric stenosis content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 76`},{id:`q77`,topic:`GI`,area:`gi_emergency`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A child awaiting appendectomy reports sudden relief of right-lower-quadrant pain. Thirty minutes later, the abdomen is rigid, pain is generalized, and the pulse is rising. Which action has priority?`,clue:`Interpret pain changes over time. Sudden relief can precede worsening peritonitis; it is not automatically a successful outcome.`,rationale:`Interpret pain changes over time. Sudden relief can precede worsening peritonitis; it is not automatically a successful outcome.`,options:[{id:`o0`,text:`Offer a meal because the original focal pain has improved.`,correct:!1,reason:`Oral intake is unsafe with a potential surgical emergency.`},{id:`o1`,text:`Notify the surgical team immediately about possible perforation and support the prescribed NPO, IV, and antibiotic plan.`,correct:!0,reason:`Transient relief followed by generalized peritoneal findings suggests progression, not recovery.`},{id:`o2`,text:`Apply a heating pad to reduce abdominal muscle tension.`,correct:!1,reason:`Heat is not appropriate for suspected appendiceal perforation and may delay definitive care.`},{id:`o3`,text:`Give a cleansing enema before reassessing the abdomen.`,correct:!1,reason:`Enemas can worsen risk in suspected appendicitis and are not appropriate treatment.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Appendicitis.`},{label:`Week 7 GI Dysfunction lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related appendicitis content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 77`},{id:`q78`,topic:`GI`,area:`gi_emergency`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`],stem:`A stable 9-month-old with confirmed intussusception is being prepared for air-enema reduction. Before transfer, the child becomes lethargic, febrile, and hypotensive, with a rigid abdomen. What should the nurse do?`,clue:`Reassess suitability immediately before an intervention. A treatment appropriate for a stable child may be unsafe after deterioration.`,rationale:`Reassess suitability immediately before an intervention. A treatment appropriate for a stable child may be unsafe after deterioration.`,options:[{id:`o0`,text:`Proceed with the enema because it was ordered before the assessment changed.`,correct:!1,reason:`Orders must be reconsidered when the patient's condition changes materially.`},{id:`o1`,text:`Stop the routine transfer plan and urgently notify the team about possible perforation or peritonitis while supporting circulation.`,correct:!0,reason:`New instability and peritoneal signs may make enema reduction unsafe and require urgent surgical management.`},{id:`o2`,text:`Give an oral rehydration solution and repeat vital signs after the procedure.`,correct:!1,reason:`Shock and a possible perforation require IV resuscitation and reassessment before the procedure.`},{id:`o3`,text:`Wait for currant-jelly stool to confirm that intussusception is serious.`,correct:!1,reason:`The classic stool can be late or absent; current shock is sufficient reason to escalate.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Intussusception.`},{label:`Week 7 GI Dysfunction lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related intussusception content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 78`},{id:`q79`,topic:`GI`,area:`gi_emergency`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Safety`],stem:`The pediatric nurse receives four GI-related reports. Which child requires the first bedside assessment?`,clue:`Prioritize systemic illness and impaired perfusion over diagnostic labels. In Hirschsprung disease, new diarrhea can be a danger sign rather than relief of constipation.`,rationale:`Prioritize systemic illness and impaired perfusion over diagnostic labels. In Hirschsprung disease, new diarrhea can be a danger sign rather than relief of constipation.`,options:[{id:`o0`,text:`A child with treated constipation who passes a soft stool without blood and has normal vital signs.`,correct:!1,reason:`This suggests a response to the current plan rather than acute deterioration.`},{id:`o1`,text:`An infant with uncomplicated reflux who is gaining weight and sleeps supine on a firm, flat surface.`,correct:!1,reason:`Growth and safe sleep are reassuring in this report; reflux does not require prone or inclined sleep.`},{id:`o2`,text:`An infant with Hirschsprung disease who now has fever, increasing distention, explosive diarrhea, and poor perfusion.`,correct:!0,reason:`This suggests Hirschsprung-associated enterocolitis with possible sepsis; diarrhea does not exclude obstructive disease.`},{id:`o3`,text:`A child after successful intussusception reduction who is alert, pain-free, and has normal perfusion.`,correct:!1,reason:`Continued monitoring is required, but this report is stable compared with suspected enterocolitis.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Hirschsprung disease.`},{label:`Week 7 GI Dysfunction lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related hirschsprung disease content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`},{label:`AAP · Safe sleep for infants with reflux`,url:`https://www.healthychildren.org/English/tips-tools/ask-the-pediatrician/Pages/What-is-the-safest-sleep-solution-for-my-baby-with-reflux.aspx`}],origin:`Original PDF question 79`},{id:`q80`,topic:`GI`,area:`gi_emergency`,difficulty:3,kind:`SATA`,skills:[`Care management`,`Safety`,`Pharmacology`,`Priority`],stem:`A caregiver calls after finding a toddler beside an open acetaminophen bottle. The amount and time of possible ingestion are uncertain; the child is currently awake and breathing normally. Which instructions or anticipated care are appropriate? Select all that apply.`,clue:`Assess and act on exposure risk, not appearance alone. Activated charcoal, when indicated, is a separate decontamination treatment and is not the antidote.`,rationale:`Assess and act on exposure risk, not appearance alone. Activated charcoal, when indicated, is a separate decontamination treatment and is not the antidote.`,options:[{id:`o0`,text:`Seek emergency help immediately if the child becomes difficult to awaken, has a seizure, or develops breathing difficulty.`,correct:!0,reason:`These findings require emergency services and stabilization.`},{id:`o1`,text:`Expect the evaluation to consider timed acetaminophen levels and N-acetylcysteine when indicated.`,correct:!0,reason:`Levels and the exposure history guide care; N-acetylcysteine is the antidote for acetaminophen toxicity.`},{id:`o2`,text:`Give syrup of ipecac now to empty the stomach before symptoms begin.`,correct:!1,reason:`Induced vomiting is not recommended and can cause harm or delay effective treatment.`},{id:`o3`,text:`Wait for abdominal pain or jaundice before calling because the child appears well.`,correct:!1,reason:`Significant acetaminophen toxicity can initially cause few symptoms.`},{id:`o4`,text:`Contact Poison Control promptly with the bottle, possible amount, timing, and child's weight, and follow its urgent evaluation instructions.`,correct:!0,reason:`Early symptoms may be absent despite a toxic exposure; expert guidance should not be delayed.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Acetaminophen poisoning.`},{label:`Week 7 GI Dysfunction lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related acetaminophen poisoning content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`},{label:`Poison Control · First aid for poisonings`,url:`https://www.poison.org/first-aid-for-poisonings`}],origin:`Original PDF question 80`},{id:`e201`,topic:`Pregnancy`,area:`followup`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`],stem:`A patient at 12 weeks has persistent vomiting, a 4-kg weight loss, pulse 118/min, dry mucosa, and minimal urine output. Which plan should the nurse prioritize?`,options:[{id:`o0`,text:`Obtain IV access, check electrolytes, and begin prescribed rehydration.`,correct:!0,reason:`Findings indicate volume depletion and possible electrolyte disturbance, requiring stabilization.`},{id:`o1`,text:`Teach the patient to drink an entire glass of fluid with each meal.`,correct:!1,reason:`Large volumes may worsen vomiting and do not address current dehydration.`},{id:`o2`,text:`Arrange routine nutrition counseling for next month.`,correct:!1,reason:`Counseling is useful after the immediate physiologic problem is addressed.`},{id:`o3`,text:`Reassure the patient that all vomiting resolves without treatment.`,correct:!1,reason:`Weight loss and oliguria exceed uncomplicated nausea of pregnancy.`}],refs:[{label:`Week 4 Exam 2 High Risk Pregnancy Instructor Notes — Hyperemesis gravidarum.`},{label:`Week 4 High Risk Pregnancy lecture — slide(s) 10.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related hyperemesis gravidarum content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Vomiting is accompanied by objective dehydration and weight loss.`,rationale:`Stabilize fluid and electrolyte balance, administer prescribed antiemetics, and reassess urine output before advancing oral intake as tolerated.`},{id:`e202`,topic:`Pregnancy`,area:`bleeding`,difficulty:3,kind:`MC`,skills:[`Care management`,`Priority`,`Safety`],stem:`Following an incomplete pregnancy loss at 14 weeks, a patient passes large clots and becomes pale. BP is 88/50 mmHg. Another nurse is notifying the obstetric team. What should the primary nurse do first?`,options:[{id:`o0`,text:`Initiate hemorrhage measures and prepare for urgent uterine evacuation as ordered.`,correct:!0,reason:`Retained tissue can sustain bleeding; shock requires resuscitation and definitive treatment.`},{id:`o1`,text:`Ask the patient to walk to the bathroom to measure the next blood loss.`,correct:!1,reason:`Walking during shock increases fall risk and delays stabilization.`},{id:`o2`,text:`Complete bereavement paperwork before starting treatment.`,correct:!1,reason:`Emotional support continues, but paperwork cannot delay circulation support.`},{id:`o3`,text:`Wait for the hemoglobin result before starting prescribed fluids.`,correct:!1,reason:`Hemoglobin may initially underestimate acute blood loss.`}],refs:[{label:`Week 4 Exam 2 High Risk Pregnancy Instructor Notes — Spontaneous abortion.`},{label:`Week 4 High Risk Pregnancy lecture — slide(s) 4.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related spontaneous abortion content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Active bleeding plus hypotension indicates a circulation emergency.`,rationale:`Act on clinical deterioration. Obtain IV access, quantify bleeding, prepare blood and ordered treatment, and support the patient without delaying resuscitation.`},{id:`e203`,topic:`Pregnancy`,area:`followup`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Teaching`,`Safety`],stem:`A pregnant patient prescribed oral iron says, "The tablets make me constipated, so I stopped them." Which responses support safe treatment? Select all that apply.`,options:[{id:`o0`,text:`Discuss fluid, fiber, and an ordered bowel regimen.`,correct:!0,reason:`Managing adverse effects can improve adherence.`},{id:`o1`,text:`Explain that darker stools can occur with iron.`,correct:!0,reason:`This expected effect differs from symptomatic gastrointestinal bleeding.`},{id:`o2`,text:`Review taking iron apart from calcium supplements.`,correct:!0,reason:`Calcium can reduce iron absorption.`},{id:`o3`,text:`Advise doubling the dose whenever fatigue occurs.`,correct:!1,reason:`Dosing changes require a prescribed plan; fatigue has multiple causes.`},{id:`o4`,text:`Recommend stopping prenatal follow-up once energy improves.`,correct:!1,reason:`Follow-up laboratory testing is needed to assess correction.`}],refs:[{label:`Week 4 Exam 2 High Risk Pregnancy Instructor Notes — Iron-deficiency anemia.`},{label:`Week 4 High Risk Pregnancy lecture — slide(s) 20.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related iron-deficiency anemia content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A manageable adverse effect has interrupted treatment.`,rationale:`Address the barrier, reinforce correct administration, and monitor the response rather than using symptoms alone to change dosing.`},{id:`e204`,topic:`Pregnancy`,area:`followup`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`],stem:`A pregnant patient with cardiac disease reports new shortness of breath at rest and inability to lie flat. The nurse hears bilateral crackles. Which response is most appropriate?`,options:[{id:`o0`,text:`Position upright, assess oxygenation, and obtain urgent evaluation for decompensation.`,correct:!0,reason:`Rest dyspnea, orthopnea, and crackles suggest pulmonary congestion.`},{id:`o1`,text:`Encourage a liter of oral fluid to support the increased blood volume of pregnancy.`,correct:!1,reason:`Additional fluid may worsen congestion.`},{id:`o2`,text:`Schedule a discussion of exercise tolerance at the next visit.`,correct:!1,reason:`Symptoms at rest require current assessment, not routine follow-up.`},{id:`o3`,text:`Place the patient flat and reassure that breathlessness is expected.`,correct:!1,reason:`Supine positioning can worsen breathing and minimizes warning findings.`}],refs:[{label:`Week 4 Exam 2 High Risk Pregnancy Instructor Notes — Cardiac disease.`},{label:`Week 4 High Risk Pregnancy lecture — slide(s) 16.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related cardiac disease content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Symptoms occur at rest and include crackles.`,rationale:`Suspect cardiac decompensation. Support breathing, escalate promptly, and avoid automatic fluid loading while the team assesses the cause.`},{id:`e205`,topic:`Pregnancy`,area:`followup`,difficulty:2,kind:`MC`,skills:[`Care management`,`Teaching`,`Safety`],stem:`A patient with epilepsy stopped prescribed antiseizure medication after a positive pregnancy test because of concern about fetal harm. Which response is best?`,options:[{id:`o0`,text:`Arrange prompt prescriber review and explain that uncontrolled seizures also threaten maternal and fetal oxygenation.`,correct:!0,reason:`An individualized medication plan weighs seizure control against fetal medication risks.`},{id:`o1`,text:`Confirm that stopping all seizure medicines is the safest pregnancy plan.`,correct:!1,reason:`Abrupt withdrawal can provoke seizures and injury.`},{id:`o2`,text:`Instruct the patient to restart at twice the old dose.`,correct:!1,reason:`The nurse should not independently prescribe a replacement regimen.`},{id:`o3`,text:`Explain that any seizure in pregnancy will be treated as eclampsia.`,correct:!1,reason:`Epilepsy and eclampsia have different causes and management.`}],refs:[{label:`Week 4 Exam 2 High Risk Pregnancy Instructor Notes — Epilepsy during pregnancy.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related epilepsy during pregnancy content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The patient stopped therapy without an individualized pregnancy plan.`,rationale:`Support an informed medication review urgently. Do not endorse abrupt withdrawal or independently change doses.`},{id:`e206`,topic:`Pregnancy`,area:`followup`,difficulty:2,kind:`SATA`,skills:[`Teaching`,`Safety`,`Care management`],stem:`A pregnant daycare worker asks how to reduce cytomegalovirus exposure while caring for toddlers. Which instructions are appropriate? Select all that apply.`,options:[{id:`o0`,text:`Wash hands after diaper changes and contact with saliva.`,correct:!0,reason:`Urine and saliva are important exposure routes.`},{id:`o1`,text:`Avoid sharing toddlers' cups and utensils.`,correct:!0,reason:`Shared utensils can transfer saliva.`},{id:`o2`,text:`Clean toys and surfaces contaminated with body fluids.`,correct:!0,reason:`Environmental hygiene reduces contact with infectious secretions.`},{id:`o3`,text:`Take a routine CMV vaccine during this pregnancy.`,correct:!1,reason:`No routine licensed CMV vaccine is available for this purpose.`},{id:`o4`,text:`Wear gloves instead of performing hand hygiene.`,correct:!1,reason:`Gloves do not replace handwashing after contact or removal.`}],refs:[{label:`Week 4 Exam 2 High Risk Pregnancy Instructor Notes — Cytomegalovirus.`},{label:`Week 4 High Risk Pregnancy lecture — slide(s) 23.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related cytomegalovirus content (supplement).`},{label:`CDC · CMV exposure prevention`,url:`https://www.cdc.gov/cytomegalovirus/about/index.html`}],origin:`Original expanded-bank scenario`,clue:`Toddlers' urine and saliva are relevant exposures.`,rationale:`Reduce contact with body fluids through practical hygiene. A blanket instruction to use droplet precautions alone would miss important transmission opportunities.`},{id:`e207`,topic:`Pregnancy`,area:`hypertension`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Safety`],stem:`A patient discharged after a pregnancy complicated by hypertension calls on postpartum day 5 about a severe headache and flashing lights. Which instruction has priority?`,options:[{id:`o0`,text:`Seek urgent obstetric or emergency evaluation now.`,correct:!0,reason:`Postpartum preeclampsia and neurologic complications remain possible after delivery.`},{id:`o1`,text:`Wait until the routine postpartum appointment if swelling has improved.`,correct:!1,reason:`Improvement in swelling does not make neurologic symptoms safe.`},{id:`o2`,text:`Take a sleep aid and reassess the symptoms tomorrow.`,correct:!1,reason:`Sedation can mask deterioration and delay evaluation.`},{id:`o3`,text:`Stop prescribed antihypertensive medication because the placenta has delivered.`,correct:!1,reason:`Medication changes need assessment; delivery does not immediately remove risk.`}],refs:[{label:`Week 4 Exam 2 High Risk Pregnancy Instructor Notes — Hypertensive disorders.`},{label:`Week 4 High Risk Pregnancy lecture — slide(s) 13–15.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related hypertensive disorders content (supplement).`},{label:`ACOG · Preeclampsia and high blood pressure`,url:`https://www.acog.org/womens-health/faqs/preeclampsia-and-high-blood-pressure-during-pregnancy`}],origin:`Original expanded-bank scenario`,clue:`Severe headache and visual symptoms are danger signs even after birth.`,rationale:`Recognize postpartum deterioration promptly. The date of delivery is not a safety cutoff for hypertensive emergencies.`},{id:`e208`,topic:`Pregnancy`,area:`glucose`,difficulty:2,kind:`MC`,skills:[`Teaching`,`Care management`,`Safety`],stem:`At discharge after a pregnancy with gestational diabetes, the patient says, "My glucose is normal now, so I never need testing again." Which response is best?`,options:[{id:`o0`,text:`Explain the need for scheduled postpartum glucose testing and ongoing screening.`,correct:!0,reason:`Normal immediate postpartum values do not eliminate future diabetes risk.`},{id:`o1`,text:`Agree because all diabetes risk ends when the placenta delivers.`,correct:!1,reason:`Pregnancy-related insulin resistance falls, but later diabetes risk persists.`},{id:`o2`,text:`Advise continuing the full pregnancy insulin dose indefinitely.`,correct:!1,reason:`Postpartum medication needs must be reassessed and may decrease markedly.`},{id:`o3`,text:`Recommend screening only if the patient develops weight loss.`,correct:!1,reason:`Diabetes can be present without obvious symptoms.`}],refs:[{label:`Week 4 Exam 2 High Risk Pregnancy Instructor Notes — Gestational diabetes.`},{label:`Week 4 High Risk Pregnancy lecture — slide(s) 19.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related gestational diabetes content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Resolution of pregnancy-related hyperglycemia is not lifelong protection.`,rationale:`Reinforce the ordered postpartum testing plan and long-term follow-up. Do not automatically continue or discontinue medication without the care plan.`},{id:`e209`,topic:`Pregnancy`,area:`followup`,difficulty:2,kind:`MC`,skills:[`Care management`,`Teaching`,`Priority`],stem:`A pregnant adolescent misses two high-risk follow-up visits. Privately, the patient explains that transportation is unreliable. Which action best addresses the immediate barrier?`,options:[{id:`o0`,text:`Collaborate with care management on transportation and a workable appointment plan.`,correct:!0,reason:`This targets the stated access problem while maintaining needed surveillance.`},{id:`o1`,text:`Document the adolescent as unwilling to care for the fetus.`,correct:!1,reason:`A judgmental label does not address access and can damage trust.`},{id:`o2`,text:`Give a longer explanation of complications without discussing transportation.`,correct:!1,reason:`More information alone will not solve this barrier.`},{id:`o3`,text:`Cancel monitoring until the patient proves reliability.`,correct:!1,reason:`Withholding needed follow-up increases risk.`}],refs:[{label:`Week 4 Exam 2 High Risk Pregnancy Instructor Notes — Adolescent pregnancy.`},{label:`Week 4 High Risk Pregnancy lecture — slide(s) 2.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related adolescent pregnancy content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The patient has identified a concrete access barrier.`,rationale:`High-risk pregnancy care includes removing practical obstacles. Ask about needs and coordinate resources without assuming motivation or family circumstances.`},{id:`e210`,topic:`Labor`,area:`labor_medications`,difficulty:2,kind:`MC`,skills:[`Pharmacology`,`Safety`,`Care management`],stem:`The nurse is preparing an oxytocin induction. Which setup should be corrected before starting the infusion?`,options:[{id:`o0`,text:`Oxytocin is attached as a gravity-controlled secondary infusion.`,correct:!0,reason:`Oxytocin requires precise pump control and the ability to stop delivery immediately.`},{id:`o1`,text:`The medication tubing is connected at a port close to the patient.`,correct:!1,reason:`This supports prompt control when the infusion is stopped.`},{id:`o2`,text:`Uterine activity and fetal heart rate will be monitored continuously.`,correct:!1,reason:`Ongoing surveillance identifies tachysystole and fetal compromise.`},{id:`o3`,text:`The concentration and rate are independently verified according to policy.`,correct:!1,reason:`High-alert medication verification reduces dosing error.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Oxytocin administration.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 10.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related oxytocin administration content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A high-alert uterotonic is not being precisely controlled.`,rationale:`Verify the ordered concentration, pump, line configuration, and monitoring before administration. Uncontrolled flow can rapidly cause harm.`},{id:`e211`,topic:`Labor`,area:`labor_medications`,difficulty:3,kind:`MC`,skills:[`Pharmacology`,`Priority`,`Safety`],stem:`During cervical ripening with a removable dinoprostone vaginal insert, contractions become nearly continuous and recurrent late decelerations appear. Help is already being summoned. What should the nurse do?`,options:[{id:`o0`,text:`Remove the insert per protocol and initiate intrauterine resuscitative measures.`,correct:!0,reason:`Removing the ongoing stimulus is an immediate action for excessive uterine activity with fetal compromise.`},{id:`o1`,text:`Begin the planned oxytocin infusion to shorten labor.`,correct:!1,reason:`Adding a uterotonic can worsen tachysystole and hypoxemia.`},{id:`o2`,text:`Leave the insert until its full scheduled duration is complete.`,correct:!1,reason:`An adverse response overrides routine timing.`},{id:`o3`,text:`Ask the patient to push with every contraction.`,correct:!1,reason:`Pushing does not address the cause and may be inappropriate for dilation.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Cervical ripening.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 10.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related cervical ripening content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The uterotonic source is removable and the fetus is showing intolerance.`,rationale:`Stop the causative stimulation, reposition, assess, and escalate under protocol. Do not treat the prescribed duration as mandatory during deterioration.`},{id:`e212`,topic:`Labor`,area:`labor_medications`,difficulty:2,kind:`SATA`,skills:[`Pharmacology`,`Teaching`,`Safety`],stem:`A patient at 29 weeks receives magnesium sulfate for fetal neuroprotection before anticipated preterm birth. Which nursing actions are appropriate? Select all that apply.`,options:[{id:`o0`,text:`Trend respiratory rate and level of consciousness.`,correct:!0,reason:`Respiratory depression and increasing sedation may indicate toxicity.`},{id:`o1`,text:`Assess deep tendon reflexes and urine output.`,correct:!0,reason:`Reflex depression and impaired renal clearance are important safety signals.`},{id:`o2`,text:`Ensure the ordered antidote is readily available.`,correct:!0,reason:`Calcium gluconate is used for clinically significant magnesium toxicity.`},{id:`o3`,text:`Explain that magnesium is being given to mature fetal lungs.`,correct:!1,reason:`Corticosteroids, not magnesium, promote fetal lung maturity.`},{id:`o4`,text:`Increase the infusion independently whenever contractions recur.`,correct:!1,reason:`The neuroprotection order is not an unrestricted tocolysis titration order.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Magnesium sulfate.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 3.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related magnesium sulfate content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The indication is neuroprotection, but maternal toxicity monitoring still applies.`,rationale:`Distinguish the purpose of magnesium from betamethasone while applying the same careful respiratory, neurologic, and renal monitoring.`},{id:`e213`,topic:`Labor`,area:`labor_medications`,difficulty:3,kind:`MC`,skills:[`Pharmacology`,`Priority`,`Safety`],stem:`Before the next prescribed nifedipine dose for preterm contractions, the patient reports dizziness. BP is 82/46 mmHg. Which action is best?`,options:[{id:`o0`,text:`Hold the dose, support safe positioning, and notify the prescriber promptly.`,correct:!0,reason:`Significant symptomatic hypotension requires reassessment before more vasodilating medication.`},{id:`o1`,text:`Give the dose early because dizziness often occurs during labor.`,correct:!1,reason:`This could worsen hypotension and uteroplacental perfusion.`},{id:`o2`,text:`Have the patient walk to determine whether the dizziness resolves.`,correct:!1,reason:`Orthostasis increases the risk of a fall.`},{id:`o3`,text:`Document the finding and reassess after the dose.`,correct:!1,reason:`The abnormal assessment should inform administration before harm occurs.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Tocolytics.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 3.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related tocolytics content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The preadministration assessment reveals symptomatic hypotension.`,rationale:`Medication safety depends on the patient's current response, not simply the dosing time. Assess fetal status and follow the escalation plan.`},{id:`e214`,topic:`Labor`,area:`labor_medications`,difficulty:2,kind:`MC`,skills:[`Pharmacology`,`Teaching`,`Care management`],stem:`A patient receiving antenatal betamethasone has insulin-treated diabetes. Which additional monitoring is most important to coordinate?`,options:[{id:`o0`,text:`More frequent glucose assessment and a prescriber-directed insulin plan.`,correct:!0,reason:`Corticosteroids can raise glucose and alter medication requirements.`},{id:`o1`,text:`Discontinuation of all glucose checks until labor begins.`,correct:!1,reason:`Steroid-related hyperglycemia can occur before delivery.`},{id:`o2`,text:`Daily testing for urine protein as the only medication assessment.`,correct:!1,reason:`Protein testing does not evaluate the main steroid-related concern here.`},{id:`o3`,text:`Routine reduction of insulin by half without an order.`,correct:!1,reason:`Insulin requirements may increase; unsupervised reductions are unsafe.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Preterm labor medications.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 3.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related preterm labor medications content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A corticosteroid is being administered to a patient with diabetes.`,rationale:`Anticipate treatment effects on existing disease and coordinate monitoring and orders instead of withholding indicated fetal therapy automatically.`},{id:`e215`,topic:`Labor`,area:`labor_assessment`,difficulty:2,kind:`MC`,skills:[`Care management`,`Priority`,`Safety`],stem:`At 31 weeks, a patient calls about new pelvic pressure, a constant low backache, and watery vaginal discharge. What should the nurse recommend?`,options:[{id:`o0`,text:`Come for prompt obstetric assessment of possible preterm labor or membrane rupture.`,correct:!0,reason:`These subtle symptoms warrant evaluation before labor progresses.`},{id:`o1`,text:`Wait for severe abdominal pain before seeking care.`,correct:!1,reason:`Preterm labor can present without severe pain.`},{id:`o2`,text:`Perform a home digital examination to check dilation.`,correct:!1,reason:`Self-examination is unreliable and introduces infection risk.`},{id:`o3`,text:`Assume normal discharge because the fetus is moving.`,correct:!1,reason:`Fetal movement does not exclude labor or membrane rupture.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Preterm labor.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 3.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related preterm labor content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Several early warning signs occur before term.`,rationale:`Early recognition creates time for assessment and appropriate therapies. Do not require classic term-labor pain before responding.`},{id:`e216`,topic:`Labor`,area:`labor_assessment`,difficulty:3,kind:`MC`,skills:[`Care management`,`Priority`,`Safety`],stem:`An amniotomy is proposed for a laboring patient whose fetal head remains high and unengaged. What is the nurse's best response?`,options:[{id:`o0`,text:`Clarify the plan and discuss the increased risk of cord prolapse.`,correct:!0,reason:`A presenting part that does not fill the inlet leaves room for the cord to descend.`},{id:`o1`,text:`Prepare the instruments without mentioning station because the cervix is dilated.`,correct:!1,reason:`Dilation does not eliminate prolapse risk from an unengaged head.`},{id:`o2`,text:`Explain that rupturing membranes prevents all variable decelerations.`,correct:!1,reason:`Rupture can permit cord compression and prolapse.`},{id:`o3`,text:`Reposition the patient and independently rupture the membranes.`,correct:!1,reason:`Amniotomy is not an independent nursing intervention.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Amniotomy.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 10.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related amniotomy content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Fetal station affects the safety of membrane rupture.`,rationale:`Communicate a specific risk before the procedure. Confirm the obstetric plan and readiness to assess fetal status immediately afterward.`},{id:`e217`,topic:`Labor`,area:`labor_assessment`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Safety`,`Interprofessional collaboration`],stem:`Immediately after an uncomplicated amniotomy, which information should the nurse assess and document? Select all that apply.`,options:[{id:`o0`,text:`Fetal heart rate and any new decelerations.`,correct:!0,reason:`Sudden changes can signal cord compression or prolapse.`},{id:`o1`,text:`Time and characteristics of the amniotic fluid.`,correct:!0,reason:`Color, amount, and odor help establish a baseline and identify concerns.`},{id:`o2`,text:`Maternal temperature trends during ongoing labor.`,correct:!0,reason:`Membrane rupture increases the importance of infection surveillance.`},{id:`o3`,text:`Only the cervical dilation; fetal monitoring can stop.`,correct:!1,reason:`Dilation does not substitute for assessment after rupture.`},{id:`o4`,text:`A fixed diagnosis of infection whenever the fluid is clear.`,correct:!1,reason:`Clear fluid alone is not evidence of infection.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Amniotomy.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 10.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related amniotomy content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Membrane rupture changes immediate cord risk and ongoing infection risk.`,rationale:`Combine immediate fetal assessment with fluid documentation and continued maternal surveillance rather than recording the procedure alone.`},{id:`e218`,topic:`Labor`,area:`labor_assessment`,difficulty:3,kind:`MC`,skills:[`Care management`,`Priority`,`Safety`],stem:`During an ordered amnioinfusion, the uterus becomes firm between contractions, resting pressure rises, and almost no infused fluid returns. Which action has priority?`,options:[{id:`o0`,text:`Stop the infusion and promptly report possible uterine overdistension.`,correct:!0,reason:`Retained fluid and elevated resting tone suggest a dangerous response.`},{id:`o1`,text:`Increase the rate until fluid appears on the pad.`,correct:!1,reason:`More fluid may worsen overdistension and compromise perfusion.`},{id:`o2`,text:`Continue because absent return means the fetus absorbed the fluid.`,correct:!1,reason:`Fetal absorption is not an explanation for ignoring rising uterine pressure.`},{id:`o3`,text:`Remove the intrauterine pressure catheter and restart blindly.`,correct:!1,reason:`Catheter management requires assessment and an authorized plan.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Amnioinfusion.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 10.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related amnioinfusion content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Infused fluid is not returning and uterine resting tone is rising.`,rationale:`Assess both infusion input and return. Stop a treatment producing a harmful physiologic response and obtain immediate obstetric review.`},{id:`e219`,topic:`Labor`,area:`labor_assessment`,difficulty:1,kind:`MC`,skills:[`Teaching`,`Care management`],stem:`A laboring patient with an occiput-posterior fetal position reports intense low back pain. Fetal status is reassuring. Which nursing intervention is reasonable to try?`,options:[{id:`o0`,text:`Assist into hands-and-knees positioning if tolerated.`,correct:!0,reason:`This may reduce back pressure and encourage fetal rotation.`},{id:`o1`,text:`Insist the patient remain flat and motionless.`,correct:!1,reason:`This restricts a useful comfort and positioning intervention without indication.`},{id:`o2`,text:`Begin forceful fundal pressure with each contraction.`,correct:!1,reason:`Fundal pressure is not an appropriate response to posterior-position discomfort.`},{id:`o3`,text:`Tell the patient that back pain proves uterine rupture.`,correct:!1,reason:`Reassuring findings and known malposition do not establish rupture.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Dysfunctional labor.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 6.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related dysfunctional labor content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Stable maternal-fetal status permits a supportive positioning intervention.`,rationale:`Match intervention intensity to assessment. Continue surveillance while helping the patient try a position that can improve comfort.`},{id:`e220`,topic:`Labor`,area:`labor_assessment`,difficulty:2,kind:`MC`,skills:[`Care management`,`Teaching`,`Interprofessional collaboration`],stem:`After vaginal birth of the first twin, the family asks why ultrasound and fetal monitoring are continuing. Which explanation is best?`,options:[{id:`o0`,text:`The second fetus can change position after the first birth, so presentation and well-being must be reassessed.`,correct:!0,reason:`The new uterine space can alter presentation and the delivery plan.`},{id:`o1`,text:`The second twin must automatically be delivered by cesarean.`,correct:!1,reason:`Route depends on current assessment and obstetric circumstances.`},{id:`o2`,text:`No more monitoring is needed once the first twin is healthy.`,correct:!1,reason:`Each fetus needs separate assessment.`},{id:`o3`,text:`Monitoring is only for documentation and cannot change care.`,correct:!1,reason:`Findings can lead to urgent changes in management.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Multifetal pregnancy.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 6.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related multifetal pregnancy content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Delivery of one twin changes the conditions for the remaining fetus.`,rationale:`Coordinate reassessment and keep the team prepared for a different delivery approach if indicated.`},{id:`e221`,topic:`Labor`,area:`labor_surgery`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Safety`,`Interprofessional collaboration`],stem:`A stable patient is preparing for a scheduled cesarean birth. Which actions belong in the nursing safety check? Select all that apply.`,options:[{id:`o0`,text:`Verify consent and identify any unanswered questions for the surgeon.`,correct:!0,reason:`The nurse verifies completion and advocates for informed understanding.`},{id:`o1`,text:`Confirm antibiotic prophylaxis and allergies according to protocol.`,correct:!0,reason:`Appropriate perioperative prophylaxis reduces infection risk.`},{id:`o2`,text:`Apply ordered sequential compression devices.`,correct:!0,reason:`Mechanical prophylaxis helps reduce perioperative venous thromboembolism risk.`},{id:`o3`,text:`Give a full meal immediately before transfer to the operating room.`,correct:!1,reason:`This conflicts with the prescribed anesthesia fasting plan.`},{id:`o4`,text:`Skip fetal assessment because surgery is scheduled.`,correct:!1,reason:`Scheduled delivery still requires assessment of current maternal-fetal status.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Cesarean preoperative care.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 14.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related cesarean preoperative care content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A scheduled procedure still requires a complete safety check.`,rationale:`Prevent predictable surgical risks while identifying concerns before anesthesia and incision.`},{id:`e222`,topic:`Labor`,area:`labor_surgery`,difficulty:3,kind:`MC`,skills:[`Care management`,`Priority`,`Safety`],stem:`Forty minutes after cesarean delivery, a patient's pulse rises to 126/min and BP falls to 86/48 mmHg. The abdomen is increasingly distended but the external dressing has little drainage. What should the nurse suspect and act on first?`,options:[{id:`o0`,text:`Possible concealed hemorrhage requiring urgent surgical assessment and resuscitation.`,correct:!0,reason:`Minimal external drainage does not exclude internal blood loss.`},{id:`o1`,text:`Normal postoperative gas requiring ambulation.`,correct:!1,reason:`Gas does not account for shock findings.`},{id:`o2`,text:`Adequate circulation because the dressing is dry.`,correct:!1,reason:`External dressing appearance cannot establish hemodynamic stability.`},{id:`o3`,text:`Anxiety best treated with a sedative before further assessment.`,correct:!1,reason:`Sedation could mask deterioration and delay hemorrhage treatment.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Cesarean postoperative care.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 14.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related cesarean postoperative care content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Hemodynamic deterioration is more important than a relatively clean dressing.`,rationale:`Assess for internal as well as external bleeding after surgery. Escalate immediately and support circulation under the hemorrhage protocol.`},{id:`e223`,topic:`Labor`,area:`labor_surgery`,difficulty:2,kind:`MC`,skills:[`Care management`,`Teaching`,`Safety`],stem:`On postoperative day 1 after cesarean birth, a stable patient avoids coughing because the incision hurts. Which response is best?`,options:[{id:`o0`,text:`Coordinate analgesia, teach incision splinting, and support breathing exercises and mobility.`,correct:!0,reason:`Pain control makes pulmonary hygiene and early movement more feasible.`},{id:`o1`,text:`Recommend complete bed rest until the incision no longer hurts.`,correct:!1,reason:`Prolonged immobility increases pulmonary and thromboembolic risk.`},{id:`o2`,text:`Withhold analgesia so the patient will stay alert enough to cough.`,correct:!1,reason:`Untreated pain itself limits breathing and movement.`},{id:`o3`,text:`Explain that pulmonary complications occur only after general anesthesia.`,correct:!1,reason:`Reduced ventilation and immobility can create risk after any abdominal surgery.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Cesarean postoperative care.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 14.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related cesarean postoperative care content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Pain is interfering with necessary recovery activities.`,rationale:`Combine comfort measures with prevention instead of making pain relief and safe mobilization competing goals.`},{id:`e224`,topic:`Labor`,area:`labor_surgery`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Safety`],stem:`Two days after cesarean delivery, a patient develops sudden pleuritic chest pain, dyspnea, and oxygen saturation 88%. Which response has priority?`,options:[{id:`o0`,text:`Activate emergency evaluation, support oxygenation, and assess for pulmonary embolism.`,correct:!0,reason:`Acute hypoxemia and chest pain after surgery are emergency findings.`},{id:`o1`,text:`Massage the calves to improve circulation.`,correct:!1,reason:`Massage is unsafe when venous thrombosis is possible.`},{id:`o2`,text:`Encourage walking to resolve postoperative gas pain.`,correct:!1,reason:`Exertion can worsen an unstable respiratory condition.`},{id:`o3`,text:`Reassess at the next scheduled set of vital signs.`,correct:!1,reason:`Delay is inappropriate with acute hypoxemia.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Cesarean complications.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 13–14.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related cesarean complications content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Sudden respiratory compromise occurs during a high-risk postoperative period.`,rationale:`Respond to airway and breathing deterioration immediately while the team evaluates the cause. Do not assume routine postoperative discomfort.`},{id:`e225`,topic:`Labor`,area:`labor_surgery`,difficulty:2,kind:`MC`,skills:[`Care management`,`Safety`,`Interprofessional collaboration`],stem:`A patient requests a trial of labor after cesarean birth. The abdominal skin scar is transverse, but the prior operative report is unavailable. What should the nurse do?`,options:[{id:`o0`,text:`Help obtain the operative report to confirm the uterine incision and discuss eligibility with the obstetric team.`,correct:!0,reason:`The skin incision does not reliably identify the uterine incision.`},{id:`o1`,text:`Record a low-transverse uterine incision based on the skin scar.`,correct:!1,reason:`This would substitute an assumption for operative evidence.`},{id:`o2`,text:`Promise that prior cesarean birth cannot increase rupture risk.`,correct:!1,reason:`Uterine rupture is an important TOLAC risk.`},{id:`o3`,text:`Decide independently that all repeat births require cesarean surgery.`,correct:!1,reason:`Eligibility depends on individualized obstetric assessment and patient preference.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Trial of labor after cesarean.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 15.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related trial of labor after cesarean content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The visible skin scar does not establish the prior uterine surgery.`,rationale:`Verify the relevant record before using it to support a delivery decision. Facilitate informed discussion without promising an outcome.`},{id:`e226`,topic:`Labor`,area:`labor_emergencies`,difficulty:3,kind:`MC`,skills:[`Priority`,`Safety`,`Interprofessional collaboration`],stem:`Immediately after birth, a patient suddenly becomes profoundly hypoxemic and hypotensive and begins oozing from IV sites. What is the nurse's priority?`,options:[{id:`o0`,text:`Activate the emergency response and support ventilation and circulation with the team.`,correct:!0,reason:`Cardiopulmonary collapse with coagulopathy requires immediate resuscitative care.`},{id:`o1`,text:`Wait for definitive confirmation of amniotic fluid embolism before intervening.`,correct:!1,reason:`Resuscitation cannot wait for diagnostic certainty.`},{id:`o2`,text:`Document a panic attack and offer paced breathing alone.`,correct:!1,reason:`Shock and abnormal bleeding are not explained by uncomplicated anxiety.`},{id:`o3`,text:`Transfer the patient to routine postpartum care for observation.`,correct:!1,reason:`This patient needs emergency-level monitoring and treatment.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Amniotic fluid embolism.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 21.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related amniotic fluid embolism content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Abrupt respiratory and circulatory collapse occurs with a bleeding disorder.`,rationale:`AFE is one possible cause, but the immediate priority is resuscitation and hemorrhage support while clinicians evaluate alternatives.`},{id:`e227`,topic:`Labor`,area:`labor_emergencies`,difficulty:3,kind:`SATA`,skills:[`Care management`,`Priority`,`Interprofessional collaboration`],stem:`A nurse is manually lifting the fetal presenting part off a prolapsed cord while the team prepares emergency birth. Which actions should the team support? Select all that apply.`,options:[{id:`o0`,text:`Maintain relief of pressure during transfer until another qualified clinician takes over or birth occurs.`,correct:!0,reason:`Releasing pressure prematurely can restore cord compression.`},{id:`o1`,text:`Continue fetal monitoring when feasible without delaying emergency delivery.`,correct:!0,reason:`Monitoring informs the team but must not obstruct definitive care.`},{id:`o2`,text:`Cover an exposed cord with sterile saline-moistened gauze.`,correct:!0,reason:`This helps protect the cord from drying while minimizing manipulation.`},{id:`o3`,text:`Push the cord repeatedly back through the cervix.`,correct:!1,reason:`Handling and repositioning the cord can worsen vasospasm and injury.`},{id:`o4`,text:`Ask the nurse to remove the hand to finish the chart before transfer.`,correct:!1,reason:`Documentation cannot interrupt the pressure-relieving intervention.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Umbilical cord prolapse.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 19.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related umbilical cord prolapse content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Pressure relief is a continuous bridge to expedited birth.`,rationale:`Coordinate roles so preparation, communication, monitoring, and cord protection occur without sacrificing the action preserving fetal perfusion.`},{id:`e228`,topic:`Labor`,area:`labor_emergencies`,difficulty:3,kind:`MC`,skills:[`Priority`,`Safety`,`Care management`],stem:`During shoulder dystocia, a staff member prepares to apply fundal pressure. Which action should the nurse take?`,options:[{id:`o0`,text:`Stop the proposed fundal pressure and assist with the directed McRoberts maneuver and suprapubic pressure.`,correct:!0,reason:`Fundal pressure can worsen impaction; these directed maneuvers address the obstruction.`},{id:`o1`,text:`Encourage stronger fundal pressure because the fetal head has delivered.`,correct:!1,reason:`This can worsen injury without freeing the impacted shoulder.`},{id:`o2`,text:`Pull firmly on the newborn's head to complete delivery.`,correct:!1,reason:`Excessive traction risks brachial plexus injury.`},{id:`o3`,text:`Delay all maneuvers until a family member consents again.`,correct:!1,reason:`The team must promptly manage the recognized obstetric emergency.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Shoulder dystocia.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 18.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related shoulder dystocia content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The proposed maneuver may worsen the shoulder impaction.`,rationale:`Advocate in real time against a harmful action and support the established emergency sequence with clear communication.`},{id:`e229`,topic:`Labor`,area:`labor_emergencies`,difficulty:2,kind:`MC`,skills:[`Care management`,`Interprofessional collaboration`,`Safety`],stem:`During an obstetric emergency, the team leader assigns one nurse to record events. Which documentation is most useful after shoulder dystocia?`,options:[{id:`o0`,text:`Time of head and body birth, personnel present, maneuvers performed, and maternal-newborn responses.`,correct:!0,reason:`A precise timeline and response record support continuity and review.`},{id:`o1`,text:`Only the final Apgar score because the emergency has ended.`,correct:!1,reason:`This omits essential events and maternal findings.`},{id:`o2`,text:`A guessed timeline completed before checking the actual times.`,correct:!1,reason:`Estimates presented as facts undermine accuracy.`},{id:`o3`,text:`Blame statements about who caused the obstruction.`,correct:!1,reason:`Objective findings and actions are clinically useful; speculation is not.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Shoulder dystocia documentation.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 18.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related shoulder dystocia documentation content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The record should preserve sequence, interventions, and response.`,rationale:`Accurate team documentation supports handoff and follow-up assessment without distracting clinicians from assigned emergency roles.`},{id:`e230`,topic:`Labor`,area:`labor_assessment`,difficulty:3,kind:`MC`,skills:[`Priority`,`Safety`,`Care management`],stem:`A patient with prolonged labor is exhausted and frightened. Contractions are weak, but the fetal tracing now shows recurrent late decelerations with minimal variability. What should the nurse address first?`,options:[{id:`o0`,text:`Initiate measures to improve fetal tolerance and obtain urgent obstetric reassessment.`,correct:!0,reason:`A deteriorating tracing takes priority over routine augmentation of weak contractions.`},{id:`o1`,text:`Start oxytocin immediately because weak contractions are the main problem.`,correct:!1,reason:`Augmentation can worsen fetal compromise before assessment and stabilization.`},{id:`o2`,text:`Focus exclusively on relaxation techniques until the patient sleeps.`,correct:!1,reason:`Emotional support is helpful but cannot replace response to abnormal fetal findings.`},{id:`o3`,text:`Encourage continuous pushing regardless of dilation.`,correct:!1,reason:`Pushing is not a treatment for impaired placental oxygen exchange.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Prolonged labor.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 6.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related prolonged labor content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`An abnormal fetal trend changes the priority of an otherwise reasonable labor plan.`,rationale:`Reassess before escalation of uterine stimulation. The plan must respond to the current condition of both patients.`},{id:`e231`,topic:`Labor`,area:`labor_medications`,difficulty:2,kind:`MC`,skills:[`Pharmacology`,`Safety`,`Care management`],stem:`Oxytocin 20 units is mixed in 1,000 mL of lactated Ringer's. The verified order is 6 milliunits/min. Which pump rate delivers the ordered dose?`,options:[{id:`o0`,text:`18 mL/hr.`,correct:!0,reason:`20,000 milliunits/1,000 mL = 20 milliunits/mL; 6 × 60 / 20 = 18 mL/hr.`},{id:`o1`,text:`3 mL/hr.`,correct:!1,reason:`This does not convert the ordered minute-based dose to the hourly pump rate correctly.`},{id:`o2`,text:`180 mL/hr.`,correct:!1,reason:`This is ten times the calculated rate.`},{id:`o3`,text:`30 mL/hr.`,correct:!1,reason:`At this concentration, 30 mL/hr delivers 10 milliunits/min.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Oxytocin calculation.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 10.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related oxytocin calculation content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The order uses milliunits per minute and the pump uses mL per hour.`,rationale:`Convert units first, then time. Independently verify high-alert medication calculations and pump programming according to policy.`},{id:`e232`,topic:`Labor`,area:`labor_medications`,difficulty:3,kind:`MC`,skills:[`Pharmacology`,`Priority`,`Safety`],stem:`A patient receiving magnesium sulfate has respirations 16/min and present reflexes, but urine output has fallen to 15 mL/hr for two hours. Which response is best?`,options:[{id:`o0`,text:`Promptly report reduced clearance and clarify whether the infusion should be held or adjusted under protocol.`,correct:!0,reason:`Magnesium can accumulate when renal clearance falls, even before respiratory depression appears.`},{id:`o1`,text:`Wait for absent reflexes before contacting the team.`,correct:!1,reason:`Waiting for late toxicity signs misses an opportunity to prevent harm.`},{id:`o2`,text:`Double maintenance fluid without reviewing the clinical condition.`,correct:!1,reason:`Fluid loading may be harmful, especially with preeclampsia.`},{id:`o3`,text:`Ignore the urine output because the respiratory rate is currently normal.`,correct:!1,reason:`A normal respiratory rate does not rule out evolving accumulation.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Magnesium sulfate monitoring.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 3.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related magnesium sulfate monitoring content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`An early change in clearance precedes overt toxicity.`,rationale:`Trend renal output and clinical findings together. Escalate the risk now rather than waiting for a severe adverse effect.`},{id:`e233`,topic:`Labor`,area:`labor_assessment`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Teaching`,`Safety`],stem:`A stable patient is being observed after PPROM at 30 weeks. Which findings should be reported promptly? Select all that apply.`,options:[{id:`o0`,text:`A temperature increase with new uterine tenderness.`,correct:!0,reason:`This raises concern for intraamniotic infection.`},{id:`o1`,text:`New foul-smelling vaginal fluid.`,correct:!0,reason:`A change in odor can indicate infection.`},{id:`o2`,text:`Sudden reduction in fetal movement or an abnormal fetal heart rate pattern.`,correct:!0,reason:`These may indicate fetal compromise.`},{id:`o3`,text:`Clear fluid continuing without a change in maternal or fetal status.`,correct:!1,reason:`Expected leakage still needs documentation but alone does not indicate new deterioration.`},{id:`o4`,text:`Questions about the neonatal unit.`,correct:!1,reason:`Education is important but is not an acute physiologic warning sign.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — PPROM.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 4.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related pprom content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Expectant management depends on recognizing infection or fetal compromise early.`,rationale:`Teach specific changes that trigger immediate reassessment; observation is active surveillance, not an absence of treatment.`},{id:`e234`,topic:`Labor`,area:`labor_surgery`,difficulty:3,kind:`MC`,skills:[`Care management`,`Priority`,`Safety`],stem:`After an assisted vaginal birth, the uterus remains firm and midline, but a continuous bright-red trickle persists and blood loss is increasing. Which action should the nurse prioritize?`,options:[{id:`o0`,text:`Notify the obstetric clinician for prompt evaluation of genital tract trauma while continuing hemorrhage assessment.`,correct:!0,reason:`Persistent bleeding with a well-contracted uterus suggests a nonatony source such as laceration.`},{id:`o1`,text:`Continue forceful fundal massage as the only intervention.`,correct:!1,reason:`A firm uterus does not need repeated forceful massage instead of evaluation of another source.`},{id:`o2`,text:`Reassess the pad in one hour because uterine tone is reassuring.`,correct:!1,reason:`Increasing ongoing blood loss warrants current action.`},{id:`o3`,text:`Insert a urinary catheter solely to treat presumed bladder distension.`,correct:!1,reason:`The uterus is midline and firm; the findings do not make bladder distension the leading issue.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Operative vaginal birth.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 11.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related operative vaginal birth content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Continued bleeding despite good uterine tone points beyond uterine atony.`,rationale:`Prioritize assessment of the bleeding source and circulation, and prepare for indicated repair instead of repeating an intervention that does not address the findings.`},{id:`e235`,topic:`Labor`,area:`labor_surgery`,difficulty:2,kind:`MC`,skills:[`Care management`,`Teaching`,`Interprofessional collaboration`],stem:`Following a vacuum-assisted birth, which information is especially important in the handoff to the newborn nurse?`,options:[{id:`o0`,text:`The assisted-birth details and the need to monitor scalp swelling, perfusion, and jaundice.`,correct:!0,reason:`Vacuum-associated injuries can evolve after the initial newborn assessment.`},{id:`o1`,text:`Only the mother's pain score and preferred feeding method.`,correct:!1,reason:`These do not communicate the newborn's specific trauma risk.`},{id:`o2`,text:`A guarantee that initial crying excludes all birth injury.`,correct:!1,reason:`Vigorous behavior does not exclude evolving hemorrhage or bruising-related jaundice.`},{id:`o3`,text:`Instructions to avoid further scalp assessment so the infant can rest.`,correct:!1,reason:`Appropriate ongoing assessment helps detect deterioration.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Operative vaginal birth.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 11.`},{label:`ATI RN M
