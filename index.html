aternal Newborn Nursing, edition 11 — related operative vaginal birth content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The delivery method creates a specific newborn surveillance need.`,rationale:`A targeted handoff connects the intrapartum event to subsequent monitoring instead of transmitting only routine information.`},{id:`e236`,topic:`Labor`,area:`labor_emergencies`,difficulty:3,kind:`MC`,skills:[`Care management`,`Priority`,`Safety`],stem:`A patient suddenly says, "The baby is coming," and the fetal head is visible. The provider has been called. Which action has priority?`,options:[{id:`o0`,text:`Stay with the patient, call additional help, and prepare to support a controlled birth within nursing scope.`,correct:!0,reason:`Imminent birth requires immediate attendance and readiness for both maternal and newborn care.`},{id:`o1`,text:`Leave to obtain the admission paperwork.`,correct:!1,reason:`The patient and newborn would be unattended during delivery.`},{id:`o2`,text:`Forcefully hold the head inside until the provider arrives.`,correct:!1,reason:`Forceful obstruction risks injury.`},{id:`o3`,text:`Send the patient walking to the delivery room.`,correct:!1,reason:`Transfer on foot during crowning is unsafe.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Precipitous labor.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 22.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related precipitous labor content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Birth is imminent, so leaving or obstructing it creates harm.`,rationale:`Mobilize help while remaining present. Support the delivery safely and anticipate neonatal support and maternal bleeding assessment.`},{id:`e237`,topic:`Labor`,area:`labor_assessment`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Safety`,`Interprofessional collaboration`],stem:`A fetal fibronectin specimen is ordered for a patient with symptoms of preterm labor. A digital cervical examination is also planned. What should the nurse clarify?`,options:[{id:`o0`,text:`Collect the ordered specimen before the digital examination according to collection instructions.`,correct:!0,reason:`Cervical manipulation can interfere with test interpretation.`},{id:`o1`,text:`Perform repeated digital examinations first to improve the specimen.`,correct:!1,reason:`Manipulation does not improve diagnostic validity.`},{id:`o2`,text:`Tell the patient a positive result proves delivery will occur today.`,correct:!1,reason:`A risk marker does not establish a certain timing of birth.`},{id:`o3`,text:`Omit clinical assessment if the test result is negative.`,correct:!1,reason:`Testing supplements, rather than replaces, clinical assessment.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Preterm labor assessment.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 3.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related preterm labor assessment content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The order of assessment can affect the validity of the specimen.`,rationale:`Protect diagnostic quality while explaining the limitations of prediction. Follow the assay's collection criteria and the clinical plan.`},{id:`e238`,topic:`Labor`,area:`labor_assessment`,difficulty:3,kind:`MC`,skills:[`Care management`,`Priority`,`Safety`],stem:`A patient at 39 weeks arrives for induction and reports new painful genital lesions. The nurse observes lesions consistent with active herpes. What is the priority response?`,options:[{id:`o0`,text:`Notify the obstetric clinician and clarify the delivery plan before starting induction.`,correct:!0,reason:`Active genital lesions can change the safest delivery approach because of neonatal exposure risk.`},{id:`o1`,text:`Begin induction and mention the lesions after delivery.`,correct:!1,reason:`Delayed communication may expose the newborn to avoidable risk.`},{id:`o2`,text:`Cover the lesions with a dressing and continue without review.`,correct:!1,reason:`A dressing does not establish safety for vaginal birth.`},{id:`o3`,text:`Assume lesions are irrelevant because the pregnancy is term.`,correct:!1,reason:`Gestational age does not remove neonatal infection risk.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Induction contraindications.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 9.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related induction contraindications content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A new assessment finding changes the risk of the planned route of birth.`,rationale:`Reassess suitability before implementing a previously appropriate plan. Communicate the current finding, not only the scheduled indication.`},{id:`e239`,topic:`Labor`,area:`labor_emergencies`,difficulty:3,kind:`SATA`,skills:[`Care management`,`Priority`,`Interprofessional collaboration`],stem:`During TOLAC, persistent fetal bradycardia develops with loss of fetal station and maternal hypotension. Which actions are appropriate while urgent surgery is organized? Select all that apply.`,options:[{id:`o0`,text:`Stop oxytocin if it is infusing.`,correct:!0,reason:`Additional uterine stimulation is unsafe with suspected rupture.`},{id:`o1`,text:`Activate hemorrhage preparation and ensure large-bore IV access.`,correct:!0,reason:`Maternal blood loss may rapidly become life-threatening.`},{id:`o2`,text:`Give a concise handoff including prior uterine surgery and the abrupt changes.`,correct:!0,reason:`The team needs the risk history and evidence of current deterioration.`},{id:`o3`,text:`Wait for visible heavy vaginal bleeding before escalating.`,correct:!1,reason:`Significant bleeding can be internal.`},{id:`o4`,text:`Continue coached pushing to regain the lost station.`,correct:!1,reason:`Pushing cannot repair the uterine disruption.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Uterine rupture.`},{label:`Week 5 HR Labor and Delivery lecture — slide(s) 20.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related uterine rupture content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Fetal compromise, loss of station, and maternal shock occur together after uterine surgery.`,rationale:`Treat suspected rupture as an obstetric emergency. Coordinated maternal resuscitation and rapid definitive delivery take priority over continued labor.`},{id:`e240`,topic:`Newborn`,area:`newborn_stability`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A 14-hour-old infant has become difficult to arouse, feeds poorly, and has an axillary temperature of 35.8°C. Maternal membranes were ruptured for 25 hours. Which action has priority?`,options:[{id:`o0`,text:`Assess breathing and perfusion and notify the neonatal team immediately for possible sepsis.`,correct:!0,reason:`Hypothermia and behavior change can be early neonatal infection signs.`},{id:`o1`,text:`Delay evaluation until the infant develops a fever.`,correct:!1,reason:`Neonatal infection can cause hypothermia rather than fever.`},{id:`o2`,text:`Feed a large bottle and leave the infant to sleep.`,correct:!1,reason:`Poor arousal raises feeding-safety concerns and requires assessment.`},{id:`o3`,text:`Reassure the family that sleepiness excludes serious infection.`,correct:!1,reason:`Lethargy is a warning finding in a newborn.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Neonatal sepsis.`},{label:`Week 5 HR Newborn lecture — slide(s) 21.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related neonatal sepsis content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A new behavior change and low temperature occur after prolonged membrane rupture.`,rationale:`Newborn infection may present subtly. Support physiologic stability and obtain prompt evaluation before deterioration becomes advanced.`},{id:`e241`,topic:`Newborn`,area:`newborn_stability`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Care management`,`Interprofessional collaboration`],stem:`Cultures and IV antibiotics are ordered for a newborn with suspected sepsis. Which actions are appropriate? Select all that apply.`,options:[{id:`o0`,text:`Obtain ordered cultures promptly before antibiotics when this will not delay urgent treatment.`,correct:!0,reason:`Cultures help identify the organism, but an unstable infant still needs timely therapy.`},{id:`o1`,text:`Monitor glucose, urine output, perfusion, and respiratory status.`,correct:!0,reason:`Sepsis can disrupt multiple organ systems and glucose regulation.`},{id:`o2`,text:`Use meticulous hand hygiene and aseptic line care.`,correct:!0,reason:`Preventing additional exposure remains essential during treatment.`},{id:`o3`,text:`Postpone antibiotics until cultures identify the organism.`,correct:!1,reason:`Empiric treatment should not wait for final culture results.`},{id:`o4`,text:`Give oral antibiotics instead because the infant looks quieter.`,correct:!1,reason:`Quiet behavior may indicate worsening illness and does not authorize a route change.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Neonatal sepsis.`},{label:`Week 5 HR Newborn lecture — slide(s) 21.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related neonatal sepsis content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Diagnostic specimens and treatment must be coordinated without unsafe delay.`,rationale:`Combine timely antimicrobial care with close reassessment and infection prevention.`},{id:`e242`,topic:`Newborn`,area:`newborn_stability`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A 30-week infant has grunting, retractions, increasing oxygen needs, and fatigue. Which nursing plan should be prioritized?`,options:[{id:`o0`,text:`Support prescribed respiratory therapy and suspend oral feeding while the team reassesses stability.`,correct:!0,reason:`Respiratory distress and fatigue make oral feeding unsafe.`},{id:`o1`,text:`Offer a full bottle to increase energy for breathing.`,correct:!1,reason:`Feeding increases work and aspiration risk during respiratory compromise.`},{id:`o2`,text:`Remove monitoring to reduce stimulation.`,correct:!1,reason:`Continuous assessment is needed during instability.`},{id:`o3`,text:`Delay respiratory support until cyanosis is visible.`,correct:!1,reason:`Visible cyanosis is not required before treating respiratory deterioration.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Respiratory distress syndrome.`},{label:`Week 5 HR Newborn lecture — slide(s) 12.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related respiratory distress syndrome content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Work of breathing is increasing while the infant tires.`,rationale:`Airway and breathing support precede oral nutrition. Use the prescribed alternative nutrition plan after stabilization.`},{id:`e243`,topic:`Newborn`,area:`newborn_stability`,difficulty:2,kind:`MC`,skills:[`Pharmacology`,`Assessment`,`Care management`],stem:`After prescribed surfactant administration, a preterm infant's oxygen saturation rises above the ordered target on unchanged respiratory settings. What should the nurse do?`,options:[{id:`o0`,text:`Notify the respiratory/neonatal team and titrate support only within the ordered protocol.`,correct:!0,reason:`Improved lung function can change oxygen and ventilation needs quickly.`},{id:`o1`,text:`Maintain the same oxygen concentration for the entire shift regardless of saturation.`,correct:!1,reason:`Continuing excessive oxygen exposure may cause harm.`},{id:`o2`,text:`Stop all support immediately because the medication cured prematurity.`,correct:!1,reason:`Surfactant does not eliminate the need for reassessment or ongoing support.`},{id:`o3`,text:`Increase oxygen until saturation remains 100%.`,correct:!1,reason:`A universal 100% target is not appropriate for preterm oxygen management.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Surfactant therapy.`},{label:`Week 5 HR Newborn lecture — slide(s) 12.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related surfactant therapy content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Treatment response can make previously necessary settings excessive.`,rationale:`Reassess after therapy and use the prescribed oxygen target. Collaborative adjustment balances hypoxemia prevention against excessive exposure.`},{id:`e244`,topic:`Newborn`,area:`newborn_stability`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Safety`],stem:`A preterm infant in a radiant warmer becomes cool and jittery after a prolonged procedure. Which paired assessments are most important now?`,options:[{id:`o0`,text:`Recheck temperature and blood glucose while restoring a neutral thermal environment.`,correct:!0,reason:`Cold stress increases glucose and oxygen use.`},{id:`o1`,text:`Assess only the stool color and daily length.`,correct:!1,reason:`These do not address the immediate metabolic risk.`},{id:`o2`,text:`Stop monitoring once a blanket is applied.`,correct:!1,reason:`Intervention effectiveness and possible hypoglycemia still need evaluation.`},{id:`o3`,text:`Assume the infant is hungry and feed without assessing breathing.`,correct:!1,reason:`Jitteriness has several causes and feeding requires physiologic stability.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Thermoregulation.`},{label:`Week 5 HR Newborn lecture — slide(s) 4.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related thermoregulation content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Heat loss and jitteriness can signal linked thermal and metabolic stress.`,rationale:`Correct heat loss and evaluate its consequences. Temperature management is an active component of respiratory and glucose stability.`},{id:`e245`,topic:`Newborn`,area:`newborn_stability`,difficulty:1,kind:`MC`,skills:[`Assessment`,`Care management`,`Safety`],stem:`A term infant of a parent with diabetes has a birth weight appropriate for gestational age. The infant appears well. Which plan is appropriate?`,options:[{id:`o0`,text:`Follow the risk-based glucose screening and feeding protocol despite the average birth weight.`,correct:!0,reason:`Maternal diabetes creates glucose risk even when the newborn is not macrosomic.`},{id:`o1`,text:`Omit glucose checks because only large newborns develop hypoglycemia.`,correct:!1,reason:`Size alone does not exclude the risk.`},{id:`o2`,text:`Give IV dextrose automatically without checking glucose or the protocol.`,correct:!1,reason:`Treatment should reflect the assessment and risk-based plan.`},{id:`o3`,text:`Delay all feeding for 12 hours to prevent glucose fluctuations.`,correct:!1,reason:`Unnecessary fasting can worsen hypoglycemia risk.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Infant of a diabetic mother.`},{label:`Week 5 HR Newborn lecture — slide(s) 22–23.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related infant of a diabetic mother content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Risk depends on maternal history as well as newborn size.`,rationale:`Apply the screening indication accurately and support early feeding when the infant can safely feed.`},{id:`e246`,topic:`Newborn`,area:`newborn_stability`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A newborn being managed under a hypoglycemia protocol remains below the protocol's treatment threshold after feeding and prescribed dextrose gel. The infant is now less responsive. What should the nurse do?`,options:[{id:`o0`,text:`Obtain immediate neonatal reassessment and prepare IV glucose as ordered.`,correct:!0,reason:`Persistent low glucose with neurologic change requires escalation beyond repeated feeding.`},{id:`o1`,text:`Repeat oral feedings indefinitely because less-invasive care is always preferred.`,correct:!1,reason:`Minimal invasiveness must not override effectiveness or swallowing safety.`},{id:`o2`,text:`Stop glucose checks because treatment was already given.`,correct:!1,reason:`Response to treatment must be verified.`},{id:`o3`,text:`Wait for a seizure to confirm that hypoglycemia is significant.`,correct:!1,reason:`A seizure is a severe complication to prevent, not a diagnostic prerequisite.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Newborn hypoglycemia.`},{label:`Week 5 HR Newborn lecture — slide(s) 23.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related newborn hypoglycemia content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The initial treatment failed and the clinical condition has worsened.`,rationale:`Escalate treatment based on response. Protect airway safety while correcting a potentially dangerous metabolic problem.`},{id:`e247`,topic:`Newborn`,area:`newborn_stability`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Care management`,`Safety`],stem:`A preterm infant is placed NPO for suspected necrotizing enterocolitis. Which ongoing assessments are priorities? Select all that apply.`,options:[{id:`o0`,text:`Abdominal distension, discoloration, and tenderness.`,correct:!0,reason:`These trends can signal worsening intestinal injury.`},{id:`o1`,text:`Apnea, perfusion, temperature, and overall activity.`,correct:!0,reason:`NEC can progress to systemic infection and shock.`},{id:`o2`,text:`Stool appearance and gastric drainage as ordered.`,correct:!0,reason:`Blood and changing output contribute to evaluation.`},{id:`o3`,text:`Tolerance of a larger oral feeding at each assessment.`,correct:!1,reason:`Suspected NEC requires bowel rest, not feeding challenges.`},{id:`o4`,text:`Repeated forceful abdominal massage to move gas.`,correct:!1,reason:`Manipulation is not a treatment for ischemic bowel and can cause harm.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Necrotizing enterocolitis.`},{label:`Week 5 HR Newborn lecture — slide(s) 13.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related necrotizing enterocolitis content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Bowel injury can produce both local and systemic deterioration.`,rationale:`Monitor more than abdominal size. Escalate changes promptly while maintaining decompression, IV support, and antibiotics as prescribed.`},{id:`e248`,topic:`Newborn`,area:`newborn_stability`,difficulty:3,kind:`MC`,skills:[`Priority`,`Care management`,`Safety`],stem:`A newborn is born through meconium-stained fluid. After initial warming, positioning, and stimulation, the infant remains apneic with a heart rate of 80/min. There is no evidence of airway obstruction. What has priority?`,options:[{id:`o0`,text:`Begin effective positive-pressure ventilation under the neonatal resuscitation protocol.`,correct:!0,reason:`Apnea and heart rate below 100/min require ventilation.`},{id:`o1`,text:`Delay ventilation for routine endotracheal suctioning.`,correct:!1,reason:`Meconium alone does not justify delaying ventilation when there is no obstruction.`},{id:`o2`,text:`Begin chest compressions before providing ventilation.`,correct:!1,reason:`Ventilation is the initial priority at this heart rate.`},{id:`o3`,text:`Wait five minutes for spontaneous breathing.`,correct:!1,reason:`Prolonged delay worsens hypoxia.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Meconium and resuscitation.`},{label:`Week 5 HR Newborn lecture — slide(s) 19–20.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related meconium and resuscitation content (supplement).`},{label:`AHA/AAP · Neonatal resuscitation, 2025 (clinical update)`,url:`https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/neonatal-resuscitation`}],origin:`Original expanded-bank scenario`,clue:`The infant needs ventilation, not routine suction solely because meconium is present.`,rationale:`Current AHA/AAP guidance prioritizes effective ventilation. This corrects older lecture wording that could imply routine deep suction before resuscitation.`},{id:`e249`,topic:`Newborn`,area:`newborn_stability`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Interprofessional collaboration`],stem:`A newborn's heart rate remains 50/min despite at least 30 seconds of ventilation that visibly moves the chest. The resuscitation team is present. Which next step should the nurse anticipate?`,options:[{id:`o0`,text:`Coordinated chest compressions with ventilation and the advanced airway/oxygen plan in the neonatal protocol.`,correct:!0,reason:`Persistent heart rate below 60/min after effective ventilation indicates compressions.`},{id:`o1`,text:`Stop ventilation and provide compressions alone.`,correct:!1,reason:`Newborn resuscitation requires coordinated ventilation and circulation support.`},{id:`o2`,text:`Return the infant to routine skin-to-skin care.`,correct:!1,reason:`Severe persistent bradycardia requires advanced resuscitation.`},{id:`o3`,text:`Give an oral glucose feed before continuing.`,correct:!1,reason:`Oral feeding is unsafe and does not treat this resuscitation emergency.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Neonatal resuscitation.`},{label:`Week 5 HR Newborn lecture — slide(s) 19.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related neonatal resuscitation content (supplement).`},{label:`AHA/AAP · Neonatal resuscitation, 2025 (clinical update)`,url:`https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/neonatal-resuscitation`}],origin:`Original expanded-bank scenario`,clue:`Severe bradycardia persists after effective lung ventilation.`,rationale:`Escalate through the neonatal algorithm as a trained team. Reassess effectiveness rather than repeating an ineffective step without correction.`},{id:`e250`,topic:`Newborn`,area:`newborn_trauma`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Safety`],stem:`A stable newborn has a firm scalp swelling that does not cross suture lines. Which follow-up is most important to include?`,options:[{id:`o0`,text:`Monitor the swelling and assess bilirubin risk as the blood collection resolves.`,correct:!0,reason:`Breakdown of collected blood can increase bilirubin.`},{id:`o1`,text:`Repeatedly compress the swelling to empty the blood.`,correct:!1,reason:`Compression is not an appropriate treatment and can injure tissue.`},{id:`o2`,text:`Reassure that this finding makes jaundice impossible.`,correct:!1,reason:`Blood breakdown increases, rather than eliminates, jaundice risk.`},{id:`o3`,text:`Arrange emergency surgery solely because a stable cephalohematoma is present.`,correct:!1,reason:`Management depends on assessment; stability does not support that automatic action.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Cephalohematoma.`},{label:`Week 5 HR Newborn lecture — slide(s) 18.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related cephalohematoma content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A localized blood collection can create a later metabolic consequence.`,rationale:`Continue assessment of perfusion and jaundice while avoiding manipulation. Escalate enlargement or systemic changes.`},{id:`e251`,topic:`Newborn`,area:`newborn_trauma`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Safety`],stem:`After a forceps-assisted birth, one side of a newborn's face does not move with crying, and the eyelid on that side does not close completely. What should the nurse prioritize in the care plan?`,options:[{id:`o0`,text:`Assess feeding and protect the exposed eye using the prescribed plan.`,correct:!0,reason:`Facial weakness can affect effective feeding and corneal protection.`},{id:`o1`,text:`Tape both eyes shut continuously without an order.`,correct:!1,reason:`Unprescribed occlusion is not an individualized eye-care plan.`},{id:`o2`,text:`Avoid reporting the finding because most injuries improve.`,correct:!1,reason:`Possible recovery does not remove current care needs or assessment obligations.`},{id:`o3`,text:`Massage the affected eye vigorously every feeding.`,correct:!1,reason:`This can damage the eye and does not restore nerve function.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Facial nerve injury.`},{label:`Week 5 HR Newborn lecture — slide(s) 18.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related facial nerve injury content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Incomplete eyelid closure creates a preventable injury risk.`,rationale:`Connect the observed deficit to functional safety needs while the neonatal team evaluates the injury.`},{id:`e252`,topic:`Newborn`,area:`newborn_congenital`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Safety`,`Interprofessional collaboration`],stem:`A newborn with an unrepaired cleft palate tires during feeds. Which interventions should be included? Select all that apply.`,options:[{id:`o0`,text:`Use the prescribed specialized feeding system and assess milk flow.`,correct:!0,reason:`The infant may be unable to create normal suction.`},{id:`o1`,text:`Hold the infant upright with head support and offer frequent burping.`,correct:!0,reason:`This supports feeding and reduces swallowed-air discomfort.`},{id:`o2`,text:`Track intake and weight and consult feeding specialists.`,correct:!0,reason:`Feeding effectiveness and growth require ongoing evaluation.`},{id:`o3`,text:`Enlarge the nipple opening without evaluating flow.`,correct:!1,reason:`Uncontrolled flow increases choking and aspiration risk.`},{id:`o4`,text:`Feed supine to use gravity to fill the mouth.`,correct:!1,reason:`This increases aspiration risk.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Cleft palate feeding.`},{label:`Week 5 HR Newborn lecture — slide(s) 28.`},{label:`ATI RN Nursing Care of Children, edition 11 — related cleft palate feeding content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A structural gap interferes with suction and coordinated intake.`,rationale:`Adapt equipment and technique to the infant's anatomy and endurance, with objective monitoring of nutrition.`},{id:`e253`,topic:`Newborn`,area:`newborn_congenital`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Safety`],stem:`At the first feed, a newborn coughs, becomes cyanotic, and has excessive frothy secretions. Which action should the nurse take first?`,options:[{id:`o0`,text:`Stop feeding, support the airway, and obtain urgent neonatal assessment for possible esophageal atresia/TEF.`,correct:!0,reason:`Feeding-related respiratory compromise can indicate an abnormal connection or obstruction.`},{id:`o1`,text:`Change to a faster-flow nipple and continue.`,correct:!1,reason:`More flow can worsen aspiration.`},{id:`o2`,text:`Refeed the regurgitated milk slowly.`,correct:!1,reason:`Refeeding does not correct the structural concern.`},{id:`o3`,text:`Wait until the infant has failed three feedings before reporting.`,correct:!1,reason:`Repeated exposure creates preventable respiratory risk.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Esophageal atresia and TEF.`},{label:`Week 5 HR Newborn lecture — slide(s) 29.`},{label:`ATI RN Nursing Care of Children, edition 11 — related esophageal atresia and tef content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Choking and cyanosis begin with feeding.`,rationale:`Remove the immediate aspiration exposure, maintain NPO pending evaluation, and prepare prescribed suction and IV support.`},{id:`e254`,topic:`Newborn`,area:`newborn_congenital`,difficulty:2,kind:`MC`,skills:[`Care management`,`Safety`,`Interprofessional collaboration`],stem:`A newborn has an omphalocele with an intact sac. Which proposed action should the nurse question?`,options:[{id:`o0`,text:`Press the organs firmly into the abdomen before surgical evaluation.`,correct:!0,reason:`Uncontrolled reduction may injure tissue and compromise circulation or ventilation.`},{id:`o1`,text:`Protect the sac with the prescribed sterile covering.`,correct:!1,reason:`Protection reduces injury, contamination, and fluid or heat loss.`},{id:`o2`,text:`Maintain warmth and monitor fluid status.`,correct:!1,reason:`Exposed abdominal structures create significant loss risks.`},{id:`o3`,text:`Keep the infant NPO and prepare ordered decompression.`,correct:!1,reason:`These measures support stabilization before repair.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Omphalocele.`},{label:`Week 5 HR Newborn lecture — slide(s) 30.`},{label:`ATI RN Nursing Care of Children, edition 11 — related omphalocele content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The visible defect needs protection, not bedside forceful reduction.`,rationale:`Preserve the sac and physiologic stability while the surgical team determines management.`},{id:`e255`,topic:`Newborn`,area:`newborn_congenital`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`While caring for an infant with an unrepaired myelomeningocele, the nurse sees new clear drainage from the sac dressing. What should the nurse do?`,options:[{id:`o0`,text:`Protect the defect, minimize pressure, and promptly notify the neonatal/surgical team.`,correct:!0,reason:`Drainage may indicate sac leakage and raises infection and tissue-injury concerns.`},{id:`o1`,text:`Place the infant supine to press the leak closed.`,correct:!1,reason:`Direct pressure can injure exposed neural tissue.`},{id:`o2`,text:`Apply alcohol to dry the sac.`,correct:!1,reason:`Alcohol can damage delicate tissue.`},{id:`o3`,text:`Remove precautions because clear drainage is harmless.`,correct:!1,reason:`Clear fluid may be cerebrospinal fluid and requires evaluation.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Myelomeningocele.`},{label:`Week 5 HR Newborn lecture — slide(s) 32.`},{label:`ATI RN Nursing Care of Children, edition 11 — related myelomeningocele content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A change in the integrity of the neural-tube sac requires escalation.`,rationale:`Maintain the prescribed sterile protective care and positioning. Do not attempt to seal or dry the defect independently.`},{id:`e256`,topic:`Newborn`,area:`newborn_congenital`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Safety`],stem:`An infant with hydrocephalus has head circumference measured each shift. Which practice provides the most useful trend?`,options:[{id:`o0`,text:`Use a consistent technique and landmarks, record the measurement, and compare with neurologic findings.`,correct:!0,reason:`Reliable serial measurement supports detection of changing head growth and pressure signs.`},{id:`o1`,text:`Change tape placement each time to avoid skin contact.`,correct:!1,reason:`Inconsistent landmarks can create misleading trends.`},{id:`o2`,text:`Interpret one measurement without comparing prior values.`,correct:!1,reason:`A single value loses important progression information.`},{id:`o3`,text:`Use the measurement instead of assessing alertness and fontanels.`,correct:!1,reason:`Circumference cannot replace a neurologic assessment.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Hydrocephalus.`},{label:`Week 5 HR Newborn lecture — slide(s) 33.`},{label:`ATI RN Nursing Care of Children, edition 11 — related hydrocephalus content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Trend reliability depends on consistent measurement and clinical correlation.`,rationale:`Combine head-growth data with feeding, behavior, fontanel, and eye findings when assessing possible progression.`},{id:`e257`,topic:`Newborn`,area:`newborn_congenital`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Safety`,`Teaching`],stem:`The caregiver of an infant in a Pavlik harness demonstrates home care. Which actions are appropriate? Select all that apply.`,options:[{id:`o0`,text:`Inspect skin and feet regularly for pressure injury and circulation changes.`,correct:!0,reason:`Early detection prevents unnoticed skin or neurovascular injury.`},{id:`o1`,text:`Place diapers beneath the straps as taught.`,correct:!0,reason:`This supports hygiene without changing therapeutic alignment.`},{id:`o2`,text:`Leave strap adjustments to the prescribed orthopedic plan.`,correct:!0,reason:`Altered tension can reduce effectiveness or cause harm.`},{id:`o3`,text:`Bind the legs tightly together during swaddling.`,correct:!1,reason:`Forced adduction conflicts with therapeutic hip positioning.`},{id:`o4`,text:`Stop using the harness whenever the infant cries.`,correct:!1,reason:`Unplanned removal can interrupt correction; evaluate the cause of distress.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Pavlik harness.`},{label:`Week 5 HR Newborn lecture — slide(s) 34.`},{label:`ATI RN Nursing Care of Children, edition 11 — related pavlik harness content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Routine care must preserve prescribed hip alignment.`,rationale:`Teach caregivers practical observation and handling skills, including when to call for urgent circulation or skin concerns.`},{id:`e258`,topic:`Newborn`,area:`newborn_congenital`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Safety`],stem:`Several hours after a new serial cast for clubfoot, an infant has swollen, cool toes and delayed capillary refill. What is the priority response?`,options:[{id:`o0`,text:`Obtain urgent orthopedic assessment for possible cast-related neurovascular compromise.`,correct:!0,reason:`Coolness and delayed refill can signal threatened perfusion.`},{id:`o1`,text:`Tell the caregiver this is expected until the next weekly cast change.`,correct:!1,reason:`Waiting risks tissue injury.`},{id:`o2`,text:`Insert scissors inside the cast and cut blindly.`,correct:!1,reason:`Uncontrolled cast manipulation can injure the infant.`},{id:`o3`,text:`Give a bottle and reassess tomorrow if crying stops.`,correct:!1,reason:`Comfort does not establish restored circulation.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Clubfoot casting.`},{label:`Week 5 HR Newborn lecture — slide(s) 35.`},{label:`ATI RN Nursing Care of Children, edition 11 — related clubfoot casting content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Distal perfusion changed after casting.`,rationale:`Recognize neurovascular compromise promptly. Follow the urgent cast-assessment protocol rather than waiting for a routine visit.`},{id:`e259`,topic:`Newborn`,area:`newborn_trauma`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A jaundiced newborn becomes difficult to feed and develops a high-pitched cry with intermittent arching. Which action has priority?`,options:[{id:`o0`,text:`Obtain immediate neonatal evaluation for possible bilirubin neurotoxicity.`,correct:!0,reason:`Neurologic change in a jaundiced infant is an emergency warning sign.`},{id:`o1`,text:`Reassure that sleepiness always improves after a longer nap.`,correct:!1,reason:`Poor arousal and abnormal posture require assessment.`},{id:`o2`,text:`Stop bilirubin testing because skin color appears slightly lighter.`,correct:!1,reason:`Visual appearance cannot replace biochemical and neurologic assessment.`},{id:`o3`,text:`Offer water to dilute the bilirubin.`,correct:!1,reason:`Water does not treat bilirubin toxicity and is not an appropriate neonatal feeding intervention.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Pathologic jaundice.`},{label:`Week 5 HR Newborn lecture — slide(s) 26.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related pathologic jaundice content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Jaundice is now accompanied by abnormal neurologic behavior.`,rationale:`Escalate signs of possible acute bilirubin encephalopathy immediately and prepare intensified treatment under the neonatal plan.`},{id:`e260`,topic:`Newborn`,area:`newborn_trauma`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Care management`,`Safety`],stem:`A newborn receives prescribed phototherapy for hyperbilirubinemia. Which nursing actions are appropriate? Select all that apply.`,options:[{id:`o0`,text:`Use eye protection appropriate to the device and verify placement.`,correct:!0,reason:`Correct protection reduces light exposure to the eyes without obstructing breathing.`},{id:`o1`,text:`Monitor temperature, feeding, output, and bilirubin response.`,correct:!0,reason:`Treatment effectiveness and hydration/thermal effects require reassessment.`},{id:`o2`,text:`Follow the device instructions for exposure and positioning.`,correct:!0,reason:`Effective delivery depends on the equipment and ordered treatment plan.`},{id:`o3`,text:`Apply lotion to improve light penetration.`,correct:!1,reason:`Unprescribed skin products are not required and may be harmful.`},{id:`o4`,text:`Stop therapy independently when the skin looks less yellow.`,correct:!1,reason:`Discontinuation depends on measured levels and the treatment plan.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Phototherapy.`},{label:`Week 5 HR Newborn lecture — slide(s) 26.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related phototherapy content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Effective light treatment still needs safety and response monitoring.`,rationale:`Do not substitute visual impression for bilirubin measurements or neglect feeding and fluid status during therapy.`},{id:`e261`,topic:`Newborn`,area:`newborn_family`,difficulty:2,kind:`MC`,skills:[`Care management`,`Interprofessional collaboration`,`Safety`],stem:`A newborn treated for opioid withdrawal cannot sleep or feed adequately despite swaddling, a quiet environment, and caregiver soothing. What should the nurse do next?`,options:[{id:`o0`,text:`Report persistent functional impairment and coordinate reassessment of the medication and supportive-care plan.`,correct:!0,reason:`Inadequate eating, sleeping, and consolability may require treatment adjustment.`},{id:`o1`,text:`Stop all caregiver contact to prevent dependence on soothing.`,correct:!1,reason:`Supportive contact is therapeutic, not a cause of withdrawal.`},{id:`o2`,text:`Give naloxone to reverse withdrawal.`,correct:!1,reason:`Naloxone can precipitate severe withdrawal and is not treatment for it.`},{id:`o3`,text:`Assume the family caused the treatment failure and restrict visits.`,correct:!1,reason:`Blame is unsupported and can undermine effective family care.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Neonatal opioid withdrawal.`},{label:`Week 5 HR Newborn lecture — slide(s) 24–25.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related neonatal opioid withdrawal content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The infant is not functioning adequately despite appropriate first measures.`,rationale:`Reassess treatment effectiveness using the unit's withdrawal tool and functional measures, while continuing nonjudgmental caregiver support.`},{id:`e262`,topic:`Newborn`,area:`newborn_family`,difficulty:3,kind:`MC`,skills:[`Pharmacology`,`Assessment`,`Priority`],stem:`An infant receiving prescribed oral morphine for opioid withdrawal is markedly sedated and has a new respiratory rate of 18/min. The next dose is due. What should the nurse do?`,options:[{id:`o0`,text:`Hold the dose and obtain immediate neonatal assessment while supporting breathing.`,correct:!0,reason:`Sedation with respiratory depression is a medication-safety emergency.`},{id:`o1`,text:`Give the dose because the infant is no longer crying.`,correct:!1,reason:`Reduced crying may reflect excessive sedation, not safe symptom control.`},{id:`o2`,text:`Increase the dose to prevent a rebound cry.`,correct:!1,reason:`Additional opioid could worsen respiratory depression.`},{id:`o3`,text:`Record successful withdrawal treatment without reassessment.`,correct:!1,reason:`Functional improvement requires safe breathing and feeding, not sedation alone.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Neonatal withdrawal medication.`},{label:`Week 5 HR Newborn lecture — slide(s) 25.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related neonatal withdrawal medication content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The treatment response has crossed into respiratory compromise.`,rationale:`Prioritize breathing and urgent medication reassessment. Do not automatically administer a scheduled opioid after concerning pre-dose findings.`},{id:`e263`,topic:`Newborn`,area:`newborn_family`,difficulty:2,kind:`MC`,skills:[`Care management`,`Interprofessional collaboration`,`Safety`],stem:`A medically stable infant will go home with prescribed oxygen. A caregiver cannot demonstrate the equipment setup or explain what to do if breathing worsens. What is the best response?`,options:[{id:`o0`,text:`Arrange additional supervised practice and resolve equipment and emergency-plan gaps before discharge.`,correct:!0,reason:`Home readiness includes caregiver capability, not only physiologic stability.`},{id:`o1`,text:`Discharge because the caregiver watched the nurse once.`,correct:!1,reason:`Observation alone does not verify a safety-critical skill.`},{id:`o2`,text:`Remove prescribed oxygen to simplify home care.`,correct:!1,reason:`The nurse cannot discontinue necessary therapy for convenience.`},{id:`o3`,text:`Ask the caregiver to learn from social media after arriving home.`,correct:!1,reason:`This does not establish a reliable care or emergency plan.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — NICU discharge preparation.`},{label:`Week 5 HR Newborn lecture — slide(s) 10.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related nicu discharge preparation content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A necessary home-care skill has not yet been demonstrated.`,rationale:`Use teach-back and return demonstration, coordinate supplies and follow-up, and verify a workable plan before transition home.`},{id:`e264`,topic:`Newborn`,area:`newborn_family`,difficulty:1,kind:`MC`,skills:[`Care management`,`Interprofessional collaboration`],stem:`A parent stands away from the incubator and says, "I am afraid I will hurt her." The infant is stable enough for supported contact. Which response is best?`,options:[{id:`o0`,text:`Offer to demonstrate safe touch and help the parent participate at a comfortable pace.`,correct:!0,reason:`Guided involvement supports confidence and the relationship.`},{id:`o1`,text:`Interpret hesitation as lack of attachment without asking further.`,correct:!1,reason:`Fear and unfamiliar equipment may explain the behavior.`},{id:`o2`,text:`Require the parent to hold the infant immediately.`,correct:!1,reason:`Coercion can increase distress and ignores readiness.`},{id:`o3`,text:`Tell the parent to wait until discharge to provide care.`,correct:!1,reason:`This misses safe opportunities to build competence.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Family bonding in the NICU.`},{label:`Week 5 HR Newborn lecture — slide(s) 9.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related family bonding in the nicu content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Fear, rather than refusal of the infant, is the stated barrier.`,rationale:`Assess the parent's concern and provide graded, supported involvement while respecting clinical stability and family preferences.`},{id:`e265`,topic:`Newborn`,area:`newborn_family`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Interprofessional collaboration`,`Safety`],stem:`After a neonatal death, which nursing actions support individualized family care? Select all that apply.`,options:[{id:`o0`,text:`Offer opportunities to hold the infant without pressuring the family.`,correct:!0,reason:`Families should be able to choose what feels appropriate.`},{id:`o1`,text:`Ask about cultural, spiritual, and personal preferences.`,correct:!0,reason:`Preferences cannot be inferred from appearance or background.`},{id:`o2`,text:`Offer keepsakes and bereavement resources.`,correct:!0,reason:`Tangible memories and support may help the grieving process.`},{id:`o3`,text:`Insist that another pregnancy will replace this loss.`,correct:!1,reason:`This minimizes the infant and the family's grief.`},{id:`o4`,text:`Remove the infant immediately regardless of the family's wishes and available policy options.`,correct:!1,reason:`Unnecessary urgency can deny meaningful choices.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Neonatal loss.`},{label:`Week 5 HR Newborn lecture — slide(s) 36.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related neonatal loss content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Support should offer choices rather than impose one way to grieve.`,rationale:`Provide presence and practical options without false reassurance. Coordinate privacy and follow-up support.`},{id:`e266`,topic:`Newborn`,area:`newborn_congenital`,difficulty:2,kind:`MC`,skills:[`Care management`,`Pharmacology`,`Safety`],stem:`A newborn's screening result suggests congenital hypothyroidism. The family says the infant looks normal and wants to wait several months. Which response is best?`,options:[{id:`o0`,text:`Explain the need for prompt confirmatory evaluation and treatment if indicated to protect development.`,correct:!0,reason:`Early signs may be subtle while untreated hormone deficiency can harm development.`},{id:`o1`,text:`Agree that treatment is unnecessary until growth slows visibly.`,correct:!1,reason:`Waiting for obvious signs can delay preventive treatment.`},{id:`o2`,text:`Suggest replacing follow-up with an over-the-counter iodine supplement.`,correct:!1,reason:`This is not a substitute for diagnosis and prescribed hormone therapy.`},{id:`o3`,text:`State that screening alone proves permanent disability.`,correct:!1,reason:`Screening requires confirmation and does not establish a fixed outcome.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Congenital hypothyroidism.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related congenital hypothyroidism content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`An apparently well newborn can still have a time-sensitive screening abnormality.`,rationale:`A screening program works only when abnormal findings lead to prompt evaluation and appropriate therapy.`},{id:`e267`,topic:`Newborn`,area:`newborn_family`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Interprofessional collaboration`],stem:`A caregiver of an infant born at 28 weeks asks why developmental follow-up is needed after discharge. Which explanation is most useful?`,options:[{id:`o0`,text:`Follow-up tracks development in the context of prematurity and connects the infant with early support if concerns emerge.`,correct:!0,reason:`Ongoing assessment can identify needs that were not evident during hospitalization.`},{id:`o1`,text:`A normal discharge examination guarantees normal development.`,correct:!1,reason:`A single assessment cannot predict every later outcome.`},{id:`o2`,text:`All preterm infants will have severe disability.`,correct:!1,reason:`Outcomes vary, and this prediction is unsupported.`},{id:`o3`,text:`Development should be judged without considering gestational history.`,correct:!1,reason:`Prematurity affects how early development is interpreted.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Preterm developmental follow-up.`},{label:`Week 5 HR Newborn lecture — slide(s) 10.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related preterm developmental follow-up content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Discharge stability and long-term developmental monitoring serve different purposes.`,rationale:`Explain follow-up as supportive surveillance rather than a prediction of impairment. Help the family keep appointments and report concerns.`},{id:`e268`,topic:`Newborn`,area:`newborn_stability`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Safety`],stem:`During clustered care, a preterm infant begins extending the limbs, hiccupping, and desaturating. What should the nurse do?`,options:[{id:`o0`,text:`Pause nonessential stimulation, support physiologic recovery, and adjust the care pacing.`,correct:!0,reason:`Stress cues indicate the infant is not tolerating the current workload.`},{id:`o1`,text:`Complete every task quickly despite the desaturation.`,correct:!1,reason:`Clustering should conserve energy, not override signs of intolerance.`},{id:`o2`,text:`Add bright light and vigorous handling to improve alertness.`,correct:!1,reason:`Additional stimulation can increase stress and oxygen demand.`},{id:`o3`,text:`Label the response as behavioral manipulation.`,correct:!1,reason:`These are physiologic stress signals, not intentional misbehavior.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Energy conservation.`},{label:`Week 5 HR Newborn lecture — slide(s) 6–7.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related energy conservation content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The infant's cues show that the care schedule is exceeding current tolerance.`,rationale:`Individualize clustered care to the infant's response. Reassess cardiorespiratory status before continuing necessary tasks.`},{id:`e269`,topic:`Newborn`,area:`newborn_family`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Interprofessional collaboration`,`Safety`],stem:`A former preterm infant with chronic lung disease is preparing for home care. Which elements should the nurse coordinate? Select all that apply.`,options:[{id:`o0`,text:`A feeding plan that accounts for fatigue and prescribed nutritional needs.`,correct:!0,reason:`Respiratory effort can compete with feeding endurance and growth.`},{id:`o1`,text:`Demonstration of prescribed medication and oxygen equipment use.`,correct:!0,reason:`Safe home care depends on correct technique.`},{id:`o2`,text:`Clear follow-up arrangements and signs that require urgent evaluation.`,correct:!0,reason:`Families need a specific response plan for deterioration.`},{id:`o3`,text:`Instructions to increase oxygen freely whenever the infant cries.`,correct:!1,reason:`Oxygen changes must follow the prescribed plan.`},{id:`o4`,text:`Cancellation of growth monitoring once discharge weight is reached.`,correct:!1,reason:`Ongoing nutrition and growth assessment remain important.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Bronchopulmonary dysplasia and discharge.`},{label:`Week 5 HR Newborn lecture — slide(s) 10–12.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related bronchopulmonary dysplasia and discharge content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Respiratory support, feeding, and caregiver readiness must fit together.`,rationale:`Discharge planning is a coordinated care process, not simply delivery of equipment.`},{id:`e270`,topic:`GYN`,area:`gyn_contraception`,difficulty:2,kind:`MC`,skills:[`Teaching`,`Pharmacology`,`Safety`],stem:`A patient reports unprotected intercourse four days ago and wants to avoid pregnancy. Which response is best?`,options:[{id:`o0`,text:`Arrange prompt counseling about emergency contraception options that may still be effective.`,correct:!0,reason:`Options remain within a five-day window; choice depends on circumstances and access.`},{id:`o1`,text:`Explain that every emergency contraceptive method becomes ineffective after 72 hours.`,correct:!1,reason:`This older blanket cutoff excludes effective options.`},{id:`o2`,text:`Tell the patient to wait for a missed period before discussing prevention.`,correct:!1,reason:`Waiting loses a time-sensitive opportunity.`},{id:`o3`,text:`Recommend taking several unrelated hormonal tablets without a prescribed regimen.`,correct:!1,reason:`Unsupervised dosing is not appropriate emergency contraception counseling.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception emergency methods.`},{label:`Week 6 Contraception & Abortion lecture — slide(s) 5.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception emergency methods content (supplement).`},{label:`CDC · Emergency contraception (clinical update)`,url:`https://www.cdc.gov/contraception/hcp/usspr/emergency-contraception.html`}],origin:`Original expanded-bank scenario`,clue:`Four days does not mean the opportunity for emergency contraception has passed.`,rationale:`Current CDC guidance includes options through five days. Discuss them promptly, without treating emergency contraception as treatment for an established pregnancy.`},{id:`e271`,topic:`GYN`,area:`gyn_contraception`,difficulty:2,kind:`MC`,skills:[`Teaching`,`Pharmacology`,`Safety`],stem:`A patient takes ulipristal emergency contraception and plans to restart combined oral contraceptive pills immediately. Which teaching is most appropriate?`,options:[{id:`o0`,text:`Wait at least five days before restarting hormonal pills and use barrier protection as instructed during the transition.`,correct:!0,reason:`Starting progestin-containing contraception too soon can reduce ulipristal's effect.`},{id:`o1`,text:`Restart immediately because ulipristal and levonorgestrel have identical restart instructions.`,correct:!1,reason:`Their recommendations differ.`},{id:`o2`,text:`Stop all pregnancy prevention until the next annual examination.`,correct:!1,reason:`This unnecessarily leaves ongoing pregnancy risk.`},{id:`o3`,text:`Explain that ulipristal protects every later act of intercourse that month.`,correct:!1,reason:`Emergency contraception does not provide ongoing protection for later intercourse.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception ulipristal.`},{label:`Week 6 Contraception & Abortion lecture — slide(s) 5.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception ulipristal content (supplement).`},{label:`CDC · Emergency contraception (clinical update)`,url:`https://www.cdc.gov/contraception/hcp/usspr/emergency-contraception.html`}],origin:`Original expanded-bank scenario`,clue:`The emergency contraceptive used was ulipristal, not levonorgestrel.`,rationale:`CDC advises restarting hormonal contraception no sooner than five days after ulipristal, with subsequent backup as directed. Confirm the individualized instructions and follow-up testing plan.`},{id:`e272`,topic:`GYN`,area:`gyn_contraception`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Pharmacology`,`Safety`],stem:`A patient using a combined hormonal contraceptive develops a new migraine preceded by flashing lights and a blind spot. What is the nurse's best response?`,options:[{id:`o0`,text:`Arrange prompt evaluation and review whether an estrogen-containing method remains appropriate.`,correct:!0,reason:`New aura warrants assessment and changes contraceptive eligibility because of stroke risk.`},{id:`o1`,text:`Reassure that neurologic symptoms are an expected sign of effective contraception.`,correct:!1,reason:`New focal symptoms require assessment.`},{id:`o2`,text:`Advise doubling estrogen to stabilize the cycle.`,correct:!1,reason:`Increasing estrogen may increase risk and is not a nursing dose adjustment.`},{id:`o3`,text:`Focus only on whether pills were taken at the same time each day.`,correct:!1,reason:`Adherence does not address the new safety concern.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception estrogen risk.`},{label:`Week 6 Contraception & Abortion lecture — slide(s) 4.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception estrogen risk content (supplement).`},{label:`CDC · Combined hormonal contraceptive eligibility`,url:`https://www.cdc.gov/contraception/hcp/usmec/combined-hormonal-contraceptives.html`}],origin:`Original expanded-bank scenario`,clue:`New neurologic aura changes the risk-benefit assessment.`,rationale:`Evaluate new headache patterns and focal symptoms promptly. Contraceptive counseling must incorporate current conditions, not only the original prescription.`},{id:`e273`,topic:`GYN`,area:`gyn_contraception`,difficulty:3,kind:`MC`,skills:[`Priority`,`Safety`,`Pharmacology`],stem:`A patient using an estrogen-containing patch calls with sudden chest pain and shortness of breath. Which instruction has priority?`,options:[{id:`o0`,text:`Seek emergency evaluation now for possible thromboembolism or another acute cardiopulmonary cause.`,correct:!0,reason:`Sudden chest pain and dyspnea require urgent assessment.`},{id:`o1`,text:`Remove the patch and wait until symptoms resolve before calling again.`,correct:!1,reason:`Removing exposure alone does not treat a possible embolism.`},{id:`o2`,text:`Apply a second patch to prevent withdrawal symptoms.`,correct:!1,reason:`Additional estrogen is inappropriate and could increase risk.`},{id:`o3`,text:`Schedule a routine discussion of a different contraceptive next month.`,correct:!1,reason:`The immediate problem is potentially life-threatening.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception thromboembolism.`},{label:`Week 6 Contraception & Abortion lecture — slide(s) 4.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception thromboembolism content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Acute breathing symptoms outweigh routine contraceptive counseling.`,rationale:`Triage the physiologic emergency first. Method changes can be addressed after urgent evaluation.`},{id:`e274`,topic:`GYN`,area:`gyn_contraception`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Teaching`,`Safety`],stem:`A patient with a recently inserted IUD asks what should prompt contact with the clinician. Which findings should the nurse include? Select all that apply.`,options:[{id:`o0`,text:`Fever with worsening pelvic pain.`,correct:!0,reason:`This may indicate infection and needs prompt assessment.`},{id:`o1`,text:`A positive pregnancy test, especially with unilateral pain or dizziness.`,correct:!0,reason:`Pregnancy with an IUD requires evaluation of location and possible complications.`},{id:`o2`,text:`New inability to feel previously palpable strings or feeling the device itself.`,correct:!0,reason:`Expulsion or displacement should be assessed; use backup pending advice.`},{id:`o3`,text:`Mild cramping that steadily improves after insertion.`,correct:!1,reason:`This can be expected; severity and progression guide concern.`},{id:`o4`,text:`Awareness that condoms are still needed for STI risk reduction.`,correct:!1,reason:`This is correct teaching, not a device complication.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception IUD warning signs.`},{label:`Week 6 Contraception & Abortion lecture — slide(s) 6.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception iud warning signs content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Fever, pregnancy symptoms, and possible displacement are different warning pathways.`,rationale:`Teach actionable symptoms and follow-up instead of implying that all post-insertion sensations represent an emergency.`},{id:`e275`,topic:`GYN`,area:`gyn_contraception`,difficulty:2,kind:`MC`,skills:[`Teaching`,`Pharmacology`,`Safety`],stem:`A patient missed two consecutive active combined oral contraceptive pills in the first week of a new pack and had unprotected intercourse yesterday. What is the best nursing response?`,options:[{id:`o0`,text:`Review the missed-pill instructions, backup contraception, and the need to consider emergency contraception now.`,correct:!0,reason:`Early-pack missed active pills plus recent intercourse create pregnancy risk.`},{id:`o1`,text:`Tell the patient to wait for bleeding before resuming any pills.`,correct:!1,reason:`This extends the hormone-free interval and can increase risk.`},{id:`o2`,text:`Explain that missed active pills never affect protection if the previous pack was completed.`,correct:!1,reason:`Extending the hormone-free interval can reduce suppression of ovulation.`},{id:`o3`,text:`Give the same instructions used for any brand of progestin-only pill without checking the product.`,correct:!1,reason:`Missed-pill guidance differs by formulation.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception missed combined pills.`},{label:`Week 6 Contraception & Abortion lecture — slide(s) 4.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception missed combined pills content (supplement).`},{label:`CDC · Combined hormonal contraceptives and missed pills`,url:`https://www.cdc.gov/contraception/hcp/usspr/combined-hormonal-contraceptives.html`}],origin:`Original expanded-bank scenario`,clue:`The missed doses are active combined pills early in the pack with recent intercourse.`,rationale:`Use the correct formulation-specific algorithm. Address today's pregnancy risk as well as restoring ongoing contraception.`},{id:`e276`,topic:`GYN`,area:`gyn_contraception`,difficulty:1,kind:`MC`,skills:[`Teaching`,`Safety`,`Care management`],stem:`After vasectomy, a patient says, "We can stop backup contraception immediately." Which response is best?`,options:[{id:`o0`,text:`Continue backup until the clinician confirms success through the prescribed semen-testing follow-up.`,correct:!0,reason:`Sperm may remain after the procedure; immediate sterility is not assured.`},{id:`o1`,text:`Agree because interruption of the vas deferens removes all sperm instantly.`,correct:!1,reason:`Residual sperm can remain downstream.`},{id:`o2`,text:`Explain that vasectomy prevents STI transmission.`,correct:!1,reason:`Sterilization does not prevent sexually transmitted infection.`},{id:`o3`,text:`Recommend skipping follow-up if there is no postoperative pain.`,correct:!1,reason:`Absence of pain does not establish contraceptive success.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception sterilization.`},{label:`Week 6 Contraception & Abortion lecture — slide(s) 7.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception sterilization content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Completion of the procedure is not the same as confirmed contraceptive effectiveness.`,rationale:`Reinforce the follow-up plan and temporary backup rather than relying on symptoms or elapsed time alone.`},{id:`e277`,topic:`GYN`,area:`gyn_contraception`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Teaching`,`Safety`],stem:`A patient relying on lactational amenorrhea for contraception reports that menstruation has returned and formula now replaces several feeds. What is the best response?`,options:[{id:`o0`,text:`Discuss another contraceptive method because the criteria for this approach are no longer met.`,correct:!0,reason:`Return of menses and reduced exclusive breastfeeding reduce reliability.`},{id:`o1`,text:`Reassure that any breastfeeding prevents ovulation for a full year.`,correct:!1,reason:`This overstates protection and ignores required criteria.`},{id:`o2`,text:`Recommend waiting until another pregnancy occurs before changing methods.`,correct:!1,reason:`Counseling should address current pregnancy prevention needs.`},{id:`o3`,text:`State that breastfeeding must stop before any contraception can be used.`,correct:!1,reason:`Several contraceptive options can be compatible with breastfeeding.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception lactational amenorrhea.`},{label:`Week 6 Contraception & Abortion lecture — slide(s) 2.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception lactational amenorrhea content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The patient's current feeding and menstrual pattern no longer supports the chosen method.`,rationale:`Reassess method suitability when circumstances change and offer acceptable options without requiring unnecessary feeding changes.`},{id:`e278`,topic:`GYN`,area:`gyn_contraception`,difficulty:2,kind:`SATA`,skills:[`Teaching`,`Safety`,`Care management`],stem:`Which condom-use statements indicate understanding? Select all that apply.`,options:[{id:`o0`,text:`"I will use a new condom for each act of intercourse."`,correct:!0,reason:`Reuse increases failure and exposure risk.`},{id:`o1`,text:`"I will choose lubricant compatible with the condom material."`,correct:!0,reason:`Oil-based products can damage latex condoms.`},{id:`o2`,text:`"Condoms reduce STI risk but do not eliminate every skin-to-skin infection risk."`,correct:!0,reason:`Uncovered skin can still transmit some infections.`},{id:`o3`,text:`"Using an internal and an external condom together is always safer."`,correct:!1,reason:`Friction between devices can increase failure risk.`},{id:`o4`,text:`"An IUD makes condoms unnecessary even when STI exposure is possible."`,correct:!1,reason:`IUDs prevent pregnancy but do not reduce STI transmission.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception barrier methods.`},{label:`Week 6 Contraception & Abortion lecture — slide(s) 3.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception barrier methods content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Correct technique and realistic protection expectations matter together.`,rationale:`Teach practical risk reduction without promising complete protection or combining barrier devices in a way that can increase breakage.`},{id:`e279`,topic:`GYN`,area:`gyn_assessment`,difficulty:2,kind:`MC`,skills:[`Therapeutic communication`,`Teaching`,`Care management`],stem:`A patient declines an implant after counseling and prefers another medically eligible method. Which response best supports patient-centered care?`,options:[{id:`o0`,text:`Explore the patient's priorities and help implement the preferred eligible method.`,correct:!0,reason:`Acceptability and informed preference are important to sustained use.`},{id:`o1`,text:`Continue pressuring the patient until the implant is accepted.`,correct:!1,reason:`Coercion undermines reproductive autonomy.`},{id:`o2`,text:`Refuse further contraception counseling.`,correct:!1,reason:`Disagreement with one option does not justify withholding care.`},{id:`o3`,text:`Ask the patient's partner to override the decision.`,correct:!1,reason:`The patient's informed choice governs care.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception choice.`},{label:`Week 6 Contraception & Abortion lecture — slide(s) 2.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception choice content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The preference is informed and the alternative is medically eligible.`,rationale:`Support shared decision-making without treating clinician preference as consent.`},{id:`e280`,topic:`GYN`,area:`gyn_infection`,difficulty:3,kind:`MC`,skills:[`Pharmacology`,`Safety`,`Interprofessional collaboration`],stem:`A pregnant patient diagnosed with syphilis reports a documented immediate penicillin allergy. Which plan should the nurse anticipate clarifying with the team?`,options:[{id:`o0`,text:`Penicillin desensitization followed by the indicated penicillin regimen in an appropriate setting.`,correct:!0,reason:`Penicillin is the established effective treatment to prevent fetal infection; allergy requires coordinated management.`},{id:`o1`,text:`Substitute leftover tetracycline from home.`,correct:!1,reason:`This is not an appropriate pregnancy syphilis treatment plan.`},{id:`o2`,text:`Delay all treatment until after birth.`,correct:!1,reason:`Untreated maternal infection threatens the fetus.`},{id:`o3`,text:`Use topical treatment of any visible lesion as definitive therapy.`,correct:!1,reason:`Local treatment does not eradicate systemic infection.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Syphilis during pregnancy.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 17.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related syphilis during pregnancy content (supplement).`},{label:`CDC · Syphilis during pregnancy`,url:`https://www.cdc.gov/std/treatment-guidelines/syphilis-pregnancy.htm`}],origin:`Original expanded-bank scenario`,clue:`Pregnancy and penicillin allergy require a specific treatment pathway.`,rationale:`Coordinate safe desensitization and indicated therapy rather than choosing an unproven substitute or delaying fetal protection.`},{id:`e281`,topic:`GYN`,area:`gyn_infection`,difficulty:2,kind:`SATA`,skills:[`Teaching`,`Pharmacology`,`Safety`],stem:`A patient prescribed treatment for trichomoniasis asks how to prevent reinfection. Which instructions are appropriate? Select all that apply.`,options:[{id:`o0`,text:`Complete the prescribed oral regimen.`,correct:!0,reason:`Treatment must follow the ordered course even if symptoms improve.`},{id:`o1`,text:`Ensure current sexual partners receive treatment.`,correct:!0,reason:`Untreated partners can cause reinfection.`},{id:`o2`,text:`Avoid intercourse until the patient and partners complete treatment and symptoms resolve.`,correct:!0,reason:`This reduces transmission during treatment.`},{id:`o3`,text:`Treat only the patient because trichomoniasis is never sexually transmitted.`,correct:!1,reason:`It is an STI.`},{id:`o4`,text:`Replace prescribed therapy with vaginal douching.`,correct:!1,reason:`Douching does not cure infection and can cause harm.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Trichomoniasis.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 25.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related trichomoniasis content (supplement).`},{label:`CDC · Trichomoniasis`,url:`https://www.cdc.gov/std/treatment-guidelines/trichomoniasis.htm`}],origin:`Original expanded-bank scenario`,clue:`Treatment success depends on addressing partner exposure as well as the patient's symptoms.`,rationale:`Reinforce the current prescribed regimen and follow-up plan. Older blanket single-dose teaching should not replace current regimen-specific guidance.`},{id:`e282`,topic:`GYN`,area:`gyn_infection`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A patient receiving outpatient therapy for PID returns after 72 hours with persistent fever and worsening pelvic pain. What is the priority response?`,options:[{id:`o0`,text:`Arrange prompt reevaluation for treatment failure, complications, or another diagnosis.`,correct:!0,reason:`Lack of improvement within this interval requires escalation and possible inpatient therapy.`},{id:`o1`,text:`Reassure that worsening symptoms prove the antibiotics are working.`,correct:!1,reason:`Persistent deterioration is not an expected therapeutic goal.`},{id:`o2`,text:`Advise waiting until all remaining tablets are finished before reassessment.`,correct:!1,reason:`This can delay recognition of abscess or other serious disease.`},{id:`o3`,text:`Recommend stopping all treatment and taking analgesics alone.`,correct:!1,reason:`Symptom suppression does not address infection.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Pelvic inflammatory disease.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 18.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related pelvic inflammatory disease content (supplement).`},{label:`CDC · Pelvic inflammatory disease`,url:`https://www.cdc.gov/std/treatment-guidelines/pid.htm`}],origin:`Original expanded-bank scenario`,clue:`The expected early clinical improvement has not occurred.`,rationale:`Evaluate the response to the plan, not just whether it was prescribed. Worsening findings require reassessment.`},{id:`e283`,topic:`GYN`,area:`gyn_infection`,difficulty:2,kind:`MC`,skills:[`Teaching`,`Care management`,`Safety`],stem:`A pregnant patient treated for chlamydia feels well and asks why another test was scheduled about four weeks later. Which explanation is best?`,options:[{id:`o0`,text:`The test checks that treatment cleared the infection because persistent infection can affect the pregnancy and newborn.`,correct:!0,reason:`Pregnancy warrants a test of cure after treatment.`},{id:`o1`,text:`Testing is unnecessary unless visible genital lesions develop.`,correct:!1,reason:`Chlamydia can persist without symptoms or lesions.`},{id:`o2`,text:`The repeat test proves the patient was unfaithful.`,correct:!1,reason:`Follow-up has a clinical purpose and does not establish behavior.`},{id:`o3`,text:`Antibiotic treatment always causes infertility, so testing checks fertility.`,correct:!1,reason:`This is inaccurate and confuses the purpose of follow-up.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Chlamydia during pregnancy.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 15.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related chlamydia during pregnancy content (supplement).`},{label:`CDC · Chlamydia`,url:`https://www.cdc.gov/std/treatment-guidelines/chlamydia.htm`}],origin:`Original expanded-bank scenario`,clue:`Symptom resolution does not substitute for the pregnancy-specific test of cure.`,rationale:`Explain follow-up nonjudgmentally and reinforce partner treatment and reinfection prevention.`},{id:`e284`,topic:`GYN`,area:`gyn_infection`,difficulty:2,kind:`MC`,skills:[`Teaching`,`Safety`,`Therapeutic communication`],stem:`A patient with recurrent genital herpes says, "Antivirals cured it, so I cannot pass it on." Which response is most accurate?`,options:[{id:`o0`,text:`Antivirals help control episodes and reduce transmission risk, but they do not eradicate latent infection.`,correct:!0,reason:`Recurrence and asymptomatic shedding remain possible.`},{id:`o1`,text:`Confirm that transmission occurs only with a visible open sore.`,correct:!1,reason:`Viral shedding can occur without visible lesions.`},{id:`o2`,text:`Explain that antibiotics permanently eliminate the virus.`,correct:!1,reason:`Antibacterial drugs do not cure HSV.`},{id:`o3`,text:`Recommend avoiding all future relationships.`,correct:!1,reason:`This is stigmatizing and not evidence-based risk counseling.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Genital herpes.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 20.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related genital herpes content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Symptom control has been confused with eradication of the virus.`,rationale:`Provide realistic prevention teaching and support disclosure and informed choices without stigma.`},{id:`e285`,topic:`GYN`,area:`gyn_infection`,difficulty:1,kind:`MC`,skills:[`Teaching`,`Safety`,`Care management`],stem:`A patient asks whether HPV vaccination means cervical screening will never be needed. Which response is best?`,options:[{id:`o0`,text:`Continue screening according to the recommended age and risk-based plan even after vaccination.`,correct:!0,reason:`Vaccination does not eliminate all cervical cancer risk or replace screening.`},{id:`o1`,text:`Agree that one vaccine dose permanently replaces all screening.`,correct:!1,reason:`Vaccination and screening serve complementary purposes.`},{id:`o2`,text:`Explain that the vaccine treats an already abnormal cervical biopsy.`,correct:!1,reason:`Vaccination is preventive, not treatment of existing lesions.`},{id:`o3`,text:`Recommend screening only when pain develops.`,correct:!1,reason:`Precancerous changes may be asymptomatic.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — HPV prevention.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 19.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related hpv prevention content (supplement).`},{label:`CDC · HPV and screening`,url:`https://www.cdc.gov/std/treatment-guidelines/hpv.htm`}],origin:`Original expanded-bank scenario`,clue:`Prevention does not remove the need for appropriate surveillance.`,rationale:`Clarify the role of vaccination while encouraging recommended follow-up for the patient's history.`},{id:`e286`,topic:`GYN`,area:`gyn_infection`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Safety`],stem:`A patient using a high-absorbency tampon has sudden fever, vomiting, diffuse rash, dizziness, and BP 80/42 mmHg. Which action has priority?`,options:[{id:`o0`,text:`Initiate emergency assessment and circulatory support for possible toxic shock syndrome.`,correct:!0,reason:`Shock with systemic symptoms requires urgent treatment and source management.`},{id:`o1`,text:`Recommend changing tampon brands and resting at home.`,correct:!1,reason:`Product counseling alone does not address current shock.`},{id:`o2`,text:`Treat as an uncomplicated local yeast infection.`,correct:!1,reason:`Hypotension and systemic illness exceed localized vaginitis.`},{id:`o3`,text:`Delay care until a culture confirms the organism.`,correct:!1,reason:`Resuscitation cannot wait for microbiologic confirmation.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Toxic shock syndrome.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 26.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related toxic shock syndrome content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The patient has systemic illness and shock, not merely vaginal discomfort.`,rationale:`Stabilize first and coordinate prompt antimicrobial and source-control care as ordered.`},{id:`e287`,topic:`GYN`,area:`gyn_assessment`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A patient reports soaking pads hourly for several hours and becomes dizzy when standing. The pulse is 122/min. Which assessment takes priority?`,options:[{id:`o0`,text:`Hemodynamic status, current bleeding, and the need for urgent stabilization.`,correct:!0,reason:`Tachycardia and orthostatic symptoms suggest clinically significant blood loss.`},{id:`o1`,text:`Detailed preferred-brand history for menstrual products.`,correct:!1,reason:`Product choice is not the immediate threat.`},{id:`o2`,text:`A routine discussion of long-term cycle tracking only.`,correct:!1,reason:`Cycle information does not replace assessment of current perfusion.`},{id:`o3`,text:`Reassurance based solely on the patient's young age.`,correct:!1,reason:`Age does not exclude dangerous bleeding.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Abnormal uterine bleeding.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 5.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related abnormal uterine bleeding content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The amount of bleeding is accompanied by perfusion-related symptoms.`,rationale:`Address acute instability before investigating every chronic cause of abnormal bleeding.`},{id:`e288`,topic:`GYN`,area:`gyn_assessment`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Safety`,`Care management`],stem:`A previously menstruating patient reports two missed periods and asks for medication to "restart the cycle." Which ste
