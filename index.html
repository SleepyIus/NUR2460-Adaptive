ect:!0,reason:`Severe localized pain and pressure with tachycardia suggest concealed tissue bleeding despite scant lochia.`},{id:`o2`,text:`Repeat fundal massage for presumed uterine atony.`,correct:!1,reason:`A firm fundus and focal perineal symptoms do not fit atony as the main problem.`},{id:`o3`,text:`Document expected forceps discomfort and wait for the oral medication to peak.`,correct:!1,reason:`Disproportionate pain and a rising pulse require reassessment rather than routine reassurance.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Operative birth trauma.`},{label:`Week 5 HR Labor and Delivery lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related operative birth trauma content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 24`},{id:`q25`,topic:`Labor`,area:`labor_surgery`,difficulty:3,kind:`SATA`,skills:[`Teaching`,`Priority`,`Safety`],stem:`A patient who had cesarean birth after preeclampsia is discussing discharge precautions. Which statements identify symptoms requiring urgent medical evaluation? Select all that apply.`,clue:`Discharge teaching must cover life-threatening postpartum complications while distinguishing expected recovery findings.`,rationale:`Discharge teaching must cover life-threatening postpartum complications while distinguishing expected recovery findings.`,options:[{id:`o0`,text:`"A severe headache with visual changes still matters after the baby is born."`,correct:!0,reason:`Preeclampsia-related complications can occur or persist postpartum.`},{id:`o1`,text:`"Mild cramping only while breastfeeding means I am hemorrhaging."`,correct:!1,reason:`Brief breastfeeding-associated afterpains can be expected without heavy bleeding or instability.`},{id:`o2`,text:`"I will seek emergency help for sudden chest pain or difficulty breathing."`,correct:!0,reason:`These symptoms may indicate pulmonary embolism, pulmonary edema, or another emergency.`},{id:`o3`,text:`"Bleeding that soaks a pad in an hour, especially with dizziness, needs immediate attention."`,correct:!0,reason:`Heavy bleeding and symptoms of reduced perfusion are hemorrhage warnings.`},{id:`o4`,text:`"Incisional soreness that improves with prescribed medicine means the incision is infected."`,correct:!1,reason:`Improving soreness alone is not evidence of infection; worsening pain, redness, drainage, or fever needs assessment.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Discharge warning signs.`},{label:`Week 5 HR Labor and Delivery lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related discharge warning signs content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 25`},{id:`q26`,topic:`Labor`,area:`labor_medications`,difficulty:2,kind:`MC`,skills:[`Pharmacology`,`Teaching`,`Care management`],stem:`A patient at 30 weeks with preterm labor asks why betamethasone is ordered when contractions have already decreased. Which response is best?`,clue:`Explain the purpose of each medication rather than assuming all preterm-labor drugs have the same role. Do not delay an urgently indicated birth solely to finish a steroid course.`,rationale:`Explain the purpose of each medication rather than assuming all preterm-labor drugs have the same role. Do not delay an urgently indicated birth solely to finish a steroid course.`,options:[{id:`o0`,text:`"Its main purpose is to lower your blood glucose before birth."`,correct:!1,reason:`Corticosteroids may raise glucose, requiring monitoring rather than being used to lower it.`},{id:`o1`,text:`"It prevents neonatal infection after membrane rupture."`,correct:!1,reason:`Betamethasone is not an antibiotic.`},{id:`o2`,text:`"It guarantees that the baby will not need respiratory support."`,correct:!1,reason:`Benefit does not eliminate all consequences of prematurity.`},{id:`o3`,text:`"It promotes fetal lung maturation if birth occurs early; it is not the drug used to stop contractions."`,correct:!0,reason:`Corticosteroids improve fetal readiness for preterm birth independently of current contraction frequency.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Betamethasone.`},{label:`Week 5 HR Labor and Delivery lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related betamethasone content (supplement).`},{label:`ATI RN Pharmacology for Nursing, edition 8 — relevant section.`}],origin:`Original PDF question 26`},{id:`q27`,topic:`Labor`,area:`labor_medications`,difficulty:2,kind:`MC`,skills:[`Pharmacology`,`Safety`,`Care management`],stem:`Oxytocin 30 units is mixed in 500 mL of lactated Ringer's. The prescribed dose is 6 milliunits/min. The fetal and contraction assessments permit starting therapy. Which pump rate should the nurse independently calculate before the required medication check?`,clue:`Convert units to milliunits and minutes to hours explicitly. Use the pump and independent verification required for this high-alert medication.`,rationale:`Convert units to milliunits and minutes to hours explicitly. Use the pump and independent verification required for this high-alert medication.`,options:[{id:`o0`,text:`100 mL/hr.`,correct:!1,reason:`This would deliver 100 milliunits/min and is not supported by the concentration calculation.`},{id:`o1`,text:`0.1 mL/hr.`,correct:!1,reason:`This is the calculated volume per minute, not per hour.`},{id:`o2`,text:`6 mL/hr.`,correct:!0,reason:`30 units = 30,000 milliunits; 30,000/500 = 60 milliunits/mL. Then 6 x 60/60 = 6 mL/hr.`},{id:`o3`,text:`60 mL/hr.`,correct:!1,reason:`This would deliver 60 milliunits/min, ten times the prescribed dose.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Oxytocin calculation.`},{label:`Week 5 HR Labor and Delivery lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related oxytocin calculation content (supplement).`},{label:`ATI RN Pharmacology for Nursing, edition 8 — relevant section.`}],origin:`Original PDF question 27`},{id:`q28`,topic:`Labor`,area:`labor_assessment`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Care management`,`Safety`,`Teaching`],stem:`A stable patient at 29 weeks with confirmed PPROM is admitted for expectant management. There is no fever, bleeding, labor, or nonreassuring fetal pattern. Which nursing measures are appropriate? Select all that apply.`,clue:`Expectant management requires active surveillance and prevention, not simply waiting. New maternal or fetal findings may require immediate reassessment of the birth plan.`,rationale:`Expectant management requires active surveillance and prevention, not simply waiting. New maternal or fetal findings may require immediate reassessment of the birth plan.`,options:[{id:`o0`,text:`Teach that a normal temperature rules out every complication of membrane rupture.`,correct:!1,reason:`Cord problems, abruption, or evolving infection may occur without initial fever.`},{id:`o1`,text:`Perform a digital cervical examination every two hours to establish a trend.`,correct:!1,reason:`Repeated digital examinations increase infection risk and are not routine in stable PPROM.`},{id:`o2`,text:`Monitor temperature and assess for uterine tenderness and changes in fluid odor.`,correct:!0,reason:`These findings can signal infection during expectant management.`},{id:`o3`,text:`Administer prescribed latency antibiotics and antenatal corticosteroids.`,correct:!0,reason:`These support the planned expectant-management strategy when continued pregnancy remains safe.`},{id:`o4`,text:`Continue prescribed fetal surveillance and promptly report reduced fetal movement.`,correct:!0,reason:`Fetal compromise can change the management plan.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — PPROM.`},{label:`Week 5 HR Labor and Delivery lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related pprom content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 28`},{id:`q29`,topic:`Labor`,area:`labor_emergencies`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Interprofessional collaboration`,`Safety`],stem:`After the fetal head delivers, it retracts against the perineum and the shoulders do not deliver. The birth clinician announces shoulder dystocia. Which actions should the nurse perform or assist with? Select all that apply.`,clue:`Coordinated maneuvers, not forceful pushing or traction, address shoulder impaction. Follow the clinician's directions and document the sequence accurately.`,rationale:`Coordinated maneuvers, not forceful pushing or traction, address shoulder impaction. Follow the clinician's directions and document the sequence accurately.`,options:[{id:`o0`,text:`Call the additional obstetric and neonatal team members specified by protocol.`,correct:!0,reason:`Extra personnel and newborn resuscitation readiness are needed for this time-critical emergency.`},{id:`o1`,text:`Apply suprapubic pressure when directed by the birth clinician.`,correct:!0,reason:`Correctly directed suprapubic pressure can help dislodge the impacted shoulder.`},{id:`o2`,text:`Apply fundal pressure to increase the expulsive force.`,correct:!1,reason:`Fundal pressure can worsen impaction and injury.`},{id:`o3`,text:`Assist with McRoberts positioning as directed.`,correct:!0,reason:`Hyperflexing the patient's thighs can improve the pelvic relationship for shoulder release.`},{id:`o4`,text:`Pull forcefully on the delivered head between maneuvers.`,correct:!1,reason:`Excessive traction increases brachial plexus and other birth-injury risks.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Shoulder dystocia.`},{label:`Week 5 HR Labor and Delivery lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related shoulder dystocia content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 29`},{id:`q30`,topic:`Labor`,area:`labor_emergencies`,difficulty:3,kind:`MC`,skills:[`Interprofessional collaboration`,`Priority`,`Care management`],stem:`A patient attempting vaginal birth after cesarean has sudden persistent fetal bradycardia, loss of fetal station, abdominal pain, and BP 86/50 mmHg. Oxytocin has been stopped and emergency assistance is arriving. Which handoff best conveys the priority?`,clue:`An effective emergency handoff states the pattern, the immediate threat, and the needed response. Do not bury critical information beneath routine labor details.`,rationale:`An effective emergency handoff states the pattern, the immediate threat, and the needed response. Do not bury critical information beneath routine labor details.`,options:[{id:`o0`,text:`"Possible uterine rupture with maternal shock and fetal compromise; we need immediate surgical and resuscitation readiness."`,correct:!0,reason:`This identifies the suspected emergency and the time-critical resources required.`},{id:`o1`,text:`"The epidural may be wearing off; please reassess analgesia when available."`,correct:!1,reason:`Pain treatment alone does not address the loss of station, shock, and fetal deterioration.`},{id:`o2`,text:`"The patient is anxious about the tracing; counseling is the main need."`,correct:!1,reason:`Anxiety is not the primary explanation for objective maternal-fetal instability.`},{id:`o3`,text:`"Labor progress has slowed; consider restarting oxytocin after a brief rest."`,correct:!1,reason:`Further stimulation is unsafe in suspected rupture.`}],refs:[{label:`Week 5 Exam 2 HR Labor and Delivery Instructor Notes — Uterine rupture.`},{label:`Week 5 HR Labor and Delivery lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related uterine rupture content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 30`},{id:`q31`,topic:`Newborn`,area:`newborn_stability`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Pharmacology`,`Priority`,`Safety`],stem:`A 2-hour-old newborn of a patient with diabetes is lethargic, has a weak suck and intermittent apnea, and has a bedside glucose of 26 mg/dL. The nurse is supporting the airway and has called the neonatal team. Which intervention should be anticipated next?`,clue:`The least invasive route is not always the safest route. Symptoms and feeding safety determine urgency and treatment, not the glucose value alone.`,rationale:`The least invasive route is not always the safest route. Symptoms and feeding safety determine urgency and treatment, not the glucose value alone.`,options:[{id:`o0`,text:`A full bottle feeding before any other glucose treatment is considered.`,correct:!1,reason:`Lethargy, weak suck, and apnea make oral feeding unsafe and inadequate as the first treatment.`},{id:`o1`,text:`Insulin administration to stabilize the newborn's glucose regulation.`,correct:!1,reason:`Insulin would further lower glucose.`},{id:`o2`,text:`A repeat glucose in one hour before initiating treatment.`,correct:!1,reason:`Delay risks neurologic injury and continued apnea.`},{id:`o3`,text:`Prompt IV dextrose treatment under the neonatal hypoglycemia protocol.`,correct:!0,reason:`Severe symptomatic hypoglycemia with unsafe oral feeding needs rapid parenteral treatment and reassessment.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Hypoglycemia.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related hypoglycemia content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 31`},{id:`q32`,topic:`Newborn`,area:`newborn_trauma`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Interprofessional collaboration`],stem:`Four hours after vacuum-assisted birth, a newborn has expanding diffuse scalp swelling crossing sutures, pallor, pulse 190/min, and increasing head circumference. Which action is most appropriate?`,clue:`The trend in swelling and systemic findings makes this an emergency. Do not classify a scalp lesion using one anatomic feature alone.`,rationale:`The trend in swelling and systemic findings makes this an emergency. Do not classify a scalp lesion using one anatomic feature alone.`,options:[{id:`o0`,text:`Schedule bilirubin testing for tomorrow as the only follow-up.`,correct:!1,reason:`Jaundice monitoring does not address current shock risk.`},{id:`o1`,text:`Aspirate the swelling at the bedside to reduce pressure.`,correct:!1,reason:`Aspiration is not a nursing treatment and can cause injury or infection.`},{id:`o2`,text:`Activate urgent neonatal evaluation for suspected subgaleal hemorrhage and prepare circulatory support.`,correct:!0,reason:`Expanding swelling with tachycardia and pallor suggests potentially life-threatening blood loss.`},{id:`o3`,text:`Reassure the parents that all swelling crossing sutures is benign caput.`,correct:!1,reason:`Crossing sutures does not distinguish benign edema from subgaleal hemorrhage.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Subgaleal hemorrhage.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related subgaleal hemorrhage content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 32`},{id:`q33`,topic:`Newborn`,area:`newborn_congenital`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Safety`,`Interprofessional collaboration`],stem:`An infant has confirmed phenylketonuria. The metabolic team has prescribed a measured feeding plan using medical formula and an individualized amount of other milk. Which actions belong in the nursing plan? Select all that apply.`,clue:`PKU management balances prevention of neurotoxicity with adequate growth. It requires precise, individualized nutrition rather than indiscriminate food elimination.`,rationale:`PKU management balances prevention of neurotoxicity with adequate growth. It requires precise, individualized nutrition rather than indiscriminate food elimination.`,options:[{id:`o0`,text:`Eliminate every source of protein without consulting the team.`,correct:!1,reason:`Infants still require adequate protein and essential nutrients through a specialized plan.`},{id:`o1`,text:`Coordinate feeding adjustments with the metabolic dietitian and monitor ordered phenylalanine levels.`,correct:!0,reason:`Nutrition must support growth while keeping phenylalanine in the prescribed range.`},{id:`o2`,text:`Teach caregivers to avoid products containing aspartame.`,correct:!0,reason:`Aspartame is a source of phenylalanine.`},{id:`o3`,text:`Use weight gain alone to judge metabolic control once feeding is established.`,correct:!1,reason:`Good growth does not prove that phenylalanine is in range; prescribed blood monitoring remains necessary.`},{id:`o4`,text:`Stop the medical formula once the infant has no visible symptoms.`,correct:!1,reason:`Early absence of symptoms does not remove the need for ongoing metabolic management.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Phenylketonuria.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related phenylketonuria content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 33`},{id:`q34`,topic:`Newborn`,area:`newborn_stability`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A nurse receives reports on four postterm newborns. Which newborn should be assessed first?`,clue:`Identify a current physiologic threat rather than selecting a newborn solely because of expected postterm appearance.`,rationale:`Identify a current physiologic threat rather than selecting a newborn solely because of expected postterm appearance.`,options:[{id:`o0`,text:`A newborn with long fingernails and no visible vernix who remains alert.`,correct:!1,reason:`These appearance findings alone are not the priority.`},{id:`o1`,text:`A newborn with a glucose of 62 mg/dL who is due for the next scheduled feeding.`,correct:!1,reason:`This stable situation is lower priority than respiratory compromise.`},{id:`o2`,text:`A newborn with meconium-stained fluid at birth who now has grunting, retractions, and oxygen saturation of 86%.`,correct:!0,reason:`Active respiratory distress and hypoxemia require immediate evaluation and support.`},{id:`o3`,text:`A newborn with dry peeling skin who feeds effectively and has normal vital signs.`,correct:!1,reason:`This can be a postmaturity finding without acute instability.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Postterm newborn.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related postterm newborn content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 34`},{id:`q35`,topic:`Newborn`,area:`newborn_stability`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`],stem:`A term newborn below the 10th weight percentile has an axillary temperature of 35.8 C after an examination. The infant is awake but jittery. Which plan is most appropriate?`,clue:`Treat the thermal problem and assess linked metabolic and respiratory consequences together. Do not let one risk label exclude another.`,rationale:`Treat the thermal problem and assess linked metabolic and respiratory consequences together. Do not let one risk label exclude another.`,options:[{id:`o0`,text:`Begin controlled warming, promptly check glucose, and assess respiratory status.`,correct:!0,reason:`SGA infants have limited reserves; cold stress increases oxygen and glucose demand and can coexist with hypoglycemia.`},{id:`o1`,text:`Delay glucose screening because only large newborns are at risk.`,correct:!1,reason:`SGA newborns also have significant hypoglycemia risk.`},{id:`o2`,text:`Observe for several hours because term gestation eliminates thermal instability.`,correct:!1,reason:`Term gestation does not prevent cold stress, especially with low body reserves.`},{id:`o3`,text:`Complete the bath before rechecking the temperature.`,correct:!1,reason:`Bathing increases heat loss in an already cold infant.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Small for gestational age.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related small for gestational age content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 35`},{id:`q36`,topic:`Newborn`,area:`newborn_congenital`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Safety`,`Interprofessional collaboration`],stem:`A newborn with an open myelomeningocele is awaiting surgical evaluation. Which measures should the nurse include? Select all that apply.`,clue:`Before repair, priorities are tissue protection, infection prevention, and assessment of associated deficits. Coordinate handling and positioning with the surgical team.`,rationale:`Before repair, priorities are tissue protection, infection prevention, and assessment of associated deficits. Coordinate handling and positioning with the surgical team.`,options:[{id:`o0`,text:`Position prone or side-lying as ordered to avoid pressure on the sac.`,correct:!0,reason:`Mechanical pressure can damage exposed neural tissue.`},{id:`o1`,text:`Place the diaper edge directly across the lesion to hold the covering in place.`,correct:!1,reason:`This increases pressure and contamination risk.`},{id:`o2`,text:`Apply a dry adhesive dressing tightly over the sac.`,correct:!1,reason:`Adherence, drying, and pressure can injure the lesion.`},{id:`o3`,text:`Protect the lesion with the prescribed sterile, moist, nonadherent covering.`,correct:!0,reason:`Protection reduces drying and contamination without adhering to tissue.`},{id:`o4`,text:`Use latex precautions and assess lower-extremity movement, elimination, and head circumference.`,correct:!0,reason:`Associated neurologic, bladder, bowel, and hydrocephalus concerns require baseline and ongoing assessment.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Myelomeningocele.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related myelomeningocele content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 36`},{id:`q37`,topic:`Newborn`,area:`newborn_congenital`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Safety`],stem:`An infant wearing a Pavlik harness has a newly cool, pale right foot and less movement on that side. The caregiver asks whether to tighten the straps to improve the hip position. What is the nurse's best response?`,clue:`A device intended to treat a deformity must not compromise circulation or nerve function. Routine strap changes are not a caregiver task.`,rationale:`A device intended to treat a deformity must not compromise circulation or nerve function. Routine strap changes are not a caregiver task.`,options:[{id:`o0`,text:`Tighten both leg straps equally and recheck the foot tomorrow.`,correct:!1,reason:`Further constriction may worsen compromise, and delayed reassessment is unsafe.`},{id:`o1`,text:`Explain that a cool foot is expected while the hip is being corrected.`,correct:!1,reason:`This is not an expected finding to dismiss.`},{id:`o2`,text:`Massage the foot vigorously while keeping all concerns for the next routine visit.`,correct:!1,reason:`Massage does not correct a potentially compressive device problem and delays evaluation.`},{id:`o3`,text:`Assess neurovascular status immediately and obtain urgent orthopedic direction about the harness.`,correct:!0,reason:`A new perfusion or movement change requires prompt evaluation and a clinician-directed adjustment or release plan.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Hip dysplasia.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related hip dysplasia content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 37`},{id:`q38`,topic:`Newborn`,area:`newborn_congenital`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Interprofessional collaboration`],stem:`An infant with a ventriculoperitoneal shunt is unusually sleepy, has repeated vomiting, and has a tense fontanel when calm and upright. Which action takes priority?`,clue:`Clinical deterioration can signal shunt failure before a dramatic head-size change. Protect the infant and promptly involve the responsible team.`,rationale:`Clinical deterioration can signal shunt failure before a dramatic head-size change. Protect the infant and promptly involve the responsible team.`,options:[{id:`o0`,text:`Wait for the next head-circumference measurement before reporting.`,correct:!1,reason:`Acute neurologic changes warrant escalation even without a documented growth trend.`},{id:`o1`,text:`Compress the shunt reservoir repeatedly to test patency.`,correct:!1,reason:`Unprescribed reservoir manipulation can be harmful and is not a substitute for evaluation.`},{id:`o2`,text:`Obtain urgent evaluation for shunt malfunction or increased intracranial pressure.`,correct:!0,reason:`The combination of neurologic change, vomiting, and a tense fontanel suggests impaired CSF drainage or another serious complication.`},{id:`o3`,text:`Give an oral feeding to determine whether hunger explains the irritability.`,correct:!1,reason:`Feeding does not address possible increased intracranial pressure and may be unsafe with vomiting and lethargy.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Hydrocephalus.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related hydrocephalus content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 38`},{id:`q39`,topic:`Newborn`,area:`newborn_trauma`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Care management`,`Safety`],stem:`A 38-week newborn, now 10 hours old, has visible jaundice and a positive direct antiglobulin test. Which actions or interpretations are appropriate? Select all that apply.`,clue:`A positive direct antiglobulin test identifies a possible hemolytic mechanism, not an automatic treatment level. Jaundice in the first day is not routine physiologic jaundice.`,rationale:`A positive direct antiglobulin test identifies a possible hemolytic mechanism, not an automatic treatment level. Jaundice in the first day is not routine physiologic jaundice.`,options:[{id:`o0`,text:`Obtain and trend prescribed bilirubin measurements using age in hours and risk factors.`,correct:!0,reason:`Early jaundice and possible hemolysis require timely, age-specific evaluation.`},{id:`o1`,text:`Treat the positive test alone as proof that an exchange transfusion is required.`,correct:!1,reason:`The test supports antibody coating of red cells; treatment depends on the clinical and bilirubin assessment.`},{id:`o2`,text:`Discontinue ordered phototherapy as soon as the skin looks less yellow, before the ordered bilirubin reassessment.`,correct:!1,reason:`Visual appearance cannot replace bilirubin measurement or the prescribed discontinuation criteria.`},{id:`o3`,text:`Apply the same bilirubin threshold used for every 3-day-old newborn.`,correct:!1,reason:`Age, gestational age, and neurotoxicity risk change treatment thresholds.`},{id:`o4`,text:`Assess for anemia and feeding or neurologic changes.`,correct:!0,reason:`Hemolysis can cause anemia, and worsening bilirubin toxicity may affect behavior or tone.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Pathologic jaundice.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related pathologic jaundice content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`},{label:`AAP · Hyperbilirubinemia guideline, 2022 (at least 35 weeks)`,url:`https://publications.aap.org/pediatrics/article/150/3/e2022058859/188726/Clinical-Practice-Guideline-Revision-Management-of`}],origin:`Original PDF question 39`},{id:`q40`,topic:`Newborn`,area:`newborn_family`,difficulty:3,kind:`MC`,skills:[`Care management`,`Priority`,`Interprofessional collaboration`],stem:`A newborn with opioid withdrawal is unable to sleep for an hour after feeding and remains difficult to console despite swaddling and a quiet environment. The caregiver is present and asks to help. Which plan is best?`,clue:`Treat the newborn's function and support the family without stigma. Failure of optimized nonpharmacologic care warrants team reassessment, not abandonment of caregiver involvement.`,rationale:`Treat the newborn's function and support the family without stigma. Failure of optimized nonpharmacologic care warrants team reassessment, not abandonment of caregiver involvement.`,options:[{id:`o0`,text:`Give naloxone to reverse the withdrawal symptoms.`,correct:!1,reason:`Naloxone does not treat withdrawal and can precipitate severe withdrawal in an opioid-dependent infant.`},{id:`o1`,text:`Separate the newborn from all caregiver contact to reduce stimulation.`,correct:!1,reason:`Familiar, supported caregiver contact can be therapeutic; separation is not the default withdrawal treatment.`},{id:`o2`,text:`Involve the caregiver in the structured eat-sleep-console plan and report persistent functional impairment for treatment reassessment.`,correct:!0,reason:`Supportive care and caregiver participation continue while the team determines whether additional treatment is needed.`},{id:`o3`,text:`Delay reassessment until weight loss becomes severe.`,correct:!1,reason:`Persistent inability to eat, sleep, or be consoled already indicates inadequate symptom control.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Opioid withdrawal.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related opioid withdrawal content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 40`},{id:`q41`,topic:`Newborn`,area:`newborn_stability`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`,`Safety`],stem:`During an oral feeding, a 34-week newborn becomes dusky, coughs, and has oxygen saturation fall to 82%. What should the nurse do first?`,clue:`Physiologic stability takes priority over reaching a volume goal. After recovery, reassess feeding readiness and collaborate on pacing or an alternate feeding route.`,rationale:`Physiologic stability takes priority over reaching a volume goal. After recovery, reassess feeding readiness and collaborate on pacing or an alternate feeding route.`,options:[{id:`o0`,text:`Stop the feeding and support airway and breathing according to the neonatal protocol.`,correct:!0,reason:`The infant is showing feeding-related respiratory compromise and cannot safely continue oral intake.`},{id:`o1`,text:`Continue feeding while waiting to see whether the oxygen saturation recovers.`,correct:!1,reason:`Continuing oral intake prolongs the immediate threat.`},{id:`o2`,text:`Document the amount taken before interrupting the feeding.`,correct:!1,reason:`Documentation follows stabilization.`},{id:`o3`,text:`Increase the nipple flow so the infant finishes before becoming more tired.`,correct:!1,reason:`A faster flow worsens suck-swallow-breathe mismatch and aspiration risk.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Feeding readiness.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related feeding readiness content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 41`},{id:`q42`,topic:`Newborn`,area:`newborn_stability`,difficulty:3,kind:`SATA`,skills:[`Assessment`,`Care management`,`Pharmacology`,`Priority`],stem:`A preterm infant receiving tube feeds develops a larger abdominal girth, bloody stool, lethargy, and temperature instability. Necrotizing enterocolitis is suspected. Which actions are appropriate? Select all that apply.`,clue:`Treat this cluster as an evolving emergency, not simple feeding intolerance. Stabilization and close reassessment accompany diagnostic and surgical evaluation.`,rationale:`Treat this cluster as an evolving emergency, not simple feeding intolerance. Stabilization and close reassessment accompany diagnostic and surgical evaluation.`,options:[{id:`o0`,text:`Notify the neonatal team and prepare ordered gastric decompression.`,correct:!0,reason:`Bowel rest and decompression are central early measures.`},{id:`o1`,text:`Perform repeated rectal stimulation to empty the bowel.`,correct:!1,reason:`This can injure compromised tissue and does not address the disease process.`},{id:`o2`,text:`Prepare IV support, prescribed antibiotics, and serial abdominal and perfusion assessments.`,correct:!0,reason:`NEC can progress to sepsis, perforation, and shock.`},{id:`o3`,text:`Stop enteral feeds and maintain NPO status.`,correct:!0,reason:`Continued feeding can worsen the compromised bowel and aspiration risk.`},{id:`o4`,text:`Dilute the formula and resume feeding at half the rate.`,correct:!1,reason:`A formula adjustment is not adequate treatment for suspected NEC.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Necrotizing enterocolitis.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related necrotizing enterocolitis content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 42`},{id:`q43`,topic:`Newborn`,area:`newborn_trauma`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Safety`],stem:`After a birth complicated by shoulder dystocia, a newborn has reduced movement of one shoulder and elbow but an intact hand grasp on that side. Which initial nursing plan is best?`,clue:`Recognize the pattern without assuming that one preserved reflex rules out injury. Protect the limb and follow the ordered therapy timeline.`,rationale:`Recognize the pattern without assuming that one preserved reflex rules out injury. Protect the limb and follow the ordered therapy timeline.`,options:[{id:`o0`,text:`Protect the affected arm, assess for associated fracture or injury, and obtain the prescribed evaluation.`,correct:!0,reason:`The pattern suggests an upper brachial plexus injury, but associated trauma must be assessed before a handling and therapy plan is finalized.`},{id:`o1`,text:`Lift the newborn under the affected arm to prevent stiffness.`,correct:!1,reason:`Traction and unsupported handling can aggravate injury.`},{id:`o2`,text:`Reassure the family that intact grasp excludes birth injury.`,correct:!1,reason:`Upper plexus injury can preserve hand grasp while limiting shoulder and elbow movement.`},{id:`o3`,text:`Begin forceful range-of-motion exercises to restore symmetry immediately.`,correct:!1,reason:`Aggressive movement can worsen an acute injury or unrecognized fracture.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Erb palsy.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — related erb palsy content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 43`},{id:`q44`,topic:`Newborn`,area:`newborn_congenital`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`Following cleft palate repair, an infant has repeated swallowing, fresh blood in the mouth, and a rising pulse. Which action is the priority?`,clue:`Postoperative airway protection and hemorrhage recognition outrank feeding goals. Feeding devices and oral-care restrictions are procedure-specific.`,rationale:`Postoperative airway protection and hemorrhage recognition outrank feeding goals. Feeding devices and oral-care restrictions are procedure-specific.`,options:[{id:`o0`,text:`Assess airway and bleeding immediately and notify the surgical team.`,correct:!0,reason:`Repeated swallowing may conceal bleeding; blood can threaten airway safety and circulation.`},{id:`o1`,text:`Wait until the next scheduled pain assessment because swallowing is expected.`,correct:!1,reason:`Fresh bleeding and tachycardia are not explained by ordinary swallowing.`},{id:`o2`,text:`Perform deep, blind oral suction across the repair.`,correct:!1,reason:`This risks disrupting the repair and worsening bleeding; airway interventions must follow the emergency and surgical plan.`},{id:`o3`,text:`Offer a bottle to determine whether the infant can swallow effectively.`,correct:!1,reason:`Feeding during active bleeding can increase aspiration risk and may violate the repair-specific plan.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Cleft repair.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related cleft repair content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 44`},{id:`q45`,topic:`Newborn`,area:`newborn_congenital`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Safety`,`Interprofessional collaboration`],stem:`A newborn has exposed bowel beside the umbilicus without a covering sac. Which nursing measures are appropriate while the surgical team evaluates the infant? Select all that apply.`,clue:`The priorities in gastroschisis are protecting perfusion and tissue while preventing heat and fluid loss. Reduction and closure belong to the surgical plan.`,rationale:`The priorities in gastroschisis are protecting perfusion and tissue while preventing heat and fluid loss. Reduction and closure belong to the surgical plan.`,options:[{id:`o0`,text:`Apply dry gauze directly to the bowel and let it adhere.`,correct:!1,reason:`Dry adherent material can desiccate and injure exposed tissue.`},{id:`o1`,text:`Protect the bowel with the prescribed sterile bowel bag or protective covering and prevent twisting or compression.`,correct:!0,reason:`Exposed bowel is vulnerable to injury, contamination, and impaired perfusion.`},{id:`o2`,text:`Push the bowel back into the abdomen before applying a diaper.`,correct:!1,reason:`Bedside manual reduction by the nurse can damage bowel and compromise circulation.`},{id:`o3`,text:`Maintain thermal support and prepare ordered IV fluid replacement.`,correct:!0,reason:`Exposed viscera create substantial heat and fluid losses.`},{id:`o4`,text:`Keep the infant NPO and prepare ordered gastric decompression.`,correct:!0,reason:`Decompression limits bowel distention while awaiting definitive care.`}],refs:[{label:`Week 5 Exam 2 HR Newborn Instructor Notes — Gastroschisis.`},{label:`Week 5 HR Newborn lecture — related topic.`},{label:`ATI RN Nursing Care of Children, edition 11 — related gastroschisis content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 45`},{id:`q46`,topic:`GYN`,area:`gyn_contraception`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Pharmacology`,`Safety`],stem:`The nurse is reviewing histories before a combined estrogen-progestin contraceptive is prescribed. Which findings require stopping the routine initiation process and clarifying eligibility with the prescriber? Select all that apply.`,clue:`Assess method-specific risks rather than assuming every contraceptive has the same contraindications. A safer alternative should be selected through individualized counseling.`,rationale:`Assess method-specific risks rather than assuming every contraceptive has the same contraindications. A safer alternative should be selected through individualized counseling.`,options:[{id:`o0`,text:`A current deep vein thrombosis in a patient not yet treated.`,correct:!0,reason:`Estrogen increases thrombotic risk and is inappropriate in this setting.`},{id:`o1`,text:`Migraine headaches preceded by visual aura.`,correct:!0,reason:`Estrogen-containing contraception is contraindicated with migraine with aura because of stroke risk.`},{id:`o2`,text:`Current breast cancer.`,correct:!0,reason:`Current breast cancer is a contraindication to combined hormonal contraception.`},{id:`o3`,text:`A treated chlamydia infection two years ago without current symptoms.`,correct:!1,reason:`A remote treated STI does not by itself prohibit combined hormonal contraception.`},{id:`o4`,text:`Age 22 years and no previous pregnancies.`,correct:!1,reason:`Young age and nulliparity are not contraindications.`},{id:`o5`,text:`BP 168/106 mmHg on repeated measurements.`,correct:!0,reason:`Severe hypertension makes combined hormonal contraception unsafe.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception contraindications.`},{label:`Week 6 Contraception & Abortion lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception contraindications content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`},{label:`CDC · Combined hormonal contraceptive eligibility`,url:`https://www.cdc.gov/contraception/hcp/usmec/combined-hormonal-contraceptives.html`}],origin:`Original PDF question 46`},{id:`q47`,topic:`GYN`,area:`gyn_contraception`,difficulty:2,kind:`SATA`,skills:[`Teaching`,`Pharmacology`,`Care management`],stem:`A patient using a standard 21-active-pill combined oral contraceptive missed the first two active pills after the seven-day hormone-free interval. It is now day 3, and unprotected intercourse occurred two days ago. Which instructions are appropriate? Select all that apply.`,clue:`Timing within the pack changes the risk. Emergency contraceptive choice can affect when hormonal pills resume, so the patient needs the specific plan rather than mixing instructions for different products.`,rationale:`Timing within the pack changes the risk. Emergency contraceptive choice can affect when hormonal pills resume, so the patient needs the specific plan rather than mixing instructions for different products.`,options:[{id:`o0`,text:`Assume the previous pack continues to protect against pregnancy throughout any missed-pill interval.`,correct:!1,reason:`An extended hormone-free interval can permit ovulation.`},{id:`o1`,text:`Contact the clinician or pharmacist today to consider emergency contraception and the appropriate method-specific plan.`,correct:!0,reason:`First-week missed pills with intercourse in the previous five days warrant consideration of emergency contraception.`},{id:`o2`,text:`Take the most recently missed active pill now, discard the earlier missed pill, and continue the pack on schedule.`,correct:!0,reason:`Management of two or more missed active pills resumes hormone use promptly rather than taking every missed pill.`},{id:`o3`,text:`Stop the pack completely and wait for the next menstrual period before restarting.`,correct:!1,reason:`Further extending the hormone-free interval increases pregnancy risk.`},{id:`o4`,text:`Use condoms or abstain until seven consecutive active pills have been taken.`,correct:!0,reason:`Backup is required while ovulation suppression is reestablished.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception missed pills.`},{label:`Week 6 Contraception & Abortion lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception missed pills content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`},{label:`CDC · Combined hormonal contraceptives and missed pills`,url:`https://www.cdc.gov/contraception/hcp/usspr/combined-hormonal-contraceptives.html`}],origin:`Original PDF question 47`},{id:`q48`,topic:`GYN`,area:`gyn_assessment`,difficulty:2,kind:`MC`,skills:[`Therapeutic communication`,`Teaching`,`Care management`],stem:`A 17-year-old says, "I forget pills, do not want pregnancy, and do not want my partner to decide my method." Which nursing response best supports safe care?`,clue:`Effective counseling is confidential within applicable limits, nonjudgmental, and patient-directed. Explain privacy limits rather than promising absolute secrecy.`,rationale:`Effective counseling is confidential within applicable limits, nonjudgmental, and patient-directed. Explain privacy limits rather than promising absolute secrecy.`,options:[{id:`o0`,text:`"Let's talk privately about your preferences, methods that do not require daily action, and protection against STIs."`,correct:!0,reason:`This supports autonomy, assesses needs, and permits individualized discussion of long-acting methods and condoms.`},{id:`o1`,text:`"An IUD is the only responsible choice, so we should arrange it now."`,correct:!1,reason:`This coerces a specific method instead of supporting informed choice.`},{id:`o2`,text:`"Your partner should choose because daily pills have not worked for you."`,correct:!1,reason:`The patient's autonomy is not transferred to a partner.`},{id:`o3`,text:`"We cannot discuss contraception until you have had a pelvic examination."`,correct:!1,reason:`A pelvic examination is not universally required for contraceptive counseling or initiation of every method.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Adolescent care.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related adolescent care content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 48`},{id:`q49`,topic:`GYN`,area:`gyn_breast`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`],stem:`A patient on the first postoperative day after mastectomy reports increasing tightness under the incision. One drain that had been collecting sanguineous fluid has stopped, and the operative side appears more swollen. BP is unchanged. What is the best next action?`,clue:`Interpret output together with the wound and trend. A decrease in measured drainage is not automatically improvement.`,rationale:`Interpret output together with the wound and trend. A decrease in measured drainage is not automatically improvement.`,options:[{id:`o0`,text:`Strip the drain forcefully several times without checking the device instructions.`,correct:!1,reason:`Manipulation must follow orders and the device protocol; unapproved force can damage tissue or the system.`},{id:`o1`,text:`Reassure the patient that a stable BP rules out postoperative bleeding.`,correct:!1,reason:`Local bleeding or a developing collection can occur before hypotension.`},{id:`o2`,text:`Assess the operative site and drain tubing and promptly report possible obstruction or accumulating blood.`,correct:!0,reason:`A sudden stop in output with expanding swelling suggests that fluid may be collecting internally.`},{id:`o3`,text:`Remove the drain because no output indicates that drainage is complete.`,correct:!1,reason:`Removal requires a clinical decision; the swelling makes completion an unsafe assumption.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Breast surgery.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related breast surgery content (supplement).`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — relevant section.`}],origin:`Original PDF question 49`},{id:`q50`,topic:`GYN`,area:`gyn_infection`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A patient with a history of chlamydia has worsening lower abdominal pain, fever, purulent discharge, vomiting, and a late menstrual period. Which nursing plan is most appropriate?`,clue:`Do not anchor on a prior STI or one presumed diagnosis. Stabilize and evaluate acute illness while considering pregnancy and the severity of infection.`,rationale:`Do not anchor on a prior STI or one presumed diagnosis. Stabilize and evaluate acute illness while considering pregnancy and the severity of infection.`,options:[{id:`o0`,text:`Obtain urgent evaluation, including pregnancy assessment, and prepare the prescribed treatment for possible serious pelvic infection.`,correct:!0,reason:`Severe illness may require inpatient treatment, and pregnancy-related emergencies must be excluded.`},{id:`o1`,text:`Schedule infertility testing after the current symptoms resolve on their own.`,correct:!1,reason:`Acute infection and possible pregnancy complications require timely care first.`},{id:`o2`,text:`Teach that this is expected primary dysmenorrhea and suggest heat alone.`,correct:!1,reason:`Fever, purulent discharge, vomiting, and a late period are not an uncomplicated menstrual-cramp pattern.`},{id:`o3`,text:`Delay treatment decisions until the next menstrual cycle establishes pregnancy status.`,correct:!1,reason:`This risks progression of infection or an unrecognized ectopic pregnancy.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — PID.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related pid content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 50`},{id:`q51`,topic:`GYN`,area:`gyn_infection`,difficulty:2,kind:`SATA`,skills:[`Teaching`,`Pharmacology`,`Safety`],stem:`A nonpregnant patient is prescribed doxycycline for chlamydia for seven days. Which discharge instructions are appropriate? Select all that apply.`,clue:`Treatment, prevention of reinfection, and later retesting are separate needs. Pregnancy would change medication selection and add a test-of-cure plan.`,rationale:`Treatment, prevention of reinfection, and later retesting are separate needs. Pregnancy would change medication selection and add a test-of-cure plan.`,options:[{id:`o0`,text:`Stop follow-up because an asymptomatic partner cannot transmit infection.`,correct:!1,reason:`Chlamydia is frequently asymptomatic and remains transmissible.`},{id:`o1`,text:`Arrange partner evaluation and treatment.`,correct:!0,reason:`Untreated partners can sustain transmission even without symptoms.`},{id:`o2`,text:`Complete the entire prescribed regimen even if symptoms resolve early.`,correct:!0,reason:`Symptom resolution does not establish eradication before the course is completed.`},{id:`o3`,text:`Avoid intercourse until the course is complete, symptoms have resolved, and partners have been treated.`,correct:!0,reason:`This reduces transmission and immediate reinfection.`},{id:`o4`,text:`Use leftover vaginal antifungal cream instead of completing the antibiotic.`,correct:!1,reason:`Antifungals do not treat chlamydia.`},{id:`o5`,text:`Return for repeat testing in about three months.`,correct:!0,reason:`Repeat infection is common; retesting is recommended even when treatment was completed.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Chlamydia.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related chlamydia content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`},{label:`CDC · Chlamydia`,url:`https://www.cdc.gov/std/treatment-guidelines/chlamydia.htm`}],origin:`Original PDF question 51`},{id:`q52`,topic:`GYN`,area:`gyn_infection`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Pharmacology`,`Teaching`],stem:`A patient reports thin gray discharge and a fishy odor without the intense itching experienced during a previous yeast infection. The patient asks to reuse an old antifungal prescription. Which response is best?`,clue:`Avoid diagnosing or treating solely by a familiar symptom. Obtain the appropriate evaluation and provide nonjudgmental, cause-specific teaching.`,rationale:`Avoid diagnosing or treating solely by a familiar symptom. Obtain the appropriate evaluation and provide nonjudgmental, cause-specific teaching.`,options:[{id:`o0`,text:`Diagnose an STI from the odor alone and ask the patient to inform the partner of confirmed transmission.`,correct:!1,reason:`Symptoms alone neither confirm a pathogen nor establish how it was acquired.`},{id:`o1`,text:`Arrange assessment because this pattern may reflect bacterial vaginosis and needs treatment matched to the cause.`,correct:!0,reason:`Different vaginal conditions can overlap, and an antifungal does not treat bacterial vaginosis.`},{id:`o2`,text:`Recommend frequent douching until the odor disappears.`,correct:!1,reason:`Douching can disrupt vaginal flora and is not a recommended treatment.`},{id:`o3`,text:`Recommend the antifungal because all vaginal discharge has the same cause.`,correct:!1,reason:`This ignores important differences and can delay effective treatment.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Bacterial vaginosis.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related bacterial vaginosis content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 52`},{id:`q53`,topic:`GYN`,area:`gyn_infection`,difficulty:2,kind:`MC`,skills:[`Pharmacology`,`Safety`,`Care management`],stem:`A patient at 10 weeks of pregnancy has confirmed vulvovaginal candidiasis. A prescription for oral fluconazole is entered. Which action should the nurse take?`,clue:`A familiar drug for nonpregnant patients may be inappropriate during pregnancy. Clarify rather than administering or independently substituting medication.`,rationale:`A familiar drug for nonpregnant patients may be inappropriate during pregnancy. Clarify rather than administering or independently substituting medication.`,options:[{id:`o0`,text:`Administer the oral dose because topical medications are contraindicated in pregnancy.`,correct:!1,reason:`This reverses the pregnancy-specific recommendation.`},{id:`o1`,text:`Withhold all treatment until birth because every antifungal harms the fetus.`,correct:!1,reason:`Appropriate topical treatment is available during pregnancy.`},{id:`o2`,text:`Clarify the prescription and discuss the recommended seven-day topical azole treatment during pregnancy.`,correct:!0,reason:`Pregnancy guidance recommends topical azoles for seven days and advises against oral fluconazole.`},{id:`o3`,text:`Substitute oral metronidazole without contacting the prescriber.`,correct:!1,reason:`Metronidazole does not treat candidiasis, and the nurse should not independently substitute a prescription.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Candidiasis.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related candidiasis content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`},{label:`CDC · Candidiasis`,url:`https://www.cdc.gov/std/treatment-guidelines/candidiasis.htm`}],origin:`Original PDF question 53`},{id:`q54`,topic:`GYN`,area:`gyn_fertility`,difficulty:2,kind:`MC`,skills:[`Teaching`,`Assessment`,`Care management`],stem:`A patient collecting a semen specimen reports that the first portion was spilled and asks whether to add tap water to restore the expected volume. What is the best nursing response?`,clue:`Accurate diagnostic results depend on collection quality. Follow the laboratory's instructions for abstinence, collection, transport, and any repeat sample.`,rationale:`Accurate diagnostic results depend on collection quality. Follow the laboratory's instructions for abstinence, collection, transport, and any repeat sample.`,options:[{id:`o0`,text:`Add enough tap water to reach the mark on the container.`,correct:!1,reason:`Dilution invalidates concentration and motility assessment.`},{id:`o1`,text:`Do not add anything; report the lost portion to the laboratory and follow its recollection instructions.`,correct:!0,reason:`Incomplete collection can alter results, especially if the sperm-rich initial fraction was lost.`},{id:`o2`,text:`Submit it without mentioning the loss because only the color is important.`,correct:!1,reason:`Volume, concentration, and motility are clinically relevant; collection errors must be reported.`},{id:`o3`,text:`Use an ordinary lubricated condom to collect more semen into the same container.`,correct:!1,reason:`Unapproved lubricants or condoms can interfere with sperm testing and do not correct the original collection error.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Semen analysis.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related semen analysis content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 54`},{id:`q55`,topic:`GYN`,area:`gyn_fertility`,difficulty:2,kind:`MC`,skills:[`Teaching`,`Assessment`,`Care management`],stem:`A patient trying to conceive shows a chart with a sustained small rise in basal temperature after midcycle. The patient says, "I wait for three high readings before starting intercourse because that predicts ovulation is about to happen." Which response is best?`,clue:`Correct the timing misconception without blame. Fertility assessment and counseling may involve both partners and additional methods beyond temperature charting.`,rationale:`Correct the timing misconception without blame. Fertility assessment and counseling may involve both partners and additional methods beyond temperature charting.`,options:[{id:`o0`,text:`"Your chart proves that infertility is caused by your partner."`,correct:!1,reason:`A temperature chart does not establish the cause of infertility.`},{id:`o1`,text:`"The sustained rise usually reflects ovulation that has already occurred; let's review ways to identify the fertile window earlier."`,correct:!0,reason:`Progesterone-related temperature rise is mainly retrospective, so waiting for it can miss the most fertile days.`},{id:`o2`,text:`"Temperature should be measured after exercise to make the ovulation rise easier to see."`,correct:!1,reason:`Basal measurements require consistent conditions before activity; exercise confounds the result.`},{id:`o3`,text:`"Three high readings guarantee that fertilization has occurred."`,correct:!1,reason:`A postovulatory temperature rise does not diagnose pregnancy.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Ovulation detection.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related ovulation detection content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 55`},{id:`q56`,topic:`GYN`,area:`gyn_assessment`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Teaching`],stem:`A 58-year-old patient who has had no menstrual periods for four years reports new vaginal spotting. A cervical screening result last year was normal. Which response is most appropriate?`,clue:`Distinguish screening in an asymptomatic person from diagnostic evaluation of a new symptom. The new bleeding changes the priority.`,rationale:`Distinguish screening in an asymptomatic person from diagnostic evaluation of a new symptom. The new bleeding changes the priority.`,options:[{id:`o0`,text:`Arrange prompt diagnostic evaluation of the bleeding even though the previous screening was normal.`,correct:!0,reason:`Postmenopausal bleeding warrants evaluation; cervical screening does not rule out every cause, including endometrial disease.`},{id:`o1`,text:`Reassure the patient that normal cervical screening excludes gynecologic cancer.`,correct:!1,reason:`Screening has a specific purpose and cannot exclude all sources of bleeding.`},{id:`o2`,text:`Advise waiting until bleeding becomes heavy enough to cause dizziness.`,correct:!1,reason:`Investigation should not be delayed until major blood loss occurs.`},{id:`o3`,text:`Recommend doubling any hormone dose to stop the bleeding before assessment.`,correct:!1,reason:`Unassessed bleeding should not be treated with an unprescribed dose change.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Abnormal uterine bleeding.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related abnormal uterine bleeding content (supplement).`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — relevant section.`}],origin:`Original PDF question 56`},{id:`q57`,topic:`GYN`,area:`gyn_assessment`,difficulty:2,kind:`MC`,skills:[`Therapeutic communication`,`Safety`,`Care management`],stem:`During a pelvic examination, a patient becomes tearful, closes the legs, and says, "Stop." The patient signed consent earlier. What should the nurse do first?`,clue:`Patient control and safety are essential to trauma-informed care. After stopping, offer choices, explain next steps, and obtain permission before proceeding.`,rationale:`Patient control and safety are essential to trauma-informed care. After stopping, offer choices, explain next steps, and obtain permission before proceeding.`,options:[{id:`o0`,text:`Ask the clinician to finish while the nurse uses distraction.`,correct:!1,reason:`Distraction is not a substitute for respecting withdrawal of consent.`},{id:`o1`,text:`Help stop the examination, provide privacy, and ask what the patient needs before discussing whether to continue.`,correct:!0,reason:`Consent is ongoing; the patient's request to stop must be respected.`},{id:`o2`,text:`Hold the patient's knees apart so the procedure can finish quickly.`,correct:!1,reason:`Restraint in this situation violates autonomy and can worsen trauma.`},{id:`o3`,text:`Remind the patient that the signed form requires completion of the examination.`,correct:!1,reason:`A signed form does not remove the right to withdraw consent.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Pelvic examination.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related pelvic examination content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 57`},{id:`q58`,topic:`GYN`,area:`gyn_assessment`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`],stem:`A patient previously treated for primary dysmenorrhea now reports progressively worse pain between periods, deep pain with intercourse, and difficulty conceiving. Which action is most appropriate?`,clue:`Reassess the diagnosis when the symptom pattern changes. Chronic pain deserves evaluation rather than dismissal or unsafe medication escalation.`,rationale:`Reassess the diagnosis when the symptom pattern changes. Chronic pain deserves evaluation rather than dismissal or unsafe medication escalation.`,options:[{id:`o0`,text:`Explain that pain outside menstruation proves the original treatment is working.`,correct:!1,reason:`Persistent noncyclic pain does not indicate therapeutic success.`},{id:`o1`,text:`Reassure the patient that infertility is unrelated to pelvic conditions.`,correct:!1,reason:`Conditions such as endometriosis or prior pelvic infection can affect fertility.`},{id:`o2`,text:`Advise taking multiple NSAID products together indefinitely.`,correct:!1,reason:`This increases adverse-effect risk without evaluating the cause.`},{id:`o3`,text:`Refer for evaluation of a secondary cause such as endometriosis rather than simply escalating self-treatment.`,correct:!0,reason:`The changed pattern and infertility suggest a cause beyond uncomplicated primary dysmenorrhea.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Dysmenorrhea.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related dysmenorrhea content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 58`},{id:`q59`,topic:`GYN`,area:`gyn_fertility`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A patient receiving injectable ovarian-stimulation medications reports rapid weight gain over two days, marked abdominal distention, decreased urine output, and new shortness of breath. What should the nurse advise?`,clue:`Recognize an adverse treatment response rather than labeling every symptom as an expected fertility-treatment effect. Breathing changes increase urgency.`,rationale:`Recognize an adverse treatment response rather than labeling every symptom as an expected fertility-treatment effect. Breathing changes increase urgency.`,options:[{id:`o0`,text:`Restrict all oral fluids without medical assessment.`,correct:!1,reason:`Fluid management requires evaluation; self-imposed complete restriction can worsen perfusion.`},{id:`o1`,text:`Obtain urgent evaluation for ovarian hyperstimulation and fluid-shift complications.`,correct:!0,reason:`These findings suggest a potentially serious treatment complication affecting perfusion and breathing.`},{id:`o2`,text:`Continue the next injection and report symptoms at the scheduled visit next week.`,correct:!1,reason:`Additional stimulation and delayed evaluation may worsen the condition.`},{id:`o3`,text:`Treat the symptoms as proof of a normal early pregnancy.`,correct:!1,reason:`The acute systemic findings are not a safe basis for routine reassurance.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Ovarian hyperstimulation.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related ovarian hyperstimulation content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — relevant section.`},{label:`ASRM · Ovarian hyperstimulation syndrome guideline`,url:`https://www.asrm.org/practice-guidance/practice-committee-documents/prevention-of-moderate-and-severe-ovarian-hyperstimulation-syndrome-a-guideline-2023/`}],origin:`Original PDF question 59`},{id:`q60`,topic:`GYN`,area:`gyn_contraception`,difficulty:2,kind:`SATA`,skills:[`Teaching`,`Safety`,`Care management`],stem:`A patient chooses a levonorgestrel IUD and wants to reduce STI risk. Which statements show accurate understanding of the combined prevention plan? Select all that apply.`,clue:`Pregnancy prevention and STI prevention are distinct goals. Teach effective combination use without claiming complete protection.`,rationale:`Pregnancy prevention and STI prevention are distinct goals. Teach effective combination use without claiming complete protection.`,options:[{id:`o0`,text:`"I should use an internal condom and an external condom at the same time."`,correct:!1,reason:`Using both together can increase friction and failure.`},{id:`o1`,text:`"Condoms completely eliminate transmission from all uncovered genital skin."`,correct:!1,reason:`Condoms reduce risk but do not cover every area involved in infections such as HSV or HPV.`},{id:`o2`,text:`"Once the IUD is in place, new partners do not change my need for STI assessment."`,correct:!1,reason:`STI risk depends on exposure and behavior, not the presence of an IUD.`},{id:`o3`,text:`"I should seek evaluation for new pelvic pain with fever or abnormal discharge."`,correct:!0,reason:`These findings need assessment for infection or another complication.`},{id:`o4`,text:`"The IUD prevents pregnancy, but condoms are still important for STI risk reduction."`,correct:!0,reason:`An IUD does not protect against STIs.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Contraception IUD.`},{label:`Week 6 Contraception & Abortion lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related contraception iud content (supplement).`},{label:`ATI RN Maternal Newborn Nursing, edition 11 — relevant section.`}],origin:`Original PDF question 60`},{id:`q61`,topic:`Growth`,area:`growth_safety`,difficulty:3,kind:`MC`,skills:[`Care management`,`Safety`,`Priority`],stem:`A child weighs 44 lb. An order reads 30 mg/kg/day of an antibiotic divided into three equal doses. A colleague calculates 600 mg per dose using a weight of 20 kg. Which action should the nurse take before administration?`,clue:`A correct weight conversion does not guarantee a correct dose. Distinguish mg/kg/day from mg/kg/dose, then verify the safe range and available concentration before administration.`,rationale:`A correct weight conversion does not guarantee a correct dose. Distinguish mg/kg/day from mg/kg/dose, then verify the safe range and available concentration before administration.`,options:[{id:`o0`,text:`Administer 1,320 mg because pounds should be used without conversion.`,correct:!1,reason:`The order is weight-based in kilograms, not pounds.`},{id:`o1`,text:`Hold the incorrect dose and clarify that the calculated dose is 200 mg.`,correct:!0,reason:`44/2.2 = 20 kg; 30 x 20 = 600 mg per day; 600/3 = 200 mg per dose.`},{id:`o2`,text:`Administer 66 mg because the daily amount should be divided by both 3 and 3 again.`,correct:!1,reason:`Dividing twice incorrectly reduces the dose.`},{id:`o3`,text:`Administer 600 mg because the weight conversion is correct.`,correct:!1,reason:`The weight is correct, but the daily dose was not divided into three doses.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Medication calculation.`},{label:`ATI RN Nursing Care of Children, edition 11 — related medication calculation content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 61`},{id:`q62`,topic:`Growth`,area:`growth_infant`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`At a well-child visit, which report requires the most prompt developmental follow-up?`,clue:`Regression is more concerning than failure to perform a skill expected at an older age. Assess the whole developmental pattern rather than one rigid cutoff.`,rationale:`Regression is more concerning than failure to perform a skill expected at an older age. Assess the whole developmental pattern rather than one rigid cutoff.`,options:[{id:`o0`,text:`A 10-month-old who previously sat independently now repeatedly falls over and no longer reaches for toys.`,correct:!0,reason:`Loss of previously acquired skills is a concerning change requiring assessment.`},{id:`o1`,text:`An 18-month-old who needs a hand held while using stairs.`,correct:!1,reason:`Assisted stair use is compatible with this developmental period.`},{id:`o2`,text:`A 12-month-old who plays beside another child instead of sharing a cooperative game.`,correct:!1,reason:`Mature cooperative play is not expected at this age.`},{id:`o3`,text:`A 10-month-old who pulls to stand but does not walk independently.`,correct:!1,reason:`Independent walking is not expected of every 10-month-old.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Developmental surveillance.`},{label:`ATI RN Nursing Care of Children, edition 11 — related developmental surveillance content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 62`},{id:`q63`,topic:`Growth`,area:`growth_infant`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Care management`,`Safety`],stem:`The nurse selects activities for an alert 12-month-old admitted for observation. Which choices are developmentally appropriate and safe with supervision? Select all that apply.`,clue:`Match both the developmental task and the safety features. A toy can be intellectually interesting yet unsafe because of its parts or attachment.`,rationale:`Match both the developmental task and the safety features. A toy can be intellectually interesting yet unsafe because of its parts or attachment.`,options:[{id:`o0`,text:`A peekaboo game using a familiar caregiver's face.`,correct:!0,reason:`This supports object permanence and familiar social interaction.`},{id:`o1`,text:`Large washable blocks that cannot fit into the child's mouth.`,correct:!0,reason:`Large blocks support manipulation and purposeful play without small-part choking risk.`},{id:`o2`,text:`A sorting game with loose button batteries used as counters.`,correct:!1,reason:`Button batteries can cause catastrophic injury if swallowed.`},{id:`o3`,text:`A sturdy board book shared with a caregiver.`,correct:!0,reason:`Books support language, interaction, and exploration at this age.`},{id:`o4`,text:`Large nesting cups without detachable small parts.`,correct:!0,reason:`Cups permit safe grasping, placing, and removing objects.`},{id:`o5`,text:`A toy with a long cord tied around the crib rail for easy access.`,correct:!1,reason:`Long accessible cords create strangulation risk.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Infant play.`},{label:`ATI RN Nursing Care of Children, edition 11 — related infant play content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 63`},{id:`q64`,topic:`Growth`,area:`growth_infant`,difficulty:2,kind:`MC`,skills:[`Care management`,`Safety`],stem:`A hospitalized 10-month-old cries intensely when the caregiver leaves. The caregiver must go home briefly and asks how to reduce distress. Which plan is best?`,clue:`Separation anxiety is developmentally expected. The nursing response should support attachment and predictable care rather than punish distress.`,rationale:`Separation anxiety is developmentally expected. The nursing response should support attachment and predictable care rather than punish distress.`,options:[{id:`o0`,text:`Discourage the caregiver from returning until the infant stops crying.`,correct:!1,reason:`Withholding contact is not an appropriate response to normal separation distress.`},{id:`o1`,text:`Use a predictable, brief goodbye and maintain consistent comforting care and familiar routines while the caregiver is away.`,correct:!0,reason:`Predictability and responsive care support trust during separation anxiety.`},{id:`o2`,text:`Have the caregiver leave secretly whenever the infant looks away.`,correct:!1,reason:`Unexplained disappearance can undermine predictability and does not teach security.`},{id:`o3`,text:`Place the infant alone and avoid comforting to prevent dependence.`,correct:!1,reason:`Responsive comfort is appropriate in infancy and supports trust.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Separation anxiety.`},{label:`ATI RN Nursing Care of Children, edition 11 — related separation anxiety content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 64`},{id:`q65`,topic:`Growth`,area:`growth_toddler`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Safety`],stem:`A 2-year-old requires an oral medication and becomes upset whenever the nurse enters. Which approaches support cooperation and safe care? Select all that apply.`,clue:`Support autonomy within safe limits. Honest explanations, limited choices, and an accurate dose are more useful than coercion or deception.`,rationale:`Support autonomy within safe limits. Honest explanations, limited choices, and an accurate dose are more useful than coercion or deception.`,options:[{id:`o0`,text:`Explain in simple words immediately before administration and allow comforting caregiver participation.`,correct:!0,reason:`Toddlers respond to concrete, immediate explanations and familiar support.`},{id:`o1`,text:`Ask, "Do you want your medicine?" when refusing is not an available option.`,correct:!1,reason:`This offers a false choice and increases conflict.`},{id:`o2`,text:`Describe the medicine as candy so the child accepts it.`,correct:!1,reason:`Calling medication candy creates poisoning risk and undermines honest teaching.`},{id:`o3`,text:`Mix the dose into a full bottle and assume the entire dose was taken.`,correct:!1,reason:`Incomplete intake makes the delivered dose uncertain.`},{id:`o4`,text:`Offer two acceptable choices, such as taking the medicine with the caregiver or with the nurse.`,correct:!0,reason:`Limited real choices support autonomy without making necessary treatment optional.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Toddler care.`},{label:`ATI RN Nursing Care of Children, edition 11 — related toddler care content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 65`},{id:`q66`,topic:`Growth`,area:`growth_preschool`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`],stem:`A 4-year-old awaiting a procedure says, "My arm got hurt because I was mean to my brother." Which nursing response is best?`,clue:`Address the child's actual belief. Developmentally appropriate preparation includes reassurance about causation and concrete demonstration.`,rationale:`Address the child's actual belief. Developmentally appropriate preparation includes reassurance about causation and concrete demonstration.`,options:[{id:`o0`,text:`Explain that the injury was not punishment and use a doll to show what will happen during care.`,correct:!0,reason:`Preschool magical thinking can link illness to behavior; concrete play helps correct the misconception.`},{id:`o1`,text:`Confirm that better behavior will make the arm heal faster.`,correct:!1,reason:`This reinforces guilt and an inaccurate cause of illness.`},{id:`o2`,text:`Provide a detailed discussion of cellular inflammation and ask for a written summary.`,correct:!1,reason:`This is not matched to preschool cognitive abilities.`},{id:`o3`,text:`Avoid discussing the procedure because preschoolers cannot understand any explanation.`,correct:!1,reason:`Simple truthful preparation and play can reduce fear.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Preschool thinking.`},{label:`ATI RN Nursing Care of Children, edition 11 — related preschool thinking content (supplement).`},{label:`ATI RN Nursing Care of Children, edition 11 — relevant section.`}],origin:`Original PDF question 66`},{id:`q67`,topic:`Growth`,area:`growth_school`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`],stem:`A hospitalized 10-year-old says, "Everyone else can do things. I am bad at everything now." Which care plan best supports the child's developmental needs?`,clue:`School-age children benefit from meaningful participation and achievable success, n
