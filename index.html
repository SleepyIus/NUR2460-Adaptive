p should come first?`,options:[{id:`o0`,text:`Assess the possibility of pregnancy before pursuing other causes or treatment.`,correct:!0,reason:`Pregnancy is a common cause of secondary amenorrhea and changes management.`},{id:`o1`,text:`Begin hormone treatment without obtaining a history.`,correct:!1,reason:`Treatment may be inappropriate before excluding pregnancy and other causes.`},{id:`o2`,text:`Diagnose menopause solely from the missed periods.`,correct:!1,reason:`Two missed periods do not establish that diagnosis.`},{id:`o3`,text:`Recommend weight loss regardless of nutrition and exercise history.`,correct:!1,reason:`Unfocused weight advice may be harmful and does not evaluate the cause.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Secondary amenorrhea.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 2.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related secondary amenorrhea content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A potentially pregnant patient requests treatment before the cause is assessed.`,rationale:`Start with a relevant history and pregnancy evaluation, then investigate endocrine, nutritional, medication, and other causes as indicated.`},{id:`e289`,topic:`GYN`,area:`gyn_assessment`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Teaching`,`Safety`],stem:`A patient using menopausal hormone therapy reports new unexplained vaginal bleeding. Which response is best?`,options:[{id:`o0`,text:`Arrange clinical evaluation rather than assuming all bleeding is a harmless hormone effect.`,correct:!0,reason:`New unexplained bleeding warrants assessment for treatment effects and underlying disease.`},{id:`o1`,text:`Double the estrogen dose until bleeding stops.`,correct:!1,reason:`The nurse should not adjust therapy without evaluation and an order.`},{id:`o2`,text:`Recommend waiting a year before reporting the symptom.`,correct:!1,reason:`This can delay recognition of significant pathology.`},{id:`o3`,text:`Explain that hormone therapy eliminates endometrial disease risk.`,correct:!1,reason:`Hormone use does not make unexplained bleeding irrelevant.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Menopausal symptoms and bleeding.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related menopausal symptoms and bleeding content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A new symptom requires assessment despite a possible medication explanation.`,rationale:`Avoid premature reassurance. Report the pattern, amount, associated symptoms, and treatment history for evaluation.`},{id:`e290`,topic:`GYN`,area:`gyn_assessment`,difficulty:2,kind:`MC`,skills:[`Pharmacology`,`Safety`,`Teaching`],stem:`A patient with an intact uterus asks why a progestogen is included with prescribed systemic estrogen therapy. Which explanation is best?`,options:[{id:`o0`,text:`It helps protect the endometrium from the effects of unopposed systemic estrogen.`,correct:!0,reason:`Endometrial protection is an important reason for combined therapy when the uterus is present.`},{id:`o1`,text:`It guarantees protection from breast cancer.`,correct:!1,reason:`Combined therapy does not provide that guarantee and has its own risks.`},{id:`o2`,text:`It permanently stops all cardiovascular risk.`,correct:!1,reason:`Risk assessment remains individualized.`},{id:`o3`,text:`It makes all future vaginal bleeding safe to ignore.`,correct:!1,reason:`New or unexplained bleeding still needs evaluation.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Menopause hormone therapy.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related menopause hormone therapy content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The patient has a uterus and is receiving systemic estrogen.`,rationale:`Relate the medication purpose to anatomy while preserving realistic risk and monitoring expectations.`},{id:`e291`,topic:`GYN`,area:`gyn_assessment`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Safety`],stem:`A patient with a known ovarian cyst develops sudden severe unilateral pelvic pain with nausea and vomiting. Which response is most appropriate?`,options:[{id:`o0`,text:`Arrange urgent evaluation for torsion, rupture, or another acute pelvic cause.`,correct:!0,reason:`Sudden severe unilateral pain can threaten ovarian perfusion or indicate bleeding.`},{id:`o1`,text:`Recommend only the patient's usual menstrual heat pack until next week.`,correct:!1,reason:`A new acute pattern requires assessment.`},{id:`o2`,text:`Diagnose uncomplicated PMS because the patient menstruates.`,correct:!1,reason:`The severity and sudden unilateral onset are not explained safely by that assumption.`},{id:`o3`,text:`Reassure that a previous benign cyst means no emergency can occur.`,correct:!1,reason:`Benign pathology can still cause acute complications.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Ovarian cyst complications.`},{label:`Week 6 GYN, STIs, and Infertility lecture — related topic.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related ovarian cyst complications content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A known condition now has a new, abrupt, severe symptom pattern.`,rationale:`Recognize the change in urgency and facilitate prompt evaluation instead of relying on the prior label.`},{id:`e292`,topic:`GYN`,area:`gyn_fertility`,difficulty:2,kind:`MC`,skills:[`Therapeutic communication`,`Care management`],stem:`After another unsuccessful fertility treatment, a patient says, "My body keeps failing us." Which response is most therapeutic?`,options:[{id:`o0`,text:`"This has been painful. What part of this experience feels hardest right now?"`,correct:!0,reason:`This acknowledges distress and invites the patient's perspective.`},{id:`o1`,text:`"You just need to relax and it will happen."`,correct:!1,reason:`This assigns blame and promises an unsupported outcome.`},{id:`o2`,text:`"At least you can try adoption."`,correct:!1,reason:`Redirecting immediately may minimize the current loss and bypass the patient's preferences.`},{id:`o3`,text:`"Your partner must be disappointed in you."`,correct:!1,reason:`This assumes another person's feelings and reinforces self-blame.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Infertility psychosocial care.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 27–32.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related infertility psychosocial care content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The patient is expressing grief and self-blame rather than requesting a new treatment schedule.`,rationale:`Attend to emotional needs before offering solutions. Explore support and counseling when the patient is ready.`},{id:`e293`,topic:`GYN`,area:`gyn_fertility`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Teaching`],stem:`A couple has been trying to conceive and the patient asks why the partner needs testing when menstrual cycles seem irregular. Which explanation is best?`,options:[{id:`o0`,text:`Both partners can contribute to infertility, so evaluation may proceed for both rather than assuming a single cause.`,correct:!0,reason:`A comprehensive assessment avoids delay and unsupported attribution.`},{id:`o1`,text:`An irregular cycle proves the partner's fertility is normal.`,correct:!1,reason:`One person's findings do not determine the other's reproductive function.`},{id:`o2`,text:`Semen testing is punishment for not conceiving.`,correct:!1,reason:`Testing identifies potential contributing factors, not fault.`},{id:`o3`,text:`Male factors are impossible if the partner has fathered a child before.`,correct:!1,reason:`Prior fertility does not exclude a current problem.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Semen analysis.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 28–30.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related semen analysis content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`An identified possible factor does not exclude additional factors.`,rationale:`Frame assessment as a shared clinical process, not an assignment of blame.`},{id:`e294`,topic:`GYN`,area:`gyn_fertility`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Safety`,`Care management`],stem:`A patient scheduled for hysterosalpingography reports fever and new purulent vaginal discharge on arrival. Which action is best?`,options:[{id:`o0`,text:`Notify the clinician and clarify whether the procedure should be deferred for infection evaluation.`,correct:!0,reason:`Possible active pelvic infection changes the safety of uterine/tubal instrumentation.`},{id:`o1`,text:`Proceed because the appointment was scheduled before symptoms began.`,correct:!1,reason:`A prior plan must be reconsidered when new findings emerge.`},{id:`o2`,text:`Give a sedative and avoid mentioning the symptoms until afterward.`,correct:!1,reason:`Sedation does not treat the infection risk.`},{id:`o3`,text:`Explain that discharge confirms normal tubal patency.`,correct:!1,reason:`Symptoms cannot establish that finding.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Infertility diagnostic procedures.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 29.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related infertility diagnostic procedures content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Possible infection is present before an invasive diagnostic procedure.`,rationale:`Use the preprocedure assessment to prevent harm and coordinate evaluation before proceeding.`},{id:`e295`,topic:`GYN`,area:`gyn_fertility`,difficulty:3,kind:`MC`,skills:[`Pharmacology`,`Assessment`,`Safety`],stem:`A patient taking prescribed clomiphene reports new blurred vision and flashes of light. What is the safest response?`,options:[{id:`o0`,text:`Advise withholding further doses pending prompt prescriber evaluation of the visual symptoms.`,correct:!0,reason:`Visual disturbance is an important adverse effect that requires assessment.`},{id:`o1`,text:`Encourage driving to work to see whether symptoms clear with activity.`,correct:!1,reason:`Visual disturbance creates an immediate safety risk.`},{id:`o2`,text:`Explain that blurred vision proves ovulation occurred.`,correct:!1,reason:`It is not a safe measure of treatment success.`},{id:`o3`,text:`Recommend doubling the next dose to shorten treatment.`,correct:!1,reason:`Increasing exposure can worsen adverse effects and is not authorized.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Ovulation-induction therapy.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 32.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related ovulation-induction therapy content (supplement).`},{label:`DailyMed · Clomiphene prescribing information, visual adverse effects`,url:`https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=79f64995-7425-44c6-9f44-f7d20daeff65`}],origin:`Original expanded-bank scenario`,clue:`New visual symptoms occur during ovulation-induction medication use.`,rationale:`Do not dismiss a potentially serious medication effect as a sign of successful therapy. Coordinate prompt assessment and avoid unsafe activities.`},{id:`e296`,topic:`GYN`,area:`gyn_breast`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A patient reports a persistent new breast lump despite a screening mammogram described as normal six months ago. What should the nurse recommend?`,options:[{id:`o0`,text:`Arrange diagnostic evaluation of the new finding.`,correct:!0,reason:`A prior normal screening study does not rule out a subsequently noticed abnormality.`},{id:`o1`,text:`Wait until the next routine screening interval before reporting it.`,correct:!1,reason:`New symptoms require evaluation outside routine screening intervals.`},{id:`o2`,text:`Assume the lump is benign because it is painless.`,correct:!1,reason:`Lack of pain does not exclude malignancy.`},{id:`o3`,text:`Diagnose cancer immediately without examination or testing.`,correct:!1,reason:`A lump needs assessment; the nurse should not declare an unsupported diagnosis.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Breast cancer assessment.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 11.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related breast cancer assessment content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Screening history does not negate a new persistent symptom.`,rationale:`Distinguish routine screening from diagnostic evaluation and support timely follow-up without premature certainty.`},{id:`e297`,topic:`GYN`,area:`gyn_breast`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Teaching`,`Safety`],stem:`After axillary lymph-node surgery, which teaching supports safe recovery? Select all that apply.`,options:[{id:`o0`,text:`Report new arm swelling, redness, warmth, or fever.`,correct:!0,reason:`These may indicate lymphatic complications or infection.`},{id:`o1`,text:`Follow the prescribed gradual movement and exercise plan.`,correct:!0,reason:`Appropriate movement supports function without ignoring surgical restrictions.`},{id:`o2`,text:`Protect the skin and seek guidance for cuts or signs of infection.`,correct:!0,reason:`Skin care reduces avoidable complications.`},{id:`o3`,text:`Keep the affected arm completely immobile for life.`,correct:!1,reason:`Permanent immobility is not an appropriate routine recovery plan.`},{id:`o4`,text:`Ignore increasing swelling if the incision has closed.`,correct:!1,reason:`Wound closure does not exclude lymphatic problems.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Breast surgery and lymphatic care.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 11–13.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related breast surgery and lymphatic care content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The surgery creates ongoing functional and lymphatic care needs.`,rationale:`Teach monitoring and rehabilitation without rigid unsupported prohibitions or minimizing new symptoms.`},{id:`e298`,topic:`GYN`,area:`gyn_breast`,difficulty:2,kind:`MC`,skills:[`Therapeutic communication`,`Care management`,`Teaching`],stem:`Before mastectomy, a patient says, "Everyone assumes I want reconstruction, but I am not sure." Which response is best?`,options:[{id:`o0`,text:`Offer information about the options and ask what matters most to the patient without pressing for a particular choice.`,correct:!0,reason:`The decision should reflect informed personal goals and preferences.`},{id:`o1`,text:`Tell the patient reconstruction is necessary to feel normal again.`,correct:!1,reason:`This imposes a value judgment and unsupported psychological outcome.`},{id:`o2`,text:`Ask the partner to select the final surgical plan.`,correct:!1,reason:`The patient's informed preferences remain central.`},{id:`o3`,text:`Avoid the topic because uncertainty means the patient is not coping.`,correct:!1,reason:`Uncertainty is a reason for supportive discussion, not withdrawal of care.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Breast reconstruction decisions.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 11–13.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related breast reconstruction decisions content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The patient needs space for an informed preference, not a predetermined answer.`,rationale:`Support autonomy and realistic information while coordinating questions for the surgical team.`},{id:`e299`,topic:`GYN`,area:`gyn_assessment`,difficulty:2,kind:`MC`,skills:[`Pharmacology`,`Assessment`,`Safety`],stem:`A patient self-treating menstrual cramps with frequent ibuprofen reports black, tarry stools and lightheadedness. What is the priority response?`,options:[{id:`o0`,text:`Arrange prompt evaluation for possible gastrointestinal bleeding and review further NSAID use.`,correct:!0,reason:`Tarry stools and systemic symptoms are concerning medication-associated findings.`},{id:`o1`,text:`Advise taking more ibuprofen because cramping is ongoing.`,correct:!1,reason:`Additional NSAID exposure may worsen bleeding.`},{id:`o2`,text:`Explain that tarry stools are an expected harmless effect of all pain medicines.`,correct:!1,reason:`This is not safe reassurance.`},{id:`o3`,text:`Focus only on a heating-pad technique at the next visit.`,correct:!1,reason:`Comfort teaching cannot replace current safety assessment.`}],refs:[{label:`Week 6 Exam 2 GYN, Infertility and STI Instructor Notes — Dysmenorrhea therapy.`},{label:`Week 6 GYN, STIs, and Infertility lecture — slide(s) 3.`},{label:`Maternal Child Nursing Care, seventh edition, 2022 — related dysmenorrhea therapy content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Self-treatment is accompanied by possible bleeding and reduced perfusion.`,rationale:`Recognize complications of symptom management. Assess the medication history and escalate concerning bleeding signs.`},{id:`e300`,topic:`Growth`,area:`growth_safety`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`],stem:`A sleeping 8-month-old is due for a routine assessment. Which approach is most likely to obtain accurate respiratory data while minimizing distress?`,options:[{id:`o0`,text:`Observe respirations for a full minute before touching or waking the infant.`,correct:!0,reason:`Observation during quiet breathing reduces distortion from crying and captures irregularity.`},{id:`o1`,text:`Begin with the throat examination to finish the most stressful task first.`,correct:!1,reason:`Distress can alter subsequent respiratory and cardiac findings.`},{id:`o2`,text:`Count chest movement for five seconds and assume the pattern is regular.`,correct:!1,reason:`Very brief counts can miss irregular breathing.`},{id:`o3`,text:`Wake the infant and wait for vigorous crying before counting.`,correct:!1,reason:`Crying changes the resting respiratory pattern.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Pediatric assessment sequence.`},{label:`ATI RN Nursing Care of Children, edition 11 — related pediatric assessment sequence content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A calm infant provides an opportunity for less intrusive assessment first.`,rationale:`Adapt assessment order to developmental needs rather than automatically following an adult head-to-toe sequence.`},{id:`e301`,topic:`Growth`,area:`growth_safety`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`],stem:`A postoperative 2-year-old cannot use a numeric scale reliably. The child grimaces, guards the incision, and is difficult to console. What should the nurse do?`,options:[{id:`o0`,text:`Use an appropriate behavioral pain tool, provide ordered relief, and reassess the response.`,correct:!0,reason:`Behavior and context support structured pain assessment when numeric self-report is unreliable.`},{id:`o1`,text:`Record zero pain because the child cannot provide a number.`,correct:!1,reason:`Inability to quantify pain does not mean absence of pain.`},{id:`o2`,text:`Delay analgesia until the child understands a ten-point scale.`,correct:!1,reason:`Developmental limitations should not prevent treatment.`},{id:`o3`,text:`Treat the behavior only as disobedience.`,correct:!1,reason:`This dismisses plausible pain after surgery.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Pain assessment in children.`},{label:`ATI RN Nursing Care of Children, edition 11 — related pain assessment in children content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The assessment tool must match the child's communication ability.`,rationale:`Use developmentally appropriate assessment and evaluate treatment effectiveness with a consistent method.`},{id:`e302`,topic:`Growth`,area:`growth_infant`,difficulty:1,kind:`MC`,skills:[`Care management`,`Safety`],stem:`A parent asks whether responding to a young infant's hunger and distress will "spoil" the infant. Which response is most appropriate?`,options:[{id:`o0`,text:`Consistent, responsive care helps the infant develop trust and a sense of safety.`,correct:!0,reason:`Meeting basic needs supports early psychosocial development.`},{id:`o1`,text:`Withhold feeding until the infant stops signaling hunger.`,correct:!1,reason:`Ignoring basic needs does not teach appropriate infant independence.`},{id:`o2`,text:`Use punishment to reduce crying.`,correct:!1,reason:`Punishment is inappropriate for infant distress communication.`},{id:`o3`,text:`Avoid holding the infant during illness.`,correct:!1,reason:`Comfort and responsive care remain important during illness.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Trust versus mistrust.`},{label:`ATI RN Nursing Care of Children, edition 11 — related trust versus mistrust content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The infant depends on caregivers to meet basic needs.`,rationale:`Frame crying as communication and support responsive care, while helping caregivers obtain rest and practical assistance.`},{id:`e303`,topic:`Growth`,area:`growth_infant`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`An infant's weight has crossed downward through several growth-chart percentile lines over two visits. The caregiver reports prolonged feeds and fatigue. What is the best next step?`,options:[{id:`o0`,text:`Assess feeding effectiveness and health status and coordinate evaluation of the growth trend.`,correct:!0,reason:`Declining trajectory and feeding fatigue warrant assessment for intake and medical causes.`},{id:`o1`,text:`Reassure based solely on the infant still being above the fifth percentile.`,correct:!1,reason:`The trend can be concerning before reaching a single cutoff.`},{id:`o2`,text:`Recommend a concentrated formula recipe without checking the prescribed preparation.`,correct:!1,reason:`Incorrect concentration can cause fluid and electrolyte harm.`},{id:`o3`,text:`Diagnose neglect without further assessment.`,correct:!1,reason:`Many feeding, medical, and access factors can contribute.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Growth trends and failure to thrive.`},{label:`ATI RN Nursing Care of Children, edition 11 — related growth trends and failure to thrive content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Trajectory and feeding function matter more than one isolated percentile.`,rationale:`Use serial measurements with a nonjudgmental feeding history and clinical assessment to guide support and referral.`},{id:`e304`,topic:`Growth`,area:`growth_infant`,difficulty:2,kind:`SATA`,skills:[`Safety`,`Care management`],stem:`Which home sleep plans for a 3-month-old should the nurse reinforce? Select all that apply.`,options:[{id:`o0`,text:`Place the infant on the back for sleep.`,correct:!0,reason:`Supine placement is the recommended initial sleep position.`},{id:`o1`,text:`Use a firm, flat, noninclined approved sleep surface with a fitted sheet.`,correct:!0,reason:`This avoids soft surfaces and positional airway hazards.`},{id:`o2`,text:`Keep pillows, loose blankets, and stuffed toys out of the sleep space.`,correct:!0,reason:`These create suffocation hazards.`},{id:`o3`,text:`Use a wedge to hold the infant on the side after feeds.`,correct:!1,reason:`Inclined devices and side positioning are not routine safe-sleep solutions.`},{id:`o4`,text:`Sleep with the infant on a sofa if the caregiver is tired.`,correct:!1,reason:`Sofas are especially hazardous shared sleep surfaces.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Safe sleep.`},{label:`ATI RN Nursing Care of Children, edition 11 — related safe sleep content (supplement).`},{label:`AAP · Safe sleep for infants with reflux`,url:`https://www.healthychildren.org/English/tips-tools/ask-the-pediatrician/Pages/What-is-the-safest-sleep-solution-for-my-baby-with-reflux.aspx`}],origin:`Original expanded-bank scenario`,clue:`Comfort products can introduce hazards into an infant's sleep space.`,rationale:`Keep sleep recommendations simple and consistent, including for infants who spit up. Follow individualized medical instructions when a specific clinical exception exists.`},{id:`e305`,topic:`Growth`,area:`growth_toddler`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`],stem:`A caregiver wants to start toilet training, but the 18-month-old cannot communicate the need to void and rarely stays dry between diaper changes. Which advice is best?`,options:[{id:`o0`,text:`Watch for readiness cues and introduce a supportive routine without punishment.`,correct:!0,reason:`Readiness includes physiologic and communication skills, not age alone.`},{id:`o1`,text:`Require prolonged toilet sitting until the child produces urine.`,correct:!1,reason:`Coercive prolonged sitting can create distress and resistance.`},{id:`o2`,text:`Restrict fluids severely so the diaper stays dry.`,correct:!1,reason:`This creates dehydration risk and does not establish readiness.`},{id:`o3`,text:`Shame the child for each wet diaper.`,correct:!1,reason:`Shame undermines autonomy and does not teach continence.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Toilet-training readiness.`},{label:`ATI RN Nursing Care of Children, edition 11 — related toilet-training readiness content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The child is missing readiness cues despite the caregiver's goal.`,rationale:`Match expectations to development and support gradual learning rather than imposing an arbitrary deadline.`},{id:`e306`,topic:`Growth`,area:`growth_toddler`,difficulty:1,kind:`MC`,skills:[`Assessment`,`Care management`],stem:`Two hospitalized 2-year-olds sit beside each other using separate sets of blocks but rarely share a common game. What is the most appropriate interpretation?`,options:[{id:`o0`,text:`This can be developmentally expected parallel play.`,correct:!0,reason:`Toddlers commonly play alongside peers without organized cooperative goals.`},{id:`o1`,text:`This alone proves a social developmental disorder.`,correct:!1,reason:`A diagnosis cannot be based on an age-expected play pattern.`},{id:`o2`,text:`The nurse should require a competitive board game instead.`,correct:!1,reason:`Formal rules and competition are not the best match for this stage.`},{id:`o3`,text:`The children should be separated because all side-by-side play is harmful.`,correct:!1,reason:`Safe peer proximity can support normal play opportunities.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Parallel play.`},{label:`ATI RN Nursing Care of Children, edition 11 — related parallel play content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The children are toddlers engaged in similar but separate activities.`,rationale:`Recognize expected play and provide safe materials without forcing a more advanced social task.`},{id:`e307`,topic:`Growth`,area:`growth_toddler`,difficulty:2,kind:`MC`,skills:[`Safety`,`Care management`],stem:`A toddler screams and kicks when a caregiver sets a limit. No injury or medical distress is apparent. Which coaching is most appropriate?`,options:[{id:`o0`,text:`Maintain a calm, consistent limit, protect safety, and reconnect when the child settles.`,correct:!0,reason:`Consistent boundaries with safety support developing self-regulation.`},{id:`o1`,text:`Change the limit every time the child screams.`,correct:!1,reason:`Inconsistent reinforcement can increase the behavior.`},{id:`o2`,text:`Respond with a threat of abandonment.`,correct:!1,reason:`This undermines security and does not teach safe regulation.`},{id:`o3`,text:`Use physical restraint as routine punishment.`,correct:!1,reason:`Restrictive measures are not a routine behavioral teaching strategy.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Temper tantrums and autonomy.`},{label:`ATI RN Nursing Care of Children, edition 11 — related temper tantrums and autonomy content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`This is a limit-setting situation without evidence of acute illness.`,rationale:`Support autonomy through predictable limits and simple choices when possible, while avoiding shame or threats.`},{id:`e308`,topic:`Growth`,area:`growth_toddler`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Safety`,`Care management`],stem:`A caregiver reports that a healthy toddler eats small amounts at meals and wants snacks. Which guidance is appropriate? Select all that apply.`,options:[{id:`o0`,text:`Offer planned small meals and nutritious snacks.`,correct:!0,reason:`Small portions can fit toddler appetite and activity patterns.`},{id:`o1`,text:`Provide safe textures and supervise eating while the child is seated.`,correct:!0,reason:`Movement and hazardous food shapes increase choking risk.`},{id:`o2`,text:`Assess the overall diet and growth trend rather than one meal.`,correct:!0,reason:`Intake varies; longitudinal assessment is more meaningful.`},{id:`o3`,text:`Offer whole grapes and popcorn as ideal unsupervised snacks.`,correct:!1,reason:`These are choking hazards.`},{id:`o4`,text:`Force the child to finish an adult-sized plate.`,correct:!1,reason:`This ignores developmental portions and hunger cues.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Toddler nutrition and choking prevention.`},{label:`ATI RN Nursing Care of Children, edition 11 — related toddler nutrition and choking prevention content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Normal appetite variation still requires structure and food safety.`,rationale:`Support nutrition without coercion, and distinguish normal variation from poor growth or feeding dysfunction.`},{id:`e309`,topic:`Growth`,area:`growth_safety`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Safety`,`Care management`],stem:`Before vaccination, a caregiver reports the child had trouble breathing and required emergency treatment immediately after a prior dose of the same vaccine. What should the nurse do?`,options:[{id:`o0`,text:`Hold administration and obtain clinician review of a possible severe allergic reaction.`,correct:!0,reason:`A suspected serious reaction to a previous dose requires evaluation before repeat exposure.`},{id:`o1`,text:`Give the dose quickly while the child is calm.`,correct:!1,reason:`Convenience does not override a potential contraindication.`},{id:`o2`,text:`Dismiss the event because it happened several months ago.`,correct:!1,reason:`The reaction history remains relevant.`},{id:`o3`,text:`Give half the dose without discussing the history.`,correct:!1,reason:`Unprescribed dose reduction does not resolve the allergy concern.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Immunization screening.`},{label:`ATI RN Nursing Care of Children, edition 11 — related immunization screening content (supplement).`},{label:`CDC · Child immunization schedule notes (consult current schedule)`,url:`https://www.cdc.gov/vaccines/hcp/imz-schedules/child-adolescent-notes.html`}],origin:`Original expanded-bank scenario`,clue:`The pre-vaccination history identifies a potentially serious prior reaction.`,rationale:`Use screening to identify contraindications and precautions. Verify the reaction and current vaccine guidance before proceeding.`},{id:`e310`,topic:`Growth`,area:`growth_preschool`,difficulty:2,kind:`MC`,skills:[`Care management`,`Safety`],stem:`A 4-year-old fears that "all my blood will fall out" after a small blood draw. Which intervention best addresses this concern?`,options:[{id:`o0`,text:`Give a concrete explanation, show where the small dressing will go, and allow safe medical play.`,correct:!0,reason:`Preschoolers may have poorly defined body boundaries and benefit from concrete reassurance.`},{id:`o1`,text:`Explain blood volume using only percentages and abstract physiology.`,correct:!1,reason:`Abstract detail may not address the child's developmental fear.`},{id:`o2`,text:`Promise the procedure will not hurt at all.`,correct:!1,reason:`False reassurance can undermine trust.`},{id:`o3`,text:`Tell the child the fear is silly.`,correct:!1,reason:`Dismissal increases distress and blocks communication.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Preschool body image and procedures.`},{label:`ATI RN Nursing Care of Children, edition 11 — related preschool body image and procedures content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The concern reflects the child's understanding of bodily integrity.`,rationale:`Address the actual fear with honest, developmentally appropriate preparation rather than more technical detail.`},{id:`e311`,topic:`Growth`,area:`growth_school`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`],stem:`A school-age child will help with a simple home dressing change. Which teaching strategy best evaluates readiness?`,options:[{id:`o0`,text:`Demonstrate the steps, then ask the child to show them back with caregiver supervision.`,correct:!0,reason:`Concrete demonstration and return demonstration assess practical understanding.`},{id:`o1`,text:`Assume the child understands because a handout was provided.`,correct:!1,reason:`Information delivery alone does not demonstrate skill.`},{id:`o2`,text:`Teach only through hypothetical analogies.`,correct:!1,reason:`Concrete steps are more useful for this task and developmental stage.`},{id:`o3`,text:`Exclude the caregiver once the child names the supplies.`,correct:!1,reason:`Naming equipment does not establish independent safe performance.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Concrete operational learning.`},{label:`ATI RN Nursing Care of Children, edition 11 — related concrete operational learning content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A hands-on care task requires observed performance, not only verbal recall.`,rationale:`Support age-appropriate participation while maintaining the supervision needed for safety.`},{id:`e312`,topic:`Growth`,area:`growth_adolescent`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Safety`],stem:`A 14-year-old with a chronic condition understands the treatment but misses doses during activities with friends. Which approach is best?`,options:[{id:`o0`,text:`Collaborate on a workable routine that fits peer activities and assess barriers without blame.`,correct:!0,reason:`Knowledge alone may not solve adherence challenges related to daily life and identity.`},{id:`o1`,text:`Repeat the same lecture and avoid asking why doses are missed.`,correct:!1,reason:`More information may not address the actual obstacle.`},{id:`o2`,text:`Transfer all responsibility to the adolescent immediately because of age.`,correct:!1,reason:`Independence should reflect demonstrated readiness and support needs.`},{id:`o3`,text:`Forbid all peer contact indefinitely.`,correct:!1,reason:`This ignores an important developmental need and may undermine collaboration.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Adolescent self-management.`},{label:`ATI RN Nursing Care of Children, edition 11 — related adolescent self-management content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The problem is implementation in daily life, not simply lack of knowledge.`,rationale:`Build self-management skills with the adolescent and caregiver as appropriate, balancing autonomy and safety.`},{id:`e313`,topic:`Growth`,area:`growth_adolescent`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Safety`,`Care management`],stem:`A caregiver answers every question during an adolescent health visit. What is the best nursing approach for a sensitive risk assessment?`,options:[{id:`o0`,text:`Arrange appropriate private discussion and explain confidentiality and its safety-related limits.`,correct:!0,reason:`Privacy can support honest disclosure, while limits should be clear and consistent with policy and law.`},{id:`o1`,text:`Promise absolute secrecy regardless of immediate danger.`,correct:!1,reason:`Some safety concerns require protective action.`},{id:`o2`,text:`Ask sensitive questions loudly in the hallway.`,correct:!1,reason:`This does not protect privacy.`},{id:`o3`,text:`Skip the adolescent's own account because the caregiver already answered.`,correct:!1,reason:`The adolescent's perspective is essential to assessment.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Adolescent health assessment.`},{label:`ATI RN Nursing Care of Children, edition 11 — related adolescent health assessment content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A meaningful risk assessment requires the adolescent's own voice.`,rationale:`Create a respectful private setting and avoid making confidentiality promises that cannot be kept.`},{id:`e314`,topic:`Growth`,area:`growth_safety`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Safety`,`Care management`],stem:`A caregiver wants to move a toddler from rear-facing to forward-facing because the child's feet touch the vehicle seat. The child remains within the rear-facing height and weight limits. Which response is best?`,options:[{id:`o0`,text:`Follow the seat manufacturer's rear-facing limits rather than using foot contact alone as the reason to turn the seat.`,correct:!0,reason:`Leg position alone does not establish that the child has outgrown rear-facing protection.`},{id:`o1`,text:`Turn the seat because any bent knee causes serious injury.`,correct:!1,reason:`This is not the appropriate criterion.`},{id:`o2`,text:`Use a booster seat without a harness to create legroom.`,correct:!1,reason:`This does not match the toddler's restraint needs.`},{id:`o3`,text:`Place the rear-facing seat in front of an active passenger airbag.`,correct:!1,reason:`This exposes the child to severe airbag injury risk.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Car-seat safety.`},{label:`ATI RN Nursing Care of Children, edition 11 — related car-seat safety content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Fit within the manufacturer's limits matters more than a comfort assumption.`,rationale:`Use age-appropriate restraints correctly and keep young children in the back seat, following both vehicle and restraint instructions.`},{id:`e315`,topic:`Growth`,area:`growth_safety`,difficulty:2,kind:`SATA`,skills:[`Safety`,`Care management`],stem:`Which caregiver plans reduce drowning risk for a toddler? Select all that apply.`,options:[{id:`o0`,text:`Use close, attentive supervision around water, including bathtubs.`,correct:!0,reason:`Toddlers can drown quickly in small amounts of water.`},{id:`o1`,text:`Maintain a barrier separating the pool from the house and play area.`,correct:!0,reason:`A physical barrier reduces unintended access.`},{id:`o2`,text:`Empty buckets and other water containers after use.`,correct:!0,reason:`Standing water creates a hazard beyond pools.`},{id:`o3`,text:`Rely on swimming lessons instead of supervision.`,correct:!1,reason:`Swimming ability does not remove the need for close supervision.`},{id:`o4`,text:`Allow an older child to be the sole bathtub supervisor.`,correct:!1,reason:`A responsible adult should provide supervision.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Drowning prevention.`},{label:`ATI RN Nursing Care of Children, edition 11 — related drowning prevention content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Prevention must address access and supervision in ordinary home environments.`,rationale:`Layer practical protections instead of relying on one skill or one piece of equipment.`},{id:`e316`,topic:`Growth`,area:`growth_safety`,difficulty:2,kind:`MC`,skills:[`Safety`,`Care management`],stem:`A grandparent keeps medicines in an unlocked purse because the bottles have child-resistant caps. Which teaching has priority?`,options:[{id:`o0`,text:`Store medicines locked and out of sight and reach; child-resistant does not mean childproof.`,correct:!0,reason:`Children may open resistant packaging or access unsecured doses.`},{id:`o1`,text:`Teach the toddler to identify pills by color as the only safeguard.`,correct:!1,reason:`Developmental ability and curiosity make this unreliable prevention.`},{id:`o2`,text:`Transfer pills to a candy container for easier counting.`,correct:!1,reason:`This increases confusion and removes labeling.`},{id:`o3`,text:`Leave the purse on a higher chair.`,correct:!1,reason:`A mobile toddler can climb or pull it down.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Poison prevention.`},{label:`ATI RN Nursing Care of Children, edition 11 — related poison prevention content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Packaging is being treated as complete access protection.`,rationale:`Reduce access with secure storage while retaining original labels and keeping emergency contact information available.`},{id:`e317`,topic:`Growth`,area:`growth_safety`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Safety`,`Care management`],stem:`A 22-kg child is prescribed 30 mg/kg/day of a medication in three equal doses. The bottle contains 100 mg/5 mL. What volume should the nurse prepare for each dose after verifying the order?`,options:[{id:`o0`,text:`11 mL.`,correct:!0,reason:`22 × 30 = 660 mg/day; 660/3 = 220 mg/dose; 220 × 5/100 = 11 mL.`},{id:`o1`,text:`33 mL.`,correct:!1,reason:`This gives the entire calculated daily volume as one dose.`},{id:`o2`,text:`3.7 mL.`,correct:!1,reason:`This divides the already divided dose again.`},{id:`o3`,text:`22 mL.`,correct:!1,reason:`This is twice the ordered dose volume.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Pediatric medication calculation.`},{label:`ATI RN Nursing Care of Children, edition 11 — related pediatric medication calculation content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The prescription states mg/kg/day, not mg/kg per dose.`,rationale:`Separate the daily calculation from each administration and verify the concentration before converting to volume.`},{id:`e318`,topic:`Growth`,area:`growth_infant`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Safety`,`Care management`],stem:`A caregiver of a 4-month-old is diluting formula with extra water to make the supply last. What is the best nursing response?`,options:[{id:`o0`,text:`Explain safe preparation, assess the infant, and connect the family with immediate nutrition resources.`,correct:!0,reason:`Over-dilution can cause inadequate nutrition and electrolyte problems; access must also be addressed.`},{id:`o1`,text:`Recommend continuing dilution if the infant appears content.`,correct:!1,reason:`Appearance alone does not establish adequate intake or electrolyte safety.`},{id:`o2`,text:`Provide preparation instructions without discussing the lack of formula.`,correct:!1,reason:`Teaching alone leaves the stated resource barrier unresolved.`},{id:`o3`,text:`Suggest replacing all feeds with plain water.`,correct:!1,reason:`This is nutritionally inadequate and unsafe.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Infant nutrition.`},{label:`ATI RN Nursing Care of Children, edition 11 — related infant nutrition content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A feeding-safety problem is driven by an access problem.`,rationale:`Combine assessment and correct teaching with practical support, avoiding blame while ensuring a safe feeding plan.`},{id:`e319`,topic:`Growth`,area:`growth_infant`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`],stem:`A 9-month-old cries as an unfamiliar nurse approaches for a nonurgent examination. Which approach is most appropriate?`,options:[{id:`o0`,text:`Begin with observation while the caregiver holds the infant, then proceed gradually.`,correct:!0,reason:`Caregiver proximity and less invasive steps support security and cooperation.`},{id:`o1`,text:`Separate the infant from the caregiver immediately.`,correct:!1,reason:`Unnecessary separation can intensify distress.`},{id:`o2`,text:`Diagnose pain solely because the infant cries on approach.`,correct:!1,reason:`Crying must be interpreted with context and assessment.`},{id:`o3`,text:`Abandon all needed assessment because fear is expected.`,correct:!1,reason:`Developmental adaptation allows assessment to continue appropriately.`}],refs:[{label:`Week 6 Exam 2 Healthy Child Growth and Development Instructor Notes — Stranger anxiety and examination.`},{label:`ATI RN Nursing Care of Children, edition 11 — related stranger anxiety and examination content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Distress begins with an unfamiliar person's approach, not a specific painful maneuver.`,rationale:`Account for stranger anxiety without dismissing other causes of distress or omitting necessary care.`},{id:`e320`,topic:`Skin`,area:`skin_infection`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Care management`,`Pharmacology`],stem:`A child has localized impetigo and prescribed topical mupirocin. Which instructions should the nurse include? Select all that apply.`,options:[{id:`o0`,text:`Use the medication for the prescribed course.`,correct:!0,reason:`Improvement does not justify an unplanned early stop.`},{id:`o1`,text:`Perform hand hygiene and avoid sharing towels.`,correct:!0,reason:`Contact with drainage and contaminated items can spread infection.`},{id:`o2`,text:`Report spreading redness, increasing pain, or fever.`,correct:!0,reason:`These may indicate a worsening or deeper infection.`},{id:`o3`,text:`Scrub lesions until they bleed before every dose.`,correct:!1,reason:`Traumatizing skin can worsen injury and spread infection.`},{id:`o4`,text:`Use leftover corticosteroid cream as the only treatment.`,correct:!1,reason:`Corticosteroids do not eradicate the bacterial infection.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Impetigo treatment.`},{label:`Week 7 Children & Integumentary lecture — slide(s) 5.`},{label:`ATI RN Nursing Care of Children, edition 11 — related impetigo treatment content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Treatment and transmission prevention are both needed.`,rationale:`Combine appropriate antimicrobial use with skin protection and recognition of deterioration.`},{id:`e321`,topic:`Skin`,area:`skin_infection`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Pharmacology`,`Care management`],stem:`After correctly applying a head-lice treatment, a caregiver plans to use three other pediculicides on the same evening because nits remain visible. What is the best response?`,options:[{id:`o0`,text:`Advise against combining products and review the product-specific combing and retreatment instructions.`,correct:!0,reason:`Extra or mixed treatments can cause harm; visible nits alone do not justify repeated dosing that evening.`},{id:`o1`,text:`Recommend all three products to cover every stage at once.`,correct:!1,reason:`Combining therapies without guidance increases adverse-effect risk.`},{id:`o2`,text:`Spray household insecticide directly onto the scalp.`,correct:!1,reason:`Household insecticide is not an appropriate scalp treatment.`},{id:`o3`,text:`Stop inspecting household contacts because treatment was started.`,correct:!1,reason:`Contact assessment remains relevant to reinfestation control.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Head lice treatment.`},{label:`Week 7 Children & Integumentary lecture — slide(s) 7.`},{label:`ATI RN Nursing Care of Children, edition 11 — related head lice treatment content (supplement).`},{label:`CDC · Head lice treatment`,url:`https://www.cdc.gov/lice/treatment/index.html`}],origin:`Original expanded-bank scenario`,clue:`Persistent nits are prompting unsafe medication escalation.`,rationale:`Use the correct product as directed and evaluate possible failure or reinfestation with a clinician rather than adding uncontrolled exposure.`},{id:`e322`,topic:`Skin`,area:`skin_infection`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Pharmacology`,`Care management`],stem:`A family treats one child's scabies correctly, but close household contacts remain untreated. The child later develops new burrows. Which issue should the nurse address first?`,options:[{id:`o0`,text:`Coordinate evaluation and simultaneous treatment of close contacts according to the care plan.`,correct:!0,reason:`Ongoing exposure can cause reinfestation even after correct individual treatment.`},{id:`o1`,text:`Assume itching proves a new drug allergy without reassessing exposure.`,correct:!1,reason:`Itching has multiple explanations and new burrows suggest ongoing infestation.`},{id:`o2`,text:`Recommend daily scabicide indefinitely without a prescription.`,correct:!1,reason:`Excessive treatment can irritate skin and does not replace contact management.`},{id:`o3`,text:`Tell the family only people with visible burrows can harbor mites.`,correct:!1,reason:`Contacts may require treatment before symptoms appear.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Scabies treatment.`},{label:`Week 7 Children & Integumentary lecture — slide(s) 6.`},{label:`ATI RN Nursing Care of Children, edition 11 — related scabies treatment content (supplement).`},{label:`CDC · Scabies treatment`,url:`https://www.cdc.gov/scabies/treatment/index.html`}],origin:`Original expanded-bank scenario`,clue:`Correct treatment of one person did not address the exposure network.`,rationale:`Distinguish reinfestation from residual itching and medication failure. Review contacts, timing, and environmental measures.`},{id:`e323`,topic:`Skin`,area:`skin_infection`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Pharmacology`,`Care management`],stem:`A child has diagnosed tinea capitis with patchy hair loss. The caregiver plans to use only an antifungal body cream instead of the prescribed oral medication. Which response is best?`,options:[{id:`o0`,text:`Explain that scalp hair-follicle infection generally requires systemic antifungal treatment as prescribed.`,correct:!0,reason:`A topical body cream alone may not adequately treat infection involving hair shafts and follicles.`},{id:`o1`,text:`Agree that any antifungal product works equally at every body site.`,correct:!1,reason:`Treatment differs by site and depth.`},{id:`o2`,text:`Recommend sharing hairbrushes to build immunity.`,correct:!1,reason:`Shared hair-care items can spread infection.`},{id:`o3`,text:`Advise stopping all treatment when the itching briefly decreases.`,correct:!1,reason:`Symptom relief does not establish eradication.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Tinea capitis.`},{label:`Week 7 Children & Integumentary lecture — slide(s) 11.`},{label:`ATI RN Nursing Care of Children, edition 11 — related tinea capitis content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The site is the scalp, not a small ringworm patch on the body.`,rationale:`Connect the formulation to the infection location and reinforce the ordered course and transmission precautions.`},{id:`e324`,topic:`Skin`,area:`skin_dermatitis`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Pharmacology`,`Care management`],stem:`Despite frequent diaper changes and barrier ointment, an infant has a persistent bright-red rash involving skin folds with small satellite lesions. Which plan should the nurse anticipate?`,options:[{id:`o0`,text:`Evaluation for candidal involvement and an appropriate prescribed antifungal in addition to skin care.`,correct:!0,reason:`Fold involvement and satellite lesions suggest more than simple irritant dermatitis.`},{id:`o1`,text:`Use vigorous scrubbing and alcohol wipes to remove the rash.`,correct:!1,reason:`Irritating measures can worsen skin breakdown.`},{id:`o2`,text:`Apply high-potency steroid under the diaper without an order.`,correct:!1,reason:`Occlusion and infant skin increase adverse-effect risk.`},{id:`o3`,text:`Stop changing wet diapers to avoid touching the skin.`,correct:!1,reason:`Prolonged moisture worsens dermatitis.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Diaper dermatitis and candidiasis.`},{label:`Week 7 Children & Integumentary lecture — slide(s) 2.`},{label:`ATI RN Nursing Care of Children, edition 11 — related diaper dermatitis and candidiasis content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The pattern and poor response to barrier care suggest a second process.`,rationale:`Reassess persistent dermatitis rather than repeating only the initial intervention. Continue gentle cleansing and moisture control.`},{id:`e325`,topic:`Skin`,area:`skin_dermatitis`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Pharmacology`,`Care management`],stem:`An adolescent taking isotretinoin reports a positive home pregnancy test. Which response has priority?`,options:[{id:`o0`,text:`Stop further doses and arrange immediate contact with the prescriber for pregnancy evaluation and counseling.`,correct:!0,reason:`Isotretinoin is highly teratogenic and pregnancy requires urgent specialist management.`},{id:`o1`,text:`Continue medication until the next routine dermatology appointment.`,correct:!1,reason:`Continued exposure can cause harm.`},{id:`o2`,text:`Reduce the dose by half and monitor acne.`,correct:!1,reason:`Dose reduction is not an appropriate response to pregnancy.`},{id:`o3`,text:`Promise that fetal effects are either certain or impossible.`,correct:!1,reason:`Individual outcome cannot be determined from this information.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Isotretinoin safety.`},{label:`Week 7 Children & Integumentary lecture — slide(s) 4.`},{label:`ATI RN Nursing Care of Children, edition 11 — related isotretinoin safety content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A known teratogenic medication is being used during a possible pregnancy.`,rationale:`Prevent additional exposure and coordinate prompt, nonjudgmental evaluation without predicting an individual outcome.`},{id:`e326`,topic:`Skin`,area:`skin_burns`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`],stem:`A child rescued from an enclosed-space fire has facial burns, soot near the mouth, and increasing hoarseness. Which action has priority?`,options:[{id:`o0`,text:`Escalate for urgent airway evaluation while providing prescribed oxygen and close respiratory monitoring.`,correct:!0,reason:`Airway swelling can progress rapidly after inhalation injury.`},{id:`o1`,text:`Complete a detailed burn-size calculation before assessing breathing.`,correct:!1,reason:`Airway risk precedes detailed surface-area estimation.`},{id:`o2`,text:`Apply topical ointment before calling the emergency team.`,correct:!1,reason:`Wound care does not address impending airway compromise.`},{id:`o3`,text:`Give oral fluids despite worsening hoarseness.`,correct:!1,reason:`Swallowing and airway safety require assessment first.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Burn emergency airway assessment.`},{label:`Week 7 Children & Integumentary lecture — slide(s) 12.`},{label:`ATI RN Nursing Care of Children, edition 11 — related burn emergency airway assessment content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Enclosed-space exposure and changing voice suggest inhalation injury.`,rationale:`Anticipate airway deterioration early. Do not wait for complete obstruction before mobilizing airway expertise.`},{id:`e327`,topic:`Skin`,area:`skin_burns`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`],stem:`A 20-kg child receiving ordered burn resuscitation has urine output 8 mL/hr, rising pulse, and cool extremities. The IV catheter appears patent. Which response is best?`,options:[{id:`o0`,text:`Report signs of inadequate perfusion and reassess the fluid plan and output measurement with the team.`,correct:!0,reason:`Low urine output plus poor perfusion suggests insufficient effective circulating volume or another complication.`},{id:`o1`,text:`Assume the calculated starting rate guarantees adequate resuscitation.`,correct:!1,reason:`Formulas provide a starting point; response guides ongoing care.`},{id:`o2`,text:`Give a diuretic without clarifying the cause of oliguria.`,correct:!1,reason:`Diuresis does not correct hypovolemia and may worsen it.`},{id:`o3`,text:`Stop all fluids because the burned skin looks swollen.`,correct:!1,reason:`Tissue edema does not prove adequate intravascular volume.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Burn fluid resuscitation.`},{label:`Week 7 Children & Integumentary lecture — slide(s) 12.`},{label:`ATI RN Nursing Care of Children, edition 11 — related burn fluid resuscitation content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Clinical response suggests perfusion is inadequate despite a running infusion.`,rationale:`Trend urine output with circulation findings and reassess therapy rather than relying on the initial calculation alone.`},{id:`e328`,topic:`Skin`,area:`skin_burns`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`],stem:`A child has a dry, leathery burn with a pale center and little pain in that central area. A caregiver says, "It cannot be serious if it does not hurt." Which response is best?`,options:[{id:`o0`,text:`Explain that deep burns can damage nerve endings, so little pain does not mean a minor injury.`,correct:!0,reason:`Loss of sensation can accompany full-thickness tissue injury.`},{id:`o1`,text:`Agree and recommend no further assessment.`,correct:!1,reason:`Pain intensity alone cannot determine burn severity.`},{id:`o2`,text:`Repeatedly scratch the center until pain occurs.`,correct:!1,reason:`This causes additional injury and is not necessary assessment.`},{id:`o3`,text:`Judge depth only from how loudly the child cries.`,correct:!1,reason:`Behavior is not a reliable single measure of tissue depth.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Burn depth and pain.`},{label:`Week 7 Children & Integumentary lecture — slide(s) 12.`},{label:`ATI RN Nursing Care of Children, edition 11 — related burn depth and pain content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A leathery, relatively insensate center can indicate deeper injury.`,rationale:`Assess depth, extent, location, and systemic effects together while treating pain in surrounding and injured tissue appropriately.`},{id:`e329`,topic:`Skin`,area:`skin_burns`,difficulty:2,kind:`SATA`,skills:[`Assessment`,`Care management`],stem:`A child is recovering from a major burn after stabilization. Which care measures support healing and function? Select all that apply.`,options:[{id:`o0`,text:`Coordinate adequate protein and calorie intake.`,correct:!0,reason:`Healing and recovery increase nutritional needs.`},{id:`o1`,text:`Plan pain relief before ordered wound care and therapy.`,correct:!0,reason:`Anticipatory analgesia improves tolerance and participation.`},{id:`o2`,text:`Follow prescribed positioning and range-of-motion plans.`,correct:!0,reason:`Rehabilitation helps prevent contractures while respecting graft precautions.`},{id:`o3`,text:`Keep every joint immobile throughout the entire recovery regardless of orders.`,correct:!1,reason:`Unnecessary prolonged immobility can worsen loss of function.`},{id:`o4`,text:`Ignore new wound odor, redness, or fever if the dressing is intact.`,correct:!1,reason:`Dressings do not exclude infection.`}],refs:[{label:`Week 7 Exam 2 Integumentary Instructor Notes — Burn healing and rehabilitation.`},{label:`Week 7 Children & Integumentary lecture — slide(s) 12.`},{label:`ATI RN Nursing Care of Children, edition 11 — related burn healing and rehabilitation content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Recovery requires nutrition, comfort, and function as well as wound coverage.`,rationale:`Coordinate care across disciplines and reassess for complications while following the individualized wound and graft plan.`},{id:`e330`,topic:`GI`,area:`gi_motility`,difficulty:2,kind:`MC`,skills:[`Care management`,`Safety`,`Teaching`],stem:`A caregiver of an infant with reflux plans to use an inclined sleeper after feeds. The infant has no individualized medical positioning exception. What should the nurse recommend?`,options:[{id:`o0`,text:`Use a firm, flat sleep surface and place the infant on the back for sleep.`,correct:!0,reason:`Reflux alone does not justify inclined or prone sleep positioning.`},{id:`o1`,text:`Use the incline because reflux always outweighs sleep-related breathing risk.`,correct:!1,reason:`Inclined sleep can create airway hazards.`},{id:`o2`,text:`Let the infant sleep in a car seat whenever indoors.`,correct:!1,reason:`Sitting devices are not routine sleep spaces outside their travel purpose.`},{id:`o3`,text:`Place pillows around the infant to prevent movement.`,correct:!1,reason:`Pillows introduce suffocation risk.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Infant reflux and sleep.`},{label:`Week 7 GI Dysfunction lecture — slide(s) 2.`},{label:`ATI RN Nursing Care of Children, edition 11 — related infant reflux and sleep content (supplement).`},{label:`AAP · Safe sleep for infants with reflux`,url:`https://www.healthychildren.org/English/tips-tools/ask-the-pediatrician/Pages/What-is-the-safest-sleep-solution-for-my-baby-with-reflux.aspx`}],origin:`Original expanded-bank scenario`,clue:`A feeding condition is being used to justify unsafe sleep equipment.`,rationale:`Separate supervised feeding positioning from sleep positioning. Current AAP guidance supports supine, flat sleep for most infants with reflux.`},{id:`e331`,topic:`GI`,area:`gi_motility`,difficulty:2,kind:`SATA`,skills:[`Care management`,`Pharmacology`,`Safety`],stem:`A school-age child has chronic constipation with stool leakage. Which interventions fit an effective care plan? Select all that apply.`,options:[{id:`o0`,text:`Explain that overflow soiling can occur around retained stool.`,correct:!0,reason:`Leakage is not necessarily intentional behavior or simple diarrhea.`},{id:`o1`,text:`Implement the prescribed disimpaction and maintenance bowel regimen.`,correct:!0,reason:`Clearing retention and preventing recurrence are both important.`},{id:`o2`,text:`Offer regular relaxed toilet opportunities and appropriate fiber and fluids.`,correct:!0,reason:`Consistent habits support bowel function.`},{id:`o3`,text:`Punish accidents to increase the child's motivation.`,correct:!1,reason:`Shame can worsen withholding and distress.`},{id:`o4`,text:`Give an antidiarrheal solely because liquid stool is leaking.`,correct:!1,reason:`This can worsen retention when overflow is the cause.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Constipation and encopresis.`},{label:`Week 7 GI Dysfunction lecture — slide(s) 4.`},{label:`ATI RN Nursing Care of Children, edition 11 — related constipation and encopresis content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Leakage coexists with longstanding stool retention.`,rationale:`Treat the constipation mechanism and support the child without blame. Evaluate response over time rather than stopping at the first soft stool.`},{id:`e332`,topic:`GI`,area:`gi_nutrition`,difficulty:2,kind:`MC`,skills:[`Care management`,`Teaching`,`Safety`],stem:`A child with celiac disease receives a lunch tray. Which meal is the best choice after verifying ingredients and avoiding cross-contact?`,options:[{id:`o0`,text:`Plain rice, unbreaded chicken, and steamed vegetables.`,correct:!0,reason:`These foods can be gluten-free when prepared without contaminating ingredients.`},{id:`o1`,text:`Barley soup with a wheat roll.`,correct:!1,reason:`Barley and wheat contain gluten.`},{id:`o2`,text:`Breaded chicken with ordinary wheat pasta.`,correct:!1,reason:`Breading and standard pasta commonly contain gluten.`},{id:`o3`,text:`Rye crackers with wheat-based gravy.`,correct:!1,reason:`Rye and wheat are incompatible with a gluten-free diet.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Celiac disease.`},{label:`Week 7 GI Dysfunction lecture — slide(s) 14.`},{label:`ATI RN Nursing Care of Children, edition 11 — related celiac disease content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Ingredient verification matters beyond a food's general name.`,rationale:`Teach reliable label checking and preparation practices. A food is not safe solely because the main ingredient appears gluten-free.`},{id:`e333`,topic:`GI`,area:`gi_nutrition`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A toddler with diarrhea is lethargic, tachycardic, and has cool mottled extremities with very little urine. What is the priority plan?`,options:[{id:`o0`,text:`Obtain urgent assessment and begin prescribed isotonic IV resuscitation for poor perfusion.`,correct:!0,reason:`These findings suggest severe dehydration or shock, beyond routine home oral rehydration.`},{id:`o1`,text:`Offer only juice and reassess tomorrow.`,correct:!1,reason:`Juice is not an appropriate substitute for resuscitation in a poorly perfused child.`},{id:`o2`,text:`Give a large solid meal before treating fluid loss.`,correct:!1,reason:`Perfusion takes priority over routine nutrition.`},{id:`o3`,text:`Delay escalation until a stool culture returns.`,correct:!1,reason:`Treatment of circulatory compromise cannot wait for the cause to be confirmed.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Acute infectious diarrhea.`},{label:`Week 7 GI Dysfunction lecture — slide(s) 18.`},{label:`ATI RN Nursing Care of Children, edition 11 — related acute infectious diarrhea content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The child shows systemic poor perfusion, not only increased stool frequency.`,rationale:`Match fluid support to severity and reassess the response closely. Address the immediate circulation problem while investigating the illness.`},{id:`e334`,topic:`GI`,area:`gi_emergency`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Care management`],stem:`A child being evaluated for painless rectal bleeding becomes pale and tachycardic. Which action is most important?`,options:[{id:`o0`,text:`Assess circulation, quantify bleeding, and prepare prescribed IV and laboratory support.`,correct:!0,reason:`Painless bleeding can still cause significant blood loss.`},{id:`o1`,text:`Reassure because absence of pain excludes a serious GI problem.`,correct:!1,reason:`Meckel diverticulum and other causes can bleed substantially without pain.`},{id:`o2`,text:`Wait for the scheduled scan before checking vital signs again.`,correct:!1,reason:`New deterioration requires current assessment.`},{id:`o3`,text:`Give an enema to identify the color of retained stool.`,correct:!1,reason:`This does not address perfusion and is not indicated without an order.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Meckel diverticulum.`},{label:`Week 7 GI Dysfunction lecture — slide(s) 8.`},{label:`ATI RN Nursing Care of Children, edition 11 — related meckel diverticulum content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Hemodynamic change establishes urgency even when the bleeding is painless.`,rationale:`Prioritize blood-loss assessment and stabilization rather than using pain as the only marker of severity.`},{id:`e335`,topic:`GI`,area:`gi_nutrition`,difficulty:2,kind:`MC`,skills:[`Assessment`,`Care management`,`Priority`],stem:`An adolescent with inflammatory bowel disease reports fatigue, frequent bloody stools, reduced intake, and missed school. Which assessment best guides the next care plan?`,options:[{id:`o0`,text:`Evaluate hydration, anemia risk, nutrition, and the effect of symptoms on daily functioning.`,correct:!0,reason:`The illness affects physiologic status and participation, both relevant to treatment.`},{id:`o1`,text:`Focus only on whether the adolescent is following school rules.`,correct:!1,reason:`This misses disease burden and immediate health needs.`},{id:`o2`,text:`Assume all abdominal symptoms are caused by anxiety.`,correct:!1,reason:`Objective bleeding requires medical assessment.`},{id:`o3`,text:`Recommend stopping prescribed therapy once one stool is normal.`,correct:!1,reason:`Isolated improvement does not establish sustained disease control.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Inflammatory bowel disease.`},{label:`Week 7 GI Dysfunction lecture — slide(s) 9.`},{label:`ATI RN Nursing Care of Children, edition 11 — related inflammatory bowel disease content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`The pattern includes blood loss, nutritional risk, and disrupted functioning.`,rationale:`Assess the full impact and coordinate ongoing GI and nutritional care without minimizing the adolescent's concerns.`},{id:`e336`,topic:`GI`,area:`gi_motility`,difficulty:3,kind:`MC`,skills:[`Care management`,`Safety`,`Priority`],stem:`A gastrostomy tube placed three days ago is accidentally pulled out. What is the nurse's priority response?`,options:[{id:`o0`,text:`Stop feeds, protect the site, and obtain urgent specialist guidance without blind reinsertion.`,correct:!0,reason:`A new tract may not be mature; blind replacement can enter the peritoneal cavity.`},{id:`o1`,text:`Insert any available tube and restart the feeding immediately.`,correct:!1,reason:`This risks malposition and leakage into the abdomen.`},{id:`o2`,text:`Wait until the next scheduled feeding to report it.`,correct:!1,reason:`Prompt assessment is needed and the tract can close.`},{id:`o3`,text:`Give the feeding through the open site with a syringe.`,correct:!1,reason:`This is unsafe and does not confirm access to the stomach.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Gastrostomy tube care.`},{label:`ATI RN Nursing Care of Children, edition 11 — related gastrostomy tube care content (supplement).`},{label:`Royal Children’s Hospital · Gastrostomy problems`,url:`https://www.rch.org.au/clinicalguide/guideline_index/Gastrostomy_Common_problems/`}],origin:`Original expanded-bank scenario`,clue:`This is a newly created, potentially immature tract.`,rationale:`Tube-displacement management depends on tract maturity and the prescribed replacement protocol. Protect the patient while obtaining qualified assistance.`},{id:`e337`,topic:`GI`,area:`gi_emergency`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Priority`,`Safety`],stem:`A toddler has swallowed a household cleaner and is drooling with a hoarse voice and difficulty swallowing. Which action has priority?`,options:[{id:`o0`,text:`Obtain emergency airway assessment and contact poison specialists while avoiding forced oral intake.`,correct:!0,reason:`Airway injury and impaired swallowing make this an emergency.`},{id:`o1`,text:`Induce vomiting to remove the chemical.`,correct:!1,reason:`Re-exposure can worsen corrosive injury.`},{id:`o2`,text:`Give an acid or base to neutralize the cleaner.`,correct:!1,reason:`Chemical neutralization can generate heat and worsen burns.`},{id:`o3`,text:`Force a large glass of water despite difficulty swallowing.`,correct:!1,reason:`This can cause aspiration in a child with impaired airway protection.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Corrosive ingestion.`},{label:`ATI RN Nursing Care of Children, edition 11 — related corrosive ingestion content (supplement).`},{label:`Poison Control · First aid for poisonings`,url:`https://www.poison.org/first-aid-for-poisonings`}],origin:`Original expanded-bank scenario`,clue:`Drooling and voice change suggest airway or swallowing injury.`,rationale:`Airway and breathing take priority. Follow poison-specific guidance without improvising vomiting, neutralization, or unsafe oral treatment.`},{id:`e338`,topic:`GI`,area:`gi_emergency`,difficulty:2,kind:`MC`,skills:[`Care management`,`Pharmacology`,`Safety`],stem:`A child has received prescribed chelation for lead poisoning but will return to a home with an unresolved lead source. Which discharge action is most important?`,options:[{id:`o0`,text:`Coordinate removal from ongoing exposure and a safe housing/environmental follow-up plan.`,correct:!0,reason:`Treatment cannot prevent renewed exposure if the source remains accessible.`},{id:`o1`,text:`Explain that chelation makes future lead exposure harmless.`,correct:!1,reason:`Chelation does not create immunity.`},{id:`o2`,text:`Cancel repeat lead testing because medication was administered.`,correct:!1,reason:`Follow-up is needed to assess response and possible re-exposure.`},{id:`o3`,text:`Recommend dry sanding peeling old paint while the child is present.`,correct:!1,reason:`This can spread contaminated dust and increase exposure.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Lead poisoning.`},{label:`Week 7 GI Dysfunction lecture — slide(s) 19.`},{label:`ATI RN Nursing Care of Children, edition 11 — related lead poisoning content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`A successful medication course does not remove the environmental source.`,rationale:`Integrate medical follow-up with exposure prevention and appropriate environmental services.`},{id:`e339`,topic:`GI`,area:`gi_emergency`,difficulty:3,kind:`MC`,skills:[`Assessment`,`Pharmacology`,`Priority`],stem:`An adolescent with a possible aspirin overdose has rapid deep breathing, sweating, vomiting, and altered attention. Which action is most appropriate?`,options:[{id:`o0`,text:`Arrange immediate toxicology/emergency treatment with acid-base, glucose, electrolyte, and renal assessment.`,correct:!0,reason:`Salicylate toxicity can produce serious metabolic and neurologic deterioration.`},{id:`o1`,text:`Give a sedative solely to slow the breathing before assessment.`,correct:!1,reason:`Suppressing compensatory ventilation can worsen the physiologic disturbance.`},{id:`o2`,text:`Wait for jaundice to confirm poisoning.`,correct:!1,reason:`Jaundice is not required to act on suspected salicylate toxicity.`},{id:`o3`,text:`Assume hyperventilation proves an uncomplicated panic attack.`,correct:!1,reason:`Exposure history and systemic findings require urgent evaluation.`}],refs:[{label:`Week 7 Exam 2 GI Instructor Notes — Salicylate poisoning.`},{label:`Week 7 GI Dysfunction lecture — slide(s) 21.`},{label:`ATI RN Nursing Care of Children, edition 11 — related salicylate poisoning content (supplement).`}],origin:`Original expanded-bank scenario`,clue:`Rapid breathing may reflect toxic metabolic disturbance, not simply anxiety.`,rationale:`Recognize the poisoning pattern and support prompt specialist-directed management rather than suppressing a c
